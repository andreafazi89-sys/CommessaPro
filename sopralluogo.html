<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CommessaPro">
<meta name="theme-color" content="#0F0D0A">
<link rel="icon" href="logo-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sopralluogo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Epilogue:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="stile.css?v=2">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Epilogue',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}
.view{display:none;}.view.active{display:block;}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
.save-ind{font-size:11px;color:var(--muted);}.save-ind.ok{color:var(--green);}
.btn-top{background:var(--sand-dim);color:var(--sand);border:none;border-radius:8px;padding:7px 12px;font-family:Epilogue,sans-serif;font-size:12px;font-weight:500;cursor:pointer;}
.btn-back{color:var(--muted);background:none;border:none;cursor:pointer;font-size:22px;padding:0;}
.prog{display:flex;gap:6px;padding:8px 16px 0;}
.ps{height:3px;flex:1;background:var(--border);border-radius:2px;transition:background .3s;}.ps.done{background:var(--brick);}
.content{padding:16px 16px 220px;}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.sec-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sand);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-icon{width:28px;height:28px;background:var(--brick-dim);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.fg{margin-bottom:12px;}.fg:last-child{margin-bottom:0;}
label{display:block;font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
input,textarea,select{width:100%;padding:13px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--white);font-family:'Epilogue',sans-serif;font-size:16px;outline:none;transition:border-color .15s;-webkit-appearance:none;}
input:focus,textarea:focus,select:focus{border-color:var(--brick);}
input::placeholder,textarea::placeholder{color:var(--muted);}
textarea{resize:none;min-height:90px;line-height:1.6;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.voice-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px;}
.voice-play{width:40px;height:40px;background:var(--brick);color:#fff;border:none;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.voice-play.playing{background:var(--green);}
.voice-info{flex:1;}.voice-dur{font-size:12px;color:var(--muted);}.voice-lbl{font-size:13px;font-weight:500;}
.voice-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;}
.rec-btn{width:100%;padding:14px;border:none;border-radius:var(--r-sm);font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.rec-btn.idle{background:var(--surface2);color:var(--sand);border:1px solid var(--border);}
.rec-btn.recording{background:#C84040;color:#fff;animation:pulse-rec 1s infinite;}
@keyframes pulse-rec{0%,100%{opacity:1}50%{opacity:.7}}
.foto-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.foto-btn{padding:14px;background:var(--surface2);border:1.5px dashed var(--border);border-radius:var(--r-sm);text-align:center;cursor:pointer;}
.foto-btn:active{border-color:var(--brick);}
.foto-btn-icon{font-size:22px;margin-bottom:4px;}.foto-btn-lbl{font-size:12px;font-weight:500;color:var(--sand);}
input[type="file"]{display:none;}
.foto-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.foto-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--surface2);}
.foto-item img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-del{position:absolute;top:3px;right:3px;width:22px;height:22px;background:rgba(0,0,0,.75);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.foto-edit{position:absolute;top:3px;right:28px;width:22px;height:22px;background:rgba(0,0,0,.75);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.foto-num{position:absolute;bottom:3px;left:5px;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);}
.foto-order{position:absolute;bottom:3px;right:3px;display:flex;gap:2px;}
.foto-order button{width:20px;height:20px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:4px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.foto-order span{width:20px;}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:100;display:flex;flex-direction:column;gap:8px;}
.btn-main{width:100%;padding:16px;background:var(--brick);color:#fff;border:none;border-radius:var(--r);font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none;}
.btn-main:active{transform:scale(.98);background:#B53D10;}
.btn-main.green{background:var(--green);}.btn-main.green:active{background:#357A42;}
.btn-row{display:flex;gap:8px;}
.btn-sec{flex:1;padding:13px 10px;background:var(--surface2);color:var(--sand);border:1px solid var(--border);border-radius:var(--r);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;-webkit-appearance:none;}
.report-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:#fff;display:none;flex-direction:column;}
.report-overlay.show{display:flex;}
.report-topbar{background:#1A1612;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rep-title{font-family:'Syne',sans-serif;font-size:15px;color:#fff;font-weight:700;}
.rep-actions{display:flex;gap:8px;}
.rep-btn{padding:8px 14px;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.rep-btn.close{background:rgba(255,255,255,.1);color:#fff;}
.rep-btn.print{background:var(--brick);color:#fff;}
.report-frame{flex:1;border:none;width:100%;}
.rep-opzioni{display:flex;flex-wrap:wrap;gap:0 18px;padding:8px 16px;background:#2A241E;color:#fff;font-size:13px;flex-shrink:0;}
.rep-opzioni label{display:flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-size:13px;text-transform:none;letter-spacing:0;color:#fff;margin:0;}
.rep-opzioni input{width:20px;height:20px;accent-color:var(--brick);}
.rep-btn:disabled{opacity:.6;}
.sketch-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:#1A1612;display:none;flex-direction:column;}
.sketch-overlay.show{display:flex;}
.sketch-topbar{padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sk-tools{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.sk-tool{width:34px;height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer;background:rgba(255,255,255,.1);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;}
.sk-tool.active{border-color:#fff;}
.sketch-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px;}
#sketch-canvas{background:#fff;touch-action:none;border-radius:4px;}
.toast.ok{background:var(--green);color:#fff;}
.toast.err{background:#C8441A;color:#fff;}
.toast.inf{background:var(--surface2);color:var(--white);border:1px solid var(--border);}
.sop-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;}
.sop-card:active{border-color:var(--brick);}
.sop-riga{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sop-cod{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;}
.sop-nome{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sop-meta{font-size:13px;color:var(--muted);}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none;}
.pill.ok{background:var(--green-dim);color:var(--green);}
.pill.acc{background:var(--brick-dim);color:var(--brick);}
.pill.grigio{background:var(--surface2);color:var(--muted);}
.btn-top.pri{background:var(--brick);color:#fff;font-weight:700;}
.btn-top{min-height:40px;min-width:40px;}
.menu-wrap{position:relative;}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:220px;padding:6px;display:none;z-index:200;}
.menu-pop.show{display:block;}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:12px;font-family:Epilogue,sans-serif;font-size:15px;color:var(--white);cursor:pointer;}
.menu-pop button:active{background:var(--surface2);}
.btn-elimina{display:block;width:100%;margin-top:6px;padding:14px;background:none;border:1px solid var(--border);border-radius:var(--r-sm);color:#B3261E;font-family:Epilogue,sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-txt{font-size:15px;font-weight:500;color:var(--sand);margin-bottom:6px;}
.empty-sub{font-size:13px;}
.divider{height:1px;background:var(--border);margin:14px 0;}
</style>
</head>
<body>

<div id="view-lista" class="view active">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="index.html" style="color:var(--muted);text-decoration:none;font-size:22px">←</a>
      <div class="topbar-title">📋 Sopralluoghi</div>
    </div>
    <div style="display:flex;gap:8px">
      <div class="menu-wrap">
        <button class="btn-top" onclick="apriMenuLista(event)" title="Altre azioni" aria-label="Altre azioni" style="font-size:20px;line-height:1">⋯</button>
        <div class="menu-pop" id="menu-lista">
          <button onclick="chiudiMenuLista();forcSync()">🔄 Sincronizza</button>
          <button onclick="chiudiMenuLista();document.getElementById('import-input').click()">📥 Ripristina da backup</button>
          <button onclick="chiudiMenuLista();esportaDati()">📤 Esporta dati</button>
        </div>
      </div>
      <button class="btn-top pri" onclick="nuovoSopralluogo()">+ Nuovo</button>
    </div>
  </div>

<div class="content" style="padding-bottom:40px"><div id="lista-container"></div></div>
</div>

<div id="view-form" class="view">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-back" onclick="tornaLista()">←</button>
      <div class="topbar-title" id="form-title">Nuovo Sopralluogo</div>
    </div>
    <span class="save-ind" id="si">● bozza</span>
  </div>
  <div class="prog">
    <div class="ps" id="p0"></div><div class="ps" id="p1"></div>
    <div class="ps" id="p2"></div><div class="ps" id="p3"></div>
  </div>
  <div class="content">

    <div class="section">
      <div class="sec-title"><div class="sec-icon">👷</div>Responsabile</div>
      <div class="row2">
        <div class="fg"><label>Responsabile</label>
          <select id="f-resp" onchange="salva()">
            <option>Andrea Fazi</option><option>Rino Lenti</option>
          </select>
        </div>
        <div class="fg"><label>Data sopralluogo</label><input type="date" id="f-data" oninput="salva()"></div>
      </div>
      <div class="fg"><label>Titolo / Descrizione lavoro *</label><input type="text" id="f-titolo" placeholder="Es. Ristrutturazione bagno, Infiltrazione 3° piano..." oninput="salva()"></div>
      <div class="fg"><label>Commessa</label><input type="text" id="f-commessa" placeholder="Es. WFP, IFAD, SQUARE..." oninput="salva()"></div>
    </div>

    <div class="section">
      <div class="sec-title"><div class="sec-icon">👤</div>Cliente</div>
      <div class="fg"><label>Cliente *</label><select id="f-cli" onchange="cambiaCliente()"></select></div>
      <div class="fg" id="fg-ref" style="display:none"><label>Referente</label><select id="f-ref" onchange="cambiaReferente()"></select></div>
      <div class="fg" id="fg-fc" style="display:none"><label>Nome e Cognome *</label><input type="text" id="fc" placeholder="Es. Marco Rossi" oninput="salva()"></div>
      <div class="row2">
        <div class="fg"><label>Telefono</label><input type="tel" id="ft" placeholder="333 000 0000" oninput="salva()"></div>
        <div class="fg"><label>Email</label><input type="email" id="fe" placeholder="email@..." oninput="salva()"></div>
      </div>
      <div class="fg"><label>Indirizzo cantiere *</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="fi" placeholder="Si compila dalla sede del cliente" oninput="salva()" style="flex:1">
          <button type="button" onclick="geoLocalizza()" title="Usa posizione attuale" aria-label="Usa posizione attuale" style="width:46px;height:48px;background:var(--brick-dim);border:1.5px solid var(--brick);border-radius:var(--r-sm);font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center" id="geo-btn">📍</button>
          <button type="button" onclick="apriMappa()" title="Apri in Google Maps" aria-label="Apri in Google Maps" style="width:46px;height:48px;background:var(--brick-dim);border:1.5px solid var(--brick);border-radius:var(--r-sm);font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">🗺️</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sec-title"><div class="sec-icon">🔨</div>Lavorazioni richieste</div>
      <div class="fg"><textarea id="fl" placeholder="Descrivi le lavorazioni richieste dal cliente..." oninput="salva()"></textarea></div>
    </div>

    <div class="section">
      <div class="sec-title"><div class="sec-icon">🎙️</div>Note vocali
        <span id="rec-timer" style="margin-left:auto;font-size:12px;color:#C84040;font-family:Epilogue,sans-serif;text-transform:none;letter-spacing:0;font-weight:400;display:none">⏺ 0:00</span>
      </div>
      <div id="voice-list" style="margin-bottom:10px"></div>
      <button class="rec-btn idle" id="rec-btn" onclick="toggleRec()">
        <span id="rec-icon">🎙️</span><span id="rec-label">Inizia registrazione</span>
      </button>
    </div>

    <div class="section">
      <div class="sec-title"><div class="sec-icon">📝</div>Note aggiuntive</div>
      <div class="fg"><textarea id="fn" placeholder="Osservazioni, preferenze cliente, materiali richiesti..." oninput="salva()"></textarea></div>
    </div>

    <div class="section">
      <div class="sec-title">
        <div class="sec-icon">📷</div>Foto
        <span id="fnum" style="margin-left:auto;font-size:12px;color:var(--muted);font-family:Epilogue,sans-serif;text-transform:none;letter-spacing:0;font-weight:400">0 foto</span>
      </div>
      <div class="foto-btns">
        <div class="foto-btn" onclick="document.getElementById('fi-cam').click()">
          <div class="foto-btn-icon">📷</div><div class="foto-btn-lbl">Scatta foto</div>
        </div>
        <div class="foto-btn" onclick="document.getElementById('fi-lib').click()">
          <div class="foto-btn-icon">🖼️</div><div class="foto-btn-lbl">Dalla libreria</div>
        </div>
        <div class="foto-btn" onclick="apriSketchNuovo()">
          <div class="foto-btn-icon">✏️</div><div class="foto-btn-lbl">Schizzo</div>
        </div>
      </div>
      <input type="file" id="fi-cam" accept="image/*" capture="environment" multiple onchange="caricaFoto(this)">
      <input type="file" id="fi-lib" accept="image/*" multiple onchange="caricaFoto(this)">
      <div class="foto-grid" id="foto-grid"></div>
    </div>

    <button class="btn-elimina" onclick="eliminaDaScheda()">🗑 Elimina sopralluogo</button>
  </div>
  <div class="bottom-bar">
    <div class="btn-row">
      <button class="btn-sec" onclick="avvisaSegretariaSopralluogo()">📱 Apri commessa</button>
      <button class="btn-sec" onclick="generaReport()" style="flex:2">📄 Report PDF</button>
    </div>
    <button class="btn-main" id="btn-sviluppa" onclick="sviluppaSopralluogo()" style="display:none">📐 Sviluppa sopralluogo (fase 2)</button>
    <button class="btn-main green" id="btn-avvia" onclick="avviaCantiere()">🏗️ Avvia Cantiere</button>
  </div>
</div>

<div class="report-overlay" id="report-overlay">
  <div class="report-topbar">
    <div class="rep-title">📄 Report Sopralluogo</div>
    <div class="rep-actions">
      <button class="rep-btn close" onclick="chiudiReport()">✕ Chiudi</button>
      <button class="rep-btn print" id="rep-pdf" onclick="esportaPdf()">⬇️ PDF</button>
    </div>
  </div>
  <div class="rep-opzioni" id="rep-opzioni">
    <label><input type="checkbox" id="rep-cliente" checked onchange="aggiornaAnteprima()"> Cliente</label>
    <label><input type="checkbox" id="rep-cantiere" checked onchange="aggiornaAnteprima()"> Cantiere</label>
    <label><input type="checkbox" id="rep-lavori" checked onchange="aggiornaAnteprima()"> Lavorazioni richieste</label>
    <label><input type="checkbox" id="rep-note" checked onchange="aggiornaAnteprima()"> Note aggiuntive</label>
    <label><input type="checkbox" id="rep-foto" checked onchange="aggiornaAnteprima()"> Foto</label>
  </div>
  <iframe id="report-frame" class="report-frame"></iframe>
</div>

<div class="sketch-overlay" id="sketch-overlay">
  <div class="sketch-topbar">
    <button class="rep-btn close" onclick="chiudiSketch()">✕ Chiudi</button>
    <div class="sk-tools">
      <button class="sk-tool sk-col active" style="background:#111111" onclick="skSetColore('#111111',this)" title="Nero"></button>
      <button class="sk-tool sk-col" style="background:#C81E1E" onclick="skSetColore('#C81E1E',this)" title="Rosso"></button>
      <button class="sk-tool sk-col" style="background:#1D4ED8" onclick="skSetColore('#1D4ED8',this)" title="Blu"></button>
      <button class="sk-tool sk-siz active" style="font-size:10px" onclick="skSetSpessore(3,this)" title="Tratto fine">●</button>
      <button class="sk-tool sk-siz" style="font-size:20px" onclick="skSetSpessore(8,this)" title="Tratto grosso">●</button>
      <button class="sk-tool" id="sk-gomma" onclick="skToggleGomma()" title="Gomma">🧽</button>
      <button class="sk-tool" onclick="skAnnulla()" title="Annulla ultimo tratto">↩️</button>
    </div>
    <button class="rep-btn print" onclick="salvaSketch()">💾 Salva</button>
  </div>
  <div class="sketch-wrap" id="sketch-wrap"><canvas id="sketch-canvas"></canvas></div>
</div>

<input type="file" id="import-input" accept=".json" style="display:none" onchange="leggiImport(this)">
<div class="toast" id="toast"></div>

<script>
// ── GUARD AUTH: gira prima di qualsiasi lettura dati o render ──
(function(){
  let u=null; try{u=JSON.parse(localStorage.getItem('cp_user'))||null;}catch{}
  if(!u||!u.email){ window.location.replace('login.html'); return; }
  const ruolo=(u.ruolo||'').toLowerCase();
  if(!['admin','direzione','ufficio'].includes(ruolo)||(u.permessi||{}).sopralluogo==='hidden'){
    // Gli operai non fanno sopralluoghi: la coda locale non verrebbe mai accettata dal server
    if(ruolo==='operaio') localStorage.removeItem('cp_pending_sopralluoghi_v3');
    window.location.replace('index.html');
  }
})();

// ── SUPABASE ──
const SUPA_URL = 'https://iradzlocobsipjazracw.supabase.co';
const SUPA_KEY = 'sb_publishable_zFgRrNrmYSORug8N06heow_6vjl0fhH';
const LIST_KEY = 'sopralluoghi_v3';
// ── SEGRETARIA: configura qui numero WhatsApp (formato internazionale, no + né spazi) ──
const SEGRETARIA = {
  whatsapp: '393358413580'  // ← SOSTITUIRE con numero reale, es. '393331234567'
};

  if(window.supabase) db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
}
async function dbSalva(chiave, valore){
  if(!db){ toast('\u26a0\ufe0f Non sincronizzato: server non raggiungibile','err'); return false; }
  const { data:s } = await db.auth.getSession();
  if(!s || !s.session){
    toast('\u26a0\ufe0f Sessione scaduta: salvato solo su questo dispositivo','err');
    return false;
  }
  const { error } = await db.from('dati').upsert({chiave, valore, ts:new Date().toISOString()},{onConflict:'chiave'});
  if(error){
    console.error('dbSalva', chiave, error);
    toast('\u26a0\ufe0f Non sincronizzato: ' + error.message,'err');
    return false;
  }
  return true;
}
function __toastErr(msg){ toast('\u26a0\ufe0f ' + msg, 'err'); }

// ── SINCRONIZZAZIONE: scrittura chirurgica + coda offline ──
// Regola: la versione del server e' la base. Ogni dispositivo applica SOLO i
// record che ha appena toccato, quindi una copia locale vecchia non puo' piu'
// riportare indietro modifiche fatte altrove. Le cancellazioni sono marcature
// (eliminato:true) e non rimozioni, cosi' si propagano invece di tornare indietro.
function chiavePending(k){ return 'cp_pending_' + k; }
function getPending(k){ try{ return JSON.parse(localStorage.getItem(chiavePending(k))) || []; }catch{ return []; } }
function aggiungiPending(k, records){
  const m = new Map(getPending(k).map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(chiavePending(k), JSON.stringify([...m.values()]));
}
function svuotaPending(k){ localStorage.removeItem(chiavePending(k)); }
function scriviLocale(k, records){
  let attuali = [];
  try{ attuali = JSON.parse(localStorage.getItem(k)) || []; }catch(e){}
  const m = new Map(attuali.map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(k, JSON.stringify([...m.values()]));
}
function marcaEliminato(rec){ return {...rec, eliminato:true, timestamp:new Date().toISOString()}; }
async function salvaRecord(k, records){
  if(!Array.isArray(records) || !records.length) return true;
  scriviLocale(k, records);
  if(!db){ aggiungiPending(k, records); __toastErr('Salvato sul dispositivo, non ancora sincronizzato'); return false; }
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){
    console.error('salvaRecord lettura', k, error);
    aggiungiPending(k, records);
    __toastErr('Salvato sul dispositivo, non ancora sincronizzato');
    return false;
  }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const m = new Map(base.map(x => [x.id, x]));
  getPending(k).forEach(r => m.set(r.id, r));
  records.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  const ok = await dbSalva(k, finale);
  if(!ok){ aggiungiPending(k, records); return false; }
  svuotaPending(k);
  localStorage.setItem(k, JSON.stringify(finale));
  return true;
}
// Allinea la copia locale a quella del server, mantenendo le modifiche in coda
async function allinea(k){
  if(!db) return false;
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){ console.error('allinea', k, error); __toastErr('Lettura dal server non riuscita: ' + error.message); return false; }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const pend = getPending(k);
  const m = new Map(base.map(x => [x.id, x]));
  pend.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  localStorage.setItem(k, JSON.stringify(finale));
  if(pend.length){
    const ok = await dbSalva(k, finale);
    if(ok) svuotaPending(k);
  }
  return true;
}

async function salvaCantieriSicuro(lista){ return salvaRecord('cantieri_v1', lista); }
async function dbCarica(chiave){
  if(!db) return null;
  try{
    const {data} = await db.from('dati').select('valore').eq('chiave',chiave).maybeSingle();
    return data ? data.valore : null;
  }catch(e){ return null; }
}
async function forcSync(){
  toast('🔄 Sincronizzazione...','inf');
  const remoto = await dbCarica(LIST_KEY);
  if(remoto && Array.isArray(remoto) && remoto.length > 0){
    const locale = getLista();
    const locMap = new Map(locale.map(x => [x.id, x]));
    // FIX: merge intelligente
    // Per ogni sopralluogo remoto: se esiste una versione locale, manteniamo il LOCALE
    // (potrebbe avere foto che il remoto non ha ancora). Questo impedisce la perdita
    // di foto recenti quando il remoto è stato svuotato da versioni vecchie del codice.
    // Se il sopralluogo è solo remoto (mai visto in locale), lo prendiamo tal quale.
    const merged = remoto.map(r => {
      const l = locMap.get(r.id);
      if(!l) return r; // nuovo da remoto
      // Se il locale ha foto e il remoto no, tieni il locale (protezione perdita foto)
      const locFoto = (l.foto || []).length;
      const remFoto = (r.foto || []).length;
      if(locFoto > 0 && remFoto === 0) return l;
      // Altrimenti preferiamo i metadati più recenti del remoto
      // ma FONDENDO foto e noteVocali (unione senza duplicati per url)
      const foto = mergeArrayByKey(l.foto || [], r.foto || [], 'url');
      const noteVocali = mergeArrayByKey(l.noteVocali || [], r.noteVocali || [], 'url');
      return {...r, foto, noteVocali};
    });
    // Aggiungi sopralluoghi solo locali (mai visti in remoto)
    const remIds = new Set(remoto.map(x => x.id));
    const extra = locale.filter(x => !remIds.has(x.id));
    localStorage.setItem(LIST_KEY, JSON.stringify([...merged, ...extra]));
    getPending(LIST_KEY).forEach(r => scriviLocale(LIST_KEY, [r]));
    renderLista();
  }
  toast('✓ Sincronizzato','ok');
}

// Utility: unisce due array di oggetti deduplicando per una chiave
function mergeArrayByKey(a, b, key){
  const seen = new Set();
  const out = [];
  [...a, ...b].forEach(item => {
    const v = item?.[key];
    if(v && !seen.has(v)){ seen.add(v); out.push(item); }
    else if(!v){ out.push(item); } // se manca la chiave, lo teniamo lo stesso
  });
  return out;
}

// ── LISTA ──
function getLista(){ try{return (JSON.parse(localStorage.getItem(LIST_KEY))||[]).filter(s=>!s.eliminato);}catch{return[];} }
// Toglie dal record le foto e le note vocali non ancora caricate sul cloud,
// che resterebbero come base64 e gonfierebbero il salvataggio sul server.
function alleggerisci(s){
  const fotoOk = (s.foto||[]).filter(f => typeof (f && f.url) === 'string' && f.url.startsWith('http'));
  const noteOk = (s.noteVocali||[]).filter(n => { const u = (n && (n.url||n.b64)) || ''; return typeof u === 'string' && u.startsWith('http'); });
  return {...s, foto:fotoOk, noteVocali:noteOk};
}
// Salva UN sopralluogo: copia locale completa, sul server solo quel record
async function salvaSopralluogo(rec){
  scriviLocale(LIST_KEY, [rec]);
  exportAutoDebounced();
  const ok = await salvaRecord(LIST_KEY, [alleggerisci(rec)]);
  scriviLocale(LIST_KEY, [rec]);
  return ok;
}
function salveLista(l){
  localStorage.setItem(LIST_KEY,JSON.stringify(l));
  exportAutoDebounced();
  // FIX: d'ora in poi foto e note vocali vengono salvate SU SUPABASE come URL (non base64).
  // Quindi il record è leggero anche se ha foto. Non svuotiamo più nulla.
  // Però se c'è ancora qualche foto base64 vecchia (data:image/...), la rimuoviamo
  // prima del sync per evitare payload giganti.
  const lLight = l.map(s => {
    const fotoOk = (s.foto || []).filter(f => {
      const u = f?.url || '';
      return typeof u === 'string' && u.startsWith('http'); // tiene solo URL cloud
    });
    const noteOk = (s.noteVocali || []).filter(n => {
      const u = n?.url || n?.b64 || '';
      return typeof u === 'string' && u.startsWith('http');
    });
    return {...s, foto: fotoOk, noteVocali: noteOk};
  });
  dbSalva(LIST_KEY, lLight);
}

let mostraArchiviati=false;
function toggleArchiviati(){ mostraArchiviati=!mostraArchiviati; renderLista(); }
function ordinaPerCommessa(a,b){
  const ca=(a.commessa||'').trim(), cb=(b.commessa||'').trim();
  if(!ca && !cb) return 0;
  if(!ca) return -1;
  if(!cb) return 1;
  return cb.localeCompare(ca,'it',{numeric:true,sensitivity:'base'});
}
function renderLista(){
  const tutti=getLista();
  const lista=tutti.filter(s=>mostraArchiviati ? s.archiviato : !s.archiviato).sort(ordinaPerCommessa);
  const nArch=tutti.filter(s=>s.archiviato).length;
  const el=g('lista-container');
  const barra = nArch ? `<div style="margin-bottom:10px"><button onclick="toggleArchiviati()" style="width:100%;padding:9px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:${mostraArchiviati?'var(--brick)':'var(--muted)'};font-size:12px;font-weight:600;font-family:inherit;cursor:pointer">${mostraArchiviati?'← Torna ai sopralluoghi attivi':'🗄 Mostra archiviati ('+nArch+')'}</button></div>` : '';
  if(!lista.length){
    el.innerHTML=barra+`<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-txt">${mostraArchiviati?'Nessun sopralluogo archiviato':'Nessun sopralluogo'}</div><div class="empty-sub">${mostraArchiviati?'':'Premi "+ Nuovo" per iniziare'}</div></div>`;
    return;
  }
  el.innerHTML=barra+lista.map(s=>`
    <div class="sop-card" onclick="apriSopralluogo('${s.id}')">
      <div class="sop-riga"><div class="sop-cod">${[s.commessa,dataIt(s.data)].filter(Boolean).join(' · ')||'—'}</div>${pillSopralluogo(s)}</div>
      <div class="sop-nome">${s.titolo||s.cliente||'Sopralluogo senza titolo'}</div>
      <div class="sop-meta">${[s.cliente,s.indirizzo].filter(Boolean).join(' · ')||'—'}</div>
    </div>`).join('');
}

// Stato del sopralluogo in elenco: una sola etichetta, la piu avanzata
function pillSopralluogo(s){
  if(s.archiviato) return `<span class="pill grigio">Archiviato ${dataIt(s.archiviatoIl)}</span>`;
  if(s.cantiereId) return '<span class="pill ok">Cantiere avviato</span>';
  if(s.sviluppo&&s.sviluppo.aggiornato) return '<span class="pill acc">Fase 2</span>';
  return '';
}
// Data ISO (aaaa-mm-gg) in formato gg/mm/aaaa; altri formati restano come sono
function dataIt(d){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?`${m[3]}/${m[2]}/${m[1]}`:(d||'');}
function apriMenuLista(e){e.stopPropagation();g('menu-lista').classList.toggle('show');}

// Elimina dalla scheda aperta (il cestino non sta piu in elenco: niente cancellazioni per sbaglio)
function eliminaDaScheda(){
  if(!currentId||!confirm('Eliminare questo sopralluogo?')) return;
  // Un salvataggio automatico in sospeso non deve far ricomparire la scheda
  clearTimeout(saveTimer);
  const s = getLista().find(x => x.id === currentId);
  if(s) salvaRecord(LIST_KEY, [{...alleggerisci(s), eliminato:true}]);
  tornaLista(); toast('Eliminato','inf');
}

// ── AUTOSAVE ──
function salva(){
  aggiornaProg(); clearTimeout(saveTimer);
  g('si').textContent='● salvando...'; g('si').className='save-ind';
  saveTimer=setTimeout(salvaOra,800);
}
async function salvaOra(){
  clearTimeout(saveTimer); saveTimer=null;
  {
    const lista=getLista(); const idx=lista.findIndex(s=>s.id===currentId);
    // Parte dal record esistente: i campi che il form non gestisce (fase 2,
    // archiviazione, ecc.) non devono andare persi a ogni salvataggio
    const prec=idx>=0?lista[idx]:{};
    const dati={...prec,id:currentId,resp:gv('f-resp'),data:gv('f-data'),titolo:gv('f-titolo'),commessa:gv('f-commessa'),cliente:gv('fc'),tel:gv('ft'),email:gv('fe'),
      indirizzo:gv('fi'),lavori:gv('fl'),note:gv('fn'),
      lat:currentLat,lon:currentLon,
      clienteRubrica:(g('f-cli').value&&g('f-cli').value!==CLI_ALTRO)?g('f-cli').value:'',
      referenteId:(g('f-ref').value&&g('f-ref').value!==REF_NUOVO)?g('f-ref').value:'',
      foto,noteVocali:noteVocali.map(n=>({dur:n.dur,b64:n.b64,type:n.type})),
      cantiereId:(idx>=0?lista[idx].cantiereId:null)||null};
    try{
      const esito=salvaSopralluogo(dati);
      g('si').textContent='✓ salvato'; g('si').className='save-ind ok';
      // Aggiorna il cantiere collegato se esiste
      if(dati.cantiereId) aggiornaCantiere(dati);
      aggiornaBottoneSviluppa();
      return await esito;
    }
    catch(e){ g('si').textContent='● bozza'; toast('Spazio pieno','err'); return false; }
  }
}

function aggiornaCantiere(sop){
  const cantieri = getCantieri();
  const idx = cantieri.findIndex(c=>c.id===sop.cantiereId);
  if(idx<0) return;
  // Aggiorna solo i campi informativi, non le giornate o i costi
  cantieri[idx].cliente = sop.cliente;
  cantieri[idx].indirizzo = sop.indirizzo;
  cantieri[idx].resp = sop.resp;
  cantieri[idx].mq = sop.mq;
  cantieri[idx].commessa = sop.commessa;
  cantieri[idx].titolo = sop.titolo;
  salvaRecord('cantieri_v1', [cantieri[idx]]);
}

function aggiornaProg(){
  [[gv('f-titolo'),'p0'],[gv('fi'),'p1'],[gv('fl'),'p2'],[foto.length?'x':'','p3']].forEach(([v,id])=>{
    g(id)?.classList.toggle('done',!!v);

// ── NOTE VOCALI ──
async function toggleRec(){
  if(isRecording){fermaReg();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[]; recSeconds=0;
    let mimeType='audio/webm';
    if(MediaRecorder.isTypeSupported('audio/mp4')) mimeType='audio/mp4';
    mediaRecorder=new MediaRecorder(stream,{mimeType});
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(audioChunks,{type:mimeType});
      const reader=new FileReader();
      reader.onload=ev=>{
        noteVocali.push({dur:recSeconds,b64:ev.target.result,type:mimeType,url:null});
        renderNoteVocali(); salva();
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start(100); isRecording=true;
    g('rec-btn').className='rec-btn recording';
    g('rec-icon').textContent='⏹'; g('rec-label').textContent='Tocca per fermare';
    g('rec-timer').style.display='block';
    recInterval=setInterval(()=>{
      recSeconds++;
      const m=Math.floor(recSeconds/60),s=recSeconds%60;
      g('rec-timer').textContent=`⏺ ${m}:${s.toString().padStart(2,'0')}`;
    },1000);
  }catch(e){toast('Microfono non disponibile','err');}
}

function fermaReg(){
  if(!isRecording) return;
  isRecording=false; clearInterval(recInterval); mediaRecorder?.stop();
  g('rec-btn').className='rec-btn idle';
  g('rec-icon').textContent='🎙️'; g('rec-label').textContent='Inizia registrazione';
  g('rec-timer').style.display='none';
}

function renderNoteVocali(){
  const el=g('voice-list'); if(!noteVocali.length){el.innerHTML='';return;}
  const m_=n=>Math.floor(n.dur/60), s_=n=>(n.dur%60).toString().padStart(2,'0');
  el.innerHTML=noteVocali.map((n,i)=>`
    <div class="voice-item">
      <button class="voice-play" id="vp-${i}" onclick="playVoce(${i})">▶</button>
      <div class="voice-info"><div class="voice-lbl">Nota vocale ${i+1}</div><div class="voice-dur">${m_(n)}:${s_(n)}</div></div>
      <button class="voice-del" onclick="delVoce(${i})">🗑</button>
    </div>`).join('');
}

function playVoce(i){
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  document.querySelectorAll('.voice-play').forEach(b=>{b.textContent='▶';b.classList.remove('playing');});
  const n=noteVocali[i];
  const audio=new Audio(n.b64);
  currentAudio=audio;
  const btn=g('vp-'+i); btn.textContent='⏸'; btn.classList.add('playing');
  audio.play().catch(()=>toast('Impossibile riprodurre','err'));
  audio.onended=()=>{btn.textContent='▶';btn.classList.remove('playing');currentAudio=null;};
}
function delVoce(i){noteVocali.splice(i,1);renderNoteVocali();salva();}

// ── FOTO ──
function caricaFoto(input){
  const files = [...input.files];
  input.value = '';
  files.forEach(file => processaFoto(file));
}

// Carica un blob sul bucket "Foto" e ritorna il publicUrl (o lancia errore)
async function caricaBlobSuStorage(blob, path, contentType){
  if(!db){ throw new Error('No Supabase client'); }
  const {error} = await db.storage.from('Foto').upload(path, blob, {
    contentType: contentType,
    upsert: false
  });
  if(error){ throw error; }
  const {data} = db.storage.from('Foto').getPublicUrl(path);
  return data.publicUrl;
}

async function processaFoto(file){
  // 1) Comprimi l'immagine in locale (canvas → jpeg ~85% qualità, max 2000px)
  const compressedBlob = await comprimiImmagine(file, 2000, 0.85);
  // 2) Carica su Supabase Storage (bucket "Foto", cartella sopralluoghi/<sopId>)
  const fileName = Date.now() + '.jpg';
  const sopId = currentId || 'sop_' + Date.now();
  if(!currentId) currentId = sopId; // nel caso stia iniziando un nuovo sopralluogo
  const path = `sopralluoghi/${sopId}/${fileName}`;
  // Placeholder locale (base64) mostrato subito in UI durante upload
  const tempUrl = URL.createObjectURL(compressedBlob);
  const placeholder = {url: tempUrl, uploading: true, localPath: path};
  foto.push(placeholder);
  renderFoto();

  try{
    const publicUrl = await caricaBlobSuStorage(compressedBlob, path, 'image/jpeg');
    // Sostituisci il placeholder con l'URL vero
    const idx = foto.findIndex(f => f === placeholder);
    if(idx >= 0){
      foto[idx] = {url: publicUrl};
    }
    URL.revokeObjectURL(tempUrl);
    renderFoto();
    salva();
  }catch(e){
    console.error('Upload foto fallito:', e);
    // Rimuovi placeholder
    const idx = foto.findIndex(f => f === placeholder);
    if(idx >= 0) foto.splice(idx, 1);
    URL.revokeObjectURL(tempUrl);
    renderFoto();
    toast('⚠️ Foto non caricata (rete?)', 'inf');
  }
}

// Comprimi file immagine usando canvas, ritorna Blob JPEG
function comprimiImmagine(file, maxSide = 2000, quality = 0.85){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Lettura file fallita'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Immagine non valida'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSide){ h = Math.round(h * maxSide / w); w = maxSide; } }
        else    { if(h > maxSide){ w = Math.round(w * maxSide / h); h = maxSide; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('Compressione fallita')),
                      'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderFoto(){
  const totalKB = Math.round(foto.reduce((s,f) => {
    const u = f?.url || '';
    if(u.startsWith('data:')) return s + (u.length * 0.75 / 1024); // base64 legacy
    return s; // URL cloud non pesano localmente
  }, 0));
  const nf = foto.length;
  const uploading = foto.filter(f => f.uploading).length;
  let txt = nf + ' foto';
  if(totalKB > 0) txt += ' · ' + totalKB + 'KB';
  if(uploading > 0) txt += ' · ⏳ ' + uploading + ' in upload';
  g('fnum').textContent = txt;
  if(totalKB > 800) g('fnum').style.color = '#E05252';
  else g('fnum').style.color = 'var(--muted)';
  const grid = g('foto-grid');
  if(!foto.length){ grid.innerHTML = ''; aggiornaProg(); return; }
  grid.innerHTML = foto.map((f,i) => `
    <div class="foto-item" ${f.uploading ? 'style="opacity:0.6"' : ''}>
      <img src="${f.url}">
      ${f.uploading ? '<div style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.6);color:#fff;padding:2px 6px;border-radius:4px;font-size:10px">⏳ Upload…</div>' : ''}
      <button class="foto-del" onclick="delFoto(${i})">✕</button>
      ${!f.uploading ? `<button class="foto-edit" onclick="apriSketchFoto(${i})" title="Disegna sulla foto">✏️</button>` : ''}
      <span class="foto-num">${i+1}</span>
      <div class="foto-order">
        ${i>0?`<button onclick="muoviFoto(${i},-1)">◀</button>`:'<span></span>'}
        ${i<foto.length-1?`<button onclick="muoviFoto(${i},+1)">▶</button>`:'<span></span>'}
      </div>
    </div>`).join('');
  aggiornaProg();
}

function muoviFoto(i, dir){
  const j = i+dir;
  if(j<0||j>=foto.length) return;
  [foto[i],foto[j]]=[foto[j],foto[i]];
  renderFoto(); salva();
}
async function delFoto(i){
  const f = foto[i];
  foto.splice(i, 1);
  renderFoto();
  salva();
  // Se era una foto su Storage, prova a eliminarla anche lì (best-effort)
  if(f?.url?.includes('/storage/v1/object/public/Foto/')){
    try{
      const path = f.url.split('/storage/v1/object/public/Foto/')[1];
      if(path && db){
        const paths = [path];
        // Gli schizzi hanno anche il JSON dei tratti: eliminiamo pure quello
        if(f.strokesPath) paths.push(f.strokesPath);
        await db.storage.from('Foto').remove(paths);
      }
    }catch(e){ /* ignoriamo errori di eliminazione, la foto è rimossa dal record comunque */ }
  }
}

// ── SCHIZZI A PENNA (canvas) ──
let skCanvas=null, skCtx=null, skLayer=null, skLayerCtx=null;
let skStrokes=[], skCurrent=null, skLastDrawn=0;
let skColor='#111111', skSize=3, skEraser=false;
let skPenSeen=false, skDrawing=false, skPointerId=null;
let skBgImg=null, skBgUrl=null, skInit=false;

function skSetupListeners(){
  if(skInit) return;
  skInit=true;
  skCanvas=g('sketch-canvas');
  skCtx=skCanvas.getContext('2d');
  skCanvas.addEventListener('pointerdown',skDown);
  skCanvas.addEventListener('pointermove',skMove);
  skCanvas.addEventListener('pointerup',skUp);
  skCanvas.addEventListener('pointercancel',skUp);
}

function apriSketchNuovo(){ apriSketch(null,null); }

function apriSketchFoto(i){
  const f=foto[i];
  if(!f||!f.url||f.uploading) return;
  const img=new Image();
  img.crossOrigin='anonymous';
  img.onload=()=>apriSketch(img,f.url);
  img.onerror=()=>toast('⚠️ Foto non caricabile per lo schizzo','err');
  img.src=f.url;
}

function apriSketch(bgImg,bgUrl){
  skSetupListeners();
  skBgImg=bgImg; skBgUrl=bgUrl;
  skStrokes=[]; skCurrent=null; skPenSeen=false; skDrawing=false; skPointerId=null;
  skEraser=false; g('sk-gomma').classList.remove('active');
  g('sketch-overlay').classList.add('show');
  // Il canvas va dimensionato quando l'overlay ha gia un layout
  requestAnimationFrame(skDimensiona);
}

function skDimensiona(){
  const wrap=g('sketch-wrap');
  const dpr=window.devicePixelRatio||1;
  const maxW=wrap.clientWidth-16, maxH=wrap.clientHeight-16;
  let w=maxW, h=maxH;
  if(skBgImg){
    const sc=Math.min(maxW/skBgImg.width, maxH/skBgImg.height);
    w=Math.round(skBgImg.width*sc); h=Math.round(skBgImg.height*sc);
  }
  skCanvas.style.width=w+'px'; skCanvas.style.height=h+'px';
  skCanvas.width=Math.round(w*dpr); skCanvas.height=Math.round(h*dpr);
  skLayer=document.createElement('canvas');
  skLayer.width=skCanvas.width; skLayer.height=skCanvas.height;
  skLayerCtx=skLayer.getContext('2d');
  skRidisegna();
}

// Compone il canvas visibile: fondo bianco + eventuale foto + layer tratti
function skComponi(){
  skCtx.fillStyle='#fff';
  skCtx.fillRect(0,0,skCanvas.width,skCanvas.height);
  if(skBgImg) skCtx.drawImage(skBgImg,0,0,skCanvas.width,skCanvas.height);
  skCtx.drawImage(skLayer,0,0);
}

// Ridisegna da zero il layer tratti (dopo undo o ridimensionamento)
function skRidisegna(){
  skLayerCtx.clearRect(0,0,skLayer.width,skLayer.height);
  skStrokes.forEach(s=>skTracciaStroke(skLayerCtx,s));
  skComponi();
}

function skTracciaStroke(ctx2,s){
  if(!s.points.length) return;
  if(s.points.length===1){ skTracciaPunto(ctx2,s); return; }
  for(let i=1;i<s.points.length;i++) skTracciaSegmento(ctx2,s,i);
}

function skTracciaPunto(ctx2,s){
  const [x,y,p]=s.points[0];
  ctx2.save();
  ctx2.globalCompositeOperation=s.eraser?'destination-out':'source-over';
  ctx2.fillStyle=s.color;
  ctx2.beginPath();
  ctx2.arc(x,y,Math.max(1,s.size*((p||0.5)*2)/2),0,Math.PI*2);
  ctx2.fill();
  ctx2.restore();
}

// Disegna il segmento che arriva al punto i, smussato con curva quadratica tra i punti medi
function skTracciaSegmento(ctx2,s,i){
  const pts=s.points;
  const [x0,y0,p0]=pts[i-1], [x1,y1,p1]=pts[i];
  const mx0=i>1?(pts[i-2][0]+x0)/2:x0, my0=i>1?(pts[i-2][1]+y0)/2:y0;
  const mx1=(x0+x1)/2, my1=(y0+y1)/2;
  ctx2.save();
  ctx2.globalCompositeOperation=s.eraser?'destination-out':'source-over';
  ctx2.strokeStyle=s.color;
  ctx2.lineCap='round'; ctx2.lineJoin='round';
  ctx2.lineWidth=Math.max(1,s.size*(((p0+p1)/2||0.5)*2));
  ctx2.beginPath();
  ctx2.moveTo(mx0,my0);
  ctx2.quadraticCurveTo(x0,y0,mx1,my1);
  ctx2.stroke();
  ctx2.restore();
}

// Coordinate in pixel del buffer canvas + pressione (0.5 se non disponibile)
function skPunto(e){
  const r=skCanvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*(skCanvas.width/r.width);
  const y=(e.clientY-r.top)*(skCanvas.height/r.height);
  const p=e.pointerType==='pen'?(e.pressure||0.5):0.5;
  return [Math.round(x*10)/10, Math.round(y*10)/10, Math.round(p*100)/100];
}

function skDown(e){
  if(e.pointerType==='pen') skPenSeen=true;
  // Palm rejection: se in questa sessione c'e stata una penna, il touch non disegna
  if(e.pointerType==='touch'&&skPenSeen) return;
  if(skDrawing) return;
  e.preventDefault();
  skDrawing=true; skPointerId=e.pointerId;
  try{ skCanvas.setPointerCapture(e.pointerId); }catch(err){}
  skCurrent={color:skColor,size:skSize*(window.devicePixelRatio||1),eraser:skEraser,points:[skPunto(e)]};
  skLastDrawn=0;
  skTracciaPunto(skLayerCtx,skCurrent);
  skComponi();
}

function skMove(e){
  if(!skDrawing||e.pointerId!==skPointerId||!skCurrent) return;
  e.preventDefault();
  const coalesced=e.getCoalescedEvents?e.getCoalescedEvents():[];
  const evts=coalesced.length?coalesced:[e];
  evts.forEach(ev=>skCurrent.points.push(skPunto(ev)));
  for(let i=skLastDrawn+1;i<skCurrent.points.length;i++) skTracciaSegmento(skLayerCtx,skCurrent,i);
  skLastDrawn=skCurrent.points.length-1;
  skComponi();
}

function skUp(e){
  if(!skDrawing||e.pointerId!==skPointerId) return;
  skDrawing=false; skPointerId=null;
  if(skCurrent&&skCurrent.points.length) skStrokes.push(skCurrent);
  skCurrent=null;
}

function skSetColore(c,btn){
  skColor=c; skEraser=false;
  g('sk-gomma').classList.remove('active');
  document.querySelectorAll('.sk-col').forEach(b=>b.classList.toggle('active',b===btn));
}

function skSetSpessore(n,btn){
  skSize=n;
  document.querySelectorAll('.sk-siz').forEach(b=>b.classList.toggle('active',b===btn));
}

function skToggleGomma(){
  skEraser=!skEraser;
  g('sk-gomma').classList.toggle('active',skEraser);
}

function skAnnulla(){
  if(!skStrokes.length) return;
  skStrokes.pop();
  skRidisegna();
}

function chiudiSketch(){
  if(skStrokes.length&&!confirm('Chiudere senza salvare lo schizzo?')) return;
  g('sketch-overlay').classList.remove('show');
}

async function salvaSketch(){
  if(!skStrokes.length){ toast('Nessun tratto da salvare','inf'); return; }
  skComponi();
  const blob=await new Promise(res=>skCanvas.toBlob(res,'image/png'));
  if(!blob){ toast('⚠️ Errore nella creazione dello schizzo','err'); return; }
  const ts=Date.now();
  const sopId=currentId||'sop_'+ts;
  if(!currentId) currentId=sopId;
  const pngPath=`sopralluoghi/${sopId}/sketch_${ts}.png`;
  const jsonPath=`sopralluoghi/${sopId}/sketch_${ts}.json`;
  const strokesJson=new Blob(
    [JSON.stringify({w:skCanvas.width,h:skCanvas.height,bgUrl:skBgUrl||null,strokes:skStrokes})],
    {type:'application/json'});
  g('sketch-overlay').classList.remove('show');
  skStrokes=[];
  // Placeholder in griglia durante upload, come processaFoto
  const tempUrl=URL.createObjectURL(blob);
  const placeholder={url:tempUrl,uploading:true,localPath:pngPath,sketch:true};
  foto.push(placeholder);
  renderFoto();
  try{
    const [publicUrl]=await Promise.all([
      caricaBlobSuStorage(blob,pngPath,'image/png'),
      caricaBlobSuStorage(strokesJson,jsonPath,'application/json')
    ]);
    const idx=foto.findIndex(f=>f===placeholder);
    if(idx>=0) foto[idx]={url:publicUrl,sketch:true,strokesPath:jsonPath};
    URL.revokeObjectURL(tempUrl);
    renderFoto();
    salva();
  }catch(e){
    console.error('Upload schizzo fallito:',e);
    const idx=foto.findIndex(f=>f===placeholder);
    if(idx>=0) foto.splice(idx,1);
    URL.revokeObjectURL(tempUrl);
    renderFoto();
    toast('⚠️ Schizzo non caricato (rete?)','inf');
  }
}

  const sincronizzato = await salvaRecord('cantieri_v1', [nuovoCantiere]);

// ── GENERA REPORT ──
// Un solo report: nell'anteprima una spunta per sezione (cliente, cantiere,
// lavorazioni, note, foto). Senza "Cliente" spariscono anche le firme e la
// commessa dal nome del file: il PDF si puo' girare a fornitori e subappaltatori.
// Il PDF si crea nel browser con jsPDF, non con la stampa: cosi' non compaiono
// l'indirizzo della pagina e la data del browser.
const SEZIONI_REPORT = ['cliente','cantiere','lavori','note','foto'];
// Logo dell'azienda in alto a destra nel report. E' un file a parte nella root:
// per un'altra azienda basta sostituirlo. Se manca, il report esce senza logo.
const LOGO_REPORT = 'logo-report.png';
const LOGO_MAX_W = 70, LOGO_MAX_H = 18; // mm
// Colori del report, scelti sul logo: stessi valori per anteprima e PDF.
const COLORI_REPORT = {accento:'#1E87C1', titoli:'#372476', riga:'#DDDDE6', fondino:'#F2F2F6', label:'#5A5A6E', grigio:'#8A8A99', testo:'#1A1612'};
const rgbReport = k => COLORI_REPORT[k].match(/\w\w/g).map(h=>parseInt(h,16));

function generaReport(){
  SEZIONI_REPORT.forEach(k=>{ g('rep-'+k).checked = true; });
  g('report-overlay').classList.add('show');
  aggiornaAnteprima();
}
function sezioneScelta(k){ return g('rep-'+k).checked; }

// Contenuto del report, uguale per anteprima e PDF.
function datiReport(){
  const data = gv('f-data')?new Date(gv('f-data')).toLocaleDateString('it-IT'):new Date().toLocaleDateString('it-IT');
  const resp = gv('f-resp');
  const rec = recordCorrente();
  const conCliente = sezioneScelta('cliente');
  const sezioni = [];
  if(conCliente)
    sezioni.push({titolo:'Cliente', righe:[['Cliente',gv('fc')||'-'],['Telefono',gv('ft')||'-'],['Email',gv('fe')||'-']]});
  if(sezioneScelta('cantiere')){
    sezioni.push({titolo:'Cantiere', righe:[['Indirizzo',gv('fi')||'-'],['Piano',rec.piano],['Superficie',rec.mq?rec.mq+' mq':''],['Accesso',rec.accesso]].filter(r=>r[1])});
    if((rec.ambienti||[]).length) sezioni.push({titolo:'Misure per ambiente', ambienti:rec.ambienti});
  }
  if(sezioneScelta('lavori')) sezioni.push({titolo:'Lavorazioni richieste', testo:gv('fl')||'-'});
  if(sezioneScelta('note')){
    sezioni.push({titolo:'Note aggiuntive', testo:gv('fn')||'-'});
    if(noteVocali.length) sezioni.push({titolo:`Note vocali (${noteVocali.length})`, audio:noteVocali, soloAnteprima:true});
  }
  if(sezioneScelta('foto') && foto.length) sezioni.push({titolo:`Foto (${foto.length})`, foto:foto.filter(f=>f.url)});
  const dataFile = data.replace(/\//g,'-');
  return {
    intestazione: 'REPORT DI SOPRALLUOGO',
    sottotitolo: gv('f-titolo'),
    info: `Data: ${data}`+(resp?` · Responsabile: ${resp}`:''),
    sezioni,
    firme: conCliente ? [[resp,'Responsabile sopralluogo'],[gv('fc'),'Cliente - presa visione']] : null,
    // Senza cliente niente commessa nel nome del file: spesso e' il nome del cliente.
    nomeFile: conCliente ? `Sopralluogo_${(gv('f-commessa')||'senza_commessa').replace(/[^\w\-]+/g,'_')}_${dataFile}.pdf`
                         : `Sopralluogo_${dataFile}.pdf`,
    titoloDoc: 'Report di sopralluogo'
  };
}

function aggiornaAnteprima(){
  const d = datiReport();
  const COLS = 2;
  const fotoHtml = lista => {
    let h = '<table style="width:100%;border-collapse:separate;border-spacing:4mm 3mm">';
    for(let i=0;i<lista.length;i+=COLS){
      h += '<tr>';
      for(let j=0;j<COLS;j++){
        const f = lista[i+j];
        h += f?`<td style="vertical-align:top;padding:0;text-align:center;width:50%"><div style="font-size:7px;color:${COLORI_REPORT.grigio};margin-bottom:2px;font-weight:700;letter-spacing:1px">FOTO ${i+j+1}</div><img src="${esc(f.url)}" style="width:100%;max-height:62mm;object-fit:contain;border-radius:4px;border:1px solid ${COLORI_REPORT.riga};display:block"></td>`:'<td style="width:50%"></td>';
      }
      h += '</tr>';
    }
    return h + '</table>';
  };
  const corpo = s => {
    if(s.righe) return `<table class="info">${s.righe.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
    if(s.ambienti) return `<table class="info"><tr><td>Ambiente</td><td style="text-align:right;font-weight:600;background:${COLORI_REPORT.fondino};color:${COLORI_REPORT.label}">mq</td></tr>${s.ambienti.map(a=>`<tr><td style="background:#fff;font-weight:400;color:${COLORI_REPORT.testo}">${esc(a.nome||'-')}</td><td style="text-align:right;font-weight:600">${esc(a.mq||'-')}</td></tr>`).join('')}</table>`;
    if(s.testo!=null) return `<div class="btext">${esc(s.testo)}</div>`;
    if(s.audio) return s.audio.map((n,i)=>{
      const m=Math.floor(n.dur/60),sec=(n.dur%60).toString().padStart(2,'0');

${d.sezioni.map(s=>`<div class="sec"><div class="stitle">${esc(s.titolo)}</div>${corpo(s)}</div>`).join('')}
${d.firme?`<div class="firma-box">${d.firme.map(f=>`<div class="fl"><strong>${esc(f[0])||'&nbsp;'}</strong><div>${esc(f[1])}</div><div class="fline"></div><div style="margin-top:3px">Firma</div></div>`).join('')}</div>`:''}
</body></html>`;

// jsPDF si carica solo quando serve (non pesa sull'apertura della pagina).
let jspdfPromise = null;
function caricaJsPDF(){
  if(window.jspdf) return Promise.resolve();
  if(!jspdfPromise) jspdfPromise = new Promise((ok,ko)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js';
    s.integrity = 'sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3';
    s.crossOrigin = 'anonymous';
    s.onload = ()=>ok();
    s.onerror = ()=>{ jspdfPromise = null; ko(new Error('jsPDF non caricato')); };
    document.head.appendChild(s);
  });
  return jspdfPromise;
}

// Scarica la foto e la riduce (max 1600 px, JPEG): il PDF resta leggero da inviare.
async function fotoPerPdf(url){
  const blob = await (await fetch(url)).blob();
  const src = URL.createObjectURL(blob);
  try{
    const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=src; });
    const k = Math.min(1, 1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    return {data:c.toDataURL('image/jpeg',0.82), w:c.width, h:c.height};
  } finally { URL.revokeObjectURL(src); }
}

// Logo per il PDF in PNG (tiene la trasparenza). null se il file non c'e'.
async function logoPerPdf(){
  const r = await fetch(LOGO_REPORT, {cache:'no-cache'});
  if(!r.ok) return null;
  const src = URL.createObjectURL(await r.blob());
  try{
    const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=src; });
    const k = Math.min(1, 800/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return {data:c.toDataURL('image/png'), w:c.width, h:c.height};
  } finally { URL.revokeObjectURL(src); }
}

// I font standard del PDF non hanno emoji e alcuni simboli: li sostituisco.
function testoPdf(t){
  return String(t??'')
    .replace(/[\u2018\u2019\u201B]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/\u00A0/g,' ')
    .replace(/[^\n\x20-\x7E\u00A1-\u00FF\u20AC]/g,'');
}

async function esportaPdf(){
  const btn = g('rep-pdf');
  if(btn.disabled) return;
  btn.disabled = true; const etichetta = btn.textContent; btn.textContent = '⏳ Creo PDF...';
  try{
    const d = datiReport();
    if(!d.sezioni.some(x=>!x.soloAnteprima)){ toast('Scegli almeno una sezione da esportare','err'); return; }
    await caricaJsPDF();
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    pdf.setProperties({title:d.titoloDoc, creator:'CommessaPro'});
    const M = 12, W = 210-2*M, H = 297, FONDO = H-M-6;
    const ACCENTO=rgbReport('accento'), TITOLI=rgbReport('titoli'), GRIGIO=rgbReport('grigio'), RIGA=rgbReport('riga'), FONDINO=rgbReport('fondino'), LABEL=rgbReport('label'), TESTO=rgbReport('testo');
    let y = M;
    const pagina = h => { if(y+h>FONDO){ pdf.addPage(); y=M; return true; } return false; };
    const font = (stile,pt,col) => { pdf.setFont('helvetica',stile); pdf.setFontSize(pt); pdf.setTextColor(...col); };
    const LH = pt => pt*0.3528*1.45;

    // Intestazione: titolo e dati a sinistra, logo a destra (il testo non ci passa sotto).
    const logo = await logoPerPdf().catch(()=>null);
    let wTesto = W, fineLogo = y;
    if(logo){
      const k = Math.min(LOGO_MAX_W/logo.w, LOGO_MAX_H/logo.h), lw = logo.w*k, lh = logo.h*k;
      pdf.addImage(logo.data,'PNG',M+W-lw,y,lw,lh,undefined,'FAST');
      wTesto = W-lw-6; fineLogo = y+lh;
    }
    font('bold',14,TITOLI); pdf.text(d.intestazione, M, y+5); y += 7.5;
    font('normal',9.5,GRIGIO);
    [d.sottotitolo, d.info].filter(Boolean).forEach(r=>{
      pdf.splitTextToSize(testoPdf(r), wTesto).forEach(l=>{ pdf.text(l, M, y+3.5); y += LH(9.5); });
    });
    y = Math.max(y, fineLogo) + 2; pdf.setDrawColor(...ACCENTO); pdf.setLineWidth(0.8); pdf.line(M,y,M+W,y); y += 6;

    // Il titolo non resta mai da solo in fondo alla pagina: serve spazio anche per il contenuto.
    const titoloSez = (t, spazio) => {
      pagina(10+spazio);
      font('bold',7.5,TITOLI); pdf.text(testoPdf(t).toUpperCase(), M, y+2.5, {charSpace:0.5});
      y += 4; pdf.setDrawColor(...RIGA); pdf.setLineWidth(0.25); pdf.line(M,y,M+W,y); y += 2.5;
    };
    const tabella = (righe, colL, intestata) => {
      righe.forEach((r,i)=>{
        font('normal',9.5,TESTO);
        const lv = pdf.splitTextToSize(testoPdf(r[1]), W-colL-4);
        const ll = pdf.splitTextToSize(testoPdf(r[0]), colL-4);
        const h = Math.max(lv.length, ll.length)*LH(9.5) + 3.4;
        pagina(h);
        const labelFondo = !intestata || i===0;
        pdf.setDrawColor(...RIGA); pdf.setLineWidth(0.25);
        if(labelFondo){ pdf.setFillColor(...FONDINO); pdf.rect(M,y,colL,h,'FD'); } else pdf.rect(M,y,colL,h);
        if(intestata && i===0){ pdf.setFillColor(...FONDINO); pdf.rect(M+colL,y,W-colL,h,'FD'); } else pdf.rect(M+colL,y,W-colL,h);
        font(labelFondo?'bold':'normal',9.5,labelFondo?LABEL:TESTO); pdf.text(ll, M+2, y+4.2, {lineHeightFactor:1.45});
        font(intestata?'bold':'normal',9.5,intestata&&i===0?LABEL:TESTO);
        if(intestata) pdf.text(lv, M+W-2, y+4.2, {align:'right', lineHeightFactor:1.45});
        else pdf.text(lv, M+colL+2, y+4.2, {lineHeightFactor:1.45});
        y += h;
      });
      y += 4;
    };
    const testo = t => {
      font('normal',9.5,TESTO);
      pdf.splitTextToSize(testoPdf(t), W).forEach(l=>{ pagina(LH(9.5)); pdf.text(l, M, y+3.4); y += LH(9.5); });
      y += 4;
    };
    const griglia = async lista => {
      const GAP = 4, CW = (W-GAP)/2, MAXH = 62;
      let mancanti = 0;
      const immagini = await Promise.all(lista.map(f=>fotoPerPdf(f.url).catch(()=>{ mancanti++; return null; })));
      for(let i=0;i<immagini.length;i+=2){
        const coppia = [immagini[i], immagini[i+1]];
        const dim = coppia.map(im=>{ if(!im) return {w:CW,h:12}; const k=Math.min(CW/im.w, MAXH/im.h); return {w:im.w*k, h:im.h*k}; });
        const h = 4 + Math.max(...dim.map(x=>x.h));
        pagina(h+3);
        coppia.forEach((im,j)=>{
          if(i+j>=immagini.length) return;
          const x = M + j*(CW+GAP);
          font('bold',6,GRIGIO); pdf.text(`FOTO ${i+j+1}`, x+CW/2, y+2.5, {align:'center', charSpace:0.3});
          if(im){
            const ix = x + (CW-dim[j].w)/2;
            pdf.addImage(im.data,'JPEG',ix,y+4,dim[j].w,dim[j].h,undefined,'FAST');
            pdf.setDrawColor(...RIGA); pdf.setLineWidth(0.25); pdf.rect(ix,y+4,dim[j].w,dim[j].h);
          } else {
            pdf.setDrawColor(...RIGA); pdf.rect(x,y+4,CW,12);
            font('normal',8,GRIGIO); pdf.text('Foto non disponibile', x+CW/2, y+11, {align:'center'});
          }
        });
        y += h + 3;
      }
      return mancanti;
    };

    let mancanti = 0;
    for(const s of d.sezioni){
      if(s.soloAnteprima) continue;
      titoloSez(s.titolo, s.foto?70:12);
      if(s.righe) tabella(s.righe, W*0.28, false);
      else if(s.ambienti) tabella([['Ambiente','mq'], ...s.ambienti.map(a=>[a.nome||'-', String(a.mq||'-')])], W*0.72, true);
      else if(s.testo!=null) testo(s.testo);
      else if(s.foto) mancanti = await griglia(s.foto);
    }

    if(d.firme){
      pagina(30); y += 4;
      pdf.setDrawColor(...RIGA); pdf.setLineWidth(0.25); pdf.line(M,y,M+W,y); y += 5;
      const CW = (W-6)/2;
      d.firme.forEach((f,j)=>{
        const x = M + j*(CW+6);
        font('bold',9.5,TESTO); pdf.text(testoPdf(f[0]), x, y+3.5);
        font('normal',8,GRIGIO); pdf.text(testoPdf(f[1]), x, y+9);
        pdf.setDrawColor(204,204,204); pdf.line(x, y+17, x+CW, y+17);
        pdf.text('Firma', x, y+21);
      });
      y += 24;
    }

    // Numero di pagina in fondo, nient'altro.
    const n = pdf.getNumberOfPages();
    for(let p=1;p<=n;p++){
      pdf.setPage(p); font('normal',7.5,GRIGIO);
      pdf.text(`Pagina ${p} di ${n}`, M+W, H-M+2, {align:'right'});
    }
    pdf.save(d.nomeFile);
    toast(mancanti ? `PDF creato, ${mancanti} foto non scaricate` : '✓ PDF creato', mancanti?'err':'ok');
  } catch(e){
    console.error(e);
    toast('PDF non creato: controlla la connessione e riprova','err');
  } finally {
    btn.disabled = false; btn.textContent = etichetta;
  }
}

function leggiImport(input){

      if(dati.sopralluoghi&&dati.sopralluoghi.length>0){

        const ce=getCantieri(); const ci=new Set(ce.map(c=>c.id));
        const nc=dati.cantieri.filter(c=>!ci.has(c.id));
        const ac=ce.map(c=>{const b=dati.cantieri.find(x=>x.id===c.id);return b||c;});
        const lc=[...nc,...ac]; salvaCantieriSicuro(lc);
      }
      if(dati.note&&dati.note.length>0){
        const ne=JSON.parse(localStorage.getItem('note_v1')||'[]'); const ni=new Set(ne.map(n=>n.id));
        const nn=dati.note.filter(n=>!ni.has(n.id));
        const nl=[...nn,...ne]; localStorage.setItem('note_v1',JSON.stringify(nl)); dbSalva('note_v1',nl);

      renderLista();
      toast(`✅ Ripristinati ${nSop} sopralluoghi e ${nCant} cantieri`,'ok');

  };
  reader.readAsText(file); input.value='';
}


// ── CLIENTE E REFERENTE DALLA RUBRICA ──
// In rubrica_v1 ogni contatto e' un referente: "nome" e' il cliente (WFP, IFAD...),
// "ref" la persona, "indirizzo" la sede. Scelto il cliente, il menu referente
// mostra solo i suoi contatti e l'indirizzo del cantiere si compila dalla sede.
const CLI_ALTRO = '__altro', REF_NUOVO = '__nuovo';
function getRubrica(){ try{ return (JSON.parse(localStorage.getItem('rubrica_v1'))||[]).filter(r=>!r.eliminato); }catch{ return []; } }
const normCli = n => (n||'').trim().toUpperCase();
function puoModificareRubrica(){
  let u=null; try{u=JSON.parse(localStorage.getItem('cp_user'))||null;}catch{}
  const r=(u?.ruolo||'').toLowerCase(); return ['admin','direzione','ufficio'].includes(r);
}
function esc(t){ return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Elenco dei clienti senza doppioni, con la grafia del primo contatto trovato
function clientiRubrica(){
  const m=new Map();
  getRubrica().forEach(r=>{ const k=normCli(r.nome); if(k&&!m.has(k)) m.set(k,(r.nome||'').trim()); });
  return [...m.values()].sort((a,b)=>a.localeCompare(b,'it'));
}
function referentiDi(cli){
  return getRubrica().filter(r=>normCli(r.nome)===normCli(cli)&&(r.ref||'').trim())
    .sort((a,b)=>(a.ref||'').localeCompare(b.ref||'','it'));
}
function sedeDi(cli, ref){
  if(ref&&ref.indirizzo) return ref.indirizzo.trim();
  const r=getRubrica().find(x=>normCli(x.nome)===normCli(cli)&&(x.indirizzo||'').trim());
  return r?r.indirizzo.trim():'';
}
function popolaClienti(scelto){
  const opts=['<option value="">— scegli cliente —</option>']
    .concat(clientiRubrica().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`))
    .concat([`<option value="${CLI_ALTRO}">Altro / privato (scrivi a mano)</option>`]);
  g('f-cli').innerHTML=opts.join('');
  g('f-cli').value=scelto||'';
}
function popolaReferenti(cli, refId){
  const refs=referentiDi(cli);
  let opts=['<option value="">— scegli referente —</option>']
    .concat(refs.map(r=>`<option value="${esc(r.id)}">${esc(r.ref)}</option>`));
  if(puoModificareRubrica()) opts.push(`<option value="${REF_NUOVO}">+ Nuovo referente...</option>`);
  g('f-ref').innerHTML=opts.join('');
  g('f-ref').value=refId||'';
  return refs;
}
function mostraCampiCliente(){
  const v=g('f-cli').value;
  g('fg-ref').style.display=(v&&v!==CLI_ALTRO)?'':'none';
  g('fg-fc').style.display=(v===CLI_ALTRO)?'':'none';
}
// Imposta i menu all'apertura di un sopralluogo (s=null per uno nuovo)
function impostaCliente(s){
  let cli='', refId='';
  if(s){
    const clienti=clientiRubrica();
    const trovaCli=n=>clienti.find(c=>normCli(c)===normCli(n));
    if(s.clienteRubrica&&trovaCli(s.clienteRubrica)){
      cli=trovaCli(s.clienteRubrica);
      if(s.referenteId&&referentiDi(cli).some(r=>r.id===s.referenteId)) refId=s.referenteId;
    } else if(s.cliente){
      // Sopralluoghi vecchi: riconosce "WFP - Alessandro Casciotti" dal testo
      const testo=normCli(s.cliente);
      const r=getRubrica().find(x=>(x.ref||'').trim()&&normCli(x.nome+' - '+x.ref)===testo);
      if(r){ cli=trovaCli(r.nome); refId=r.id; }
      else if(trovaCli(s.cliente)) cli=trovaCli(s.cliente);
      else cli=CLI_ALTRO;
    }
  }
  popolaClienti(cli);
  if(cli&&cli!==CLI_ALTRO) popolaReferenti(cli, refId);
  mostraCampiCliente();
}
// Ricarica i menu dopo una sincronizzazione, senza perdere la scelta corrente
function aggiornaMenuCliente(){
  if(!g('view-form').classList.contains('active')) return;
  const cli=g('f-cli').value, ref=g('f-ref').value;
  const esiste=cli===CLI_ALTRO||clientiRubrica().includes(cli);
  popolaClienti(esiste?cli:(cli?CLI_ALTRO:''));
  if(esiste&&cli&&cli!==CLI_ALTRO) popolaReferenti(cli, ref===REF_NUOVO?'':ref);
  mostraCampiCliente();
}
// Scelto il cliente: referenti filtrati e indirizzo dalla sede
function cambiaCliente(){
  const cli=g('f-cli').value;
  if(cli===CLI_ALTRO){
    mostraCampiCliente();
    g('fc').value=''; g('ft').value=''; g('fe').value='';
    g('fc').focus(); salva(); return;
  }
  if(!cli){ g('fc').value=''; mostraCampiCliente(); salva(); return; }
  const refs=popolaReferenti(cli,'');
  mostraCampiCliente();
  if(refs.length===1){ g('f-ref').value=refs[0].id; cambiaReferente(); return; }
  g('fc').value=cli; g('ft').value=''; g('fe').value='';
  applicaSede(cli,null);
  salva();
}
function cambiaReferente(){
  const cli=g('f-cli').value, id=g('f-ref').value;
  if(id===REF_NUOVO){ apriNuovoReferente(); return; }
  const r=getRubrica().find(x=>x.id===id);
  if(!r){ g('fc').value=cli; g('ft').value=''; g('fe').value=''; applicaSede(cli,null); salva(); return; }
  g('fc').value=cli+' - '+r.ref.trim();
  g('ft').value=r.tel||''; g('fe').value=r.email||'';
  applicaSede(cli,r);
  salva();
}
// Compila l'indirizzo del cantiere dalla sede, ma non sovrascrive un
// indirizzo scritto a mano che non corrisponde a nessuna sede in rubrica
function applicaSede(cli, ref){
  const sede=sedeDi(cli, ref);
  if(!sede) return;
  const attuale=gv('fi');
  if(attuale===sede) return;
  const sediNote=new Set(getRubrica().map(r=>(r.indirizzo||'').trim()).filter(Boolean));
  if(attuale&&!sediNote.has(attuale)){ toast('Indirizzo del cantiere lasciato com\'era: non corrisponde a una sede','inf'); return; }
  g('fi').value=sede; currentLat=null; currentLon=null;
}

async function salvaNuovoReferente(){
  const cli=g('f-cli').value, nome=gv('nr-nome');

// ── GEO-LOCALIZZAZIONE ──
function geoLocalizza(){
  const btn = document.getElementById('geo-btn');
  if(!navigator.geolocation){ toast('GPS non supportato dal browser','err'); return; }
  if(location.protocol!=='https:' && location.hostname!=='localhost'){
    toast('GPS richiede HTTPS','err'); return;
  }
  btn.textContent = '⏳'; btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const {latitude: lat, longitude: lon} = pos.coords;
      try{
        const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=18&addressdetails=1&accept-language=it`;
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const data = await res.json();
        if(!data || !data.address) throw new Error('Nessun indirizzo trovato per queste coordinate');
        const addr = data.address;
        const road = addr.road || addr.pedestrian || addr.footway || addr.path || addr.cycleway || addr.neighbourhood || addr.suburb || addr.hamlet || '';
        const num = addr.house_number ? ' '+addr.house_number : '';
        const cap = addr.postcode || '';
        const city = addr.city || addr.town || addr.village || addr.municipality || addr.hamlet || '';
        let full = '';
        if(road){
          full = (road + num).trim();
          if(cap || city) full += (full?', ':'') + (cap?cap+' ':'') + city;
          full = full.trim();
        } else if(data.display_name){
          // niente via riconoscibile: meglio indirizzo completo di Nominatim che solo CAP
          full = data.display_name;
        }
        if(full){
          document.getElementById('fi').value = full;
          currentLat = lat; currentLon = lon;
          salva();
          toast('📍 Posizione rilevata','ok');
        } else {
          // fallback: uso display_name di Nominatim
          if(data.display_name){
            document.getElementById('fi').value = data.display_name;
            currentLat = lat; currentLon = lon;
            salva();
            toast('📍 Posizione rilevata (approssimata)','ok');
          } else {
            toast('Indirizzo non trovato — salvate solo coordinate','inf');
            currentLat = lat; currentLon = lon;
            salva();
          }
        }
      }catch(e){
        console.error('Geoloc error:', e);
        // Anche se il reverse geocoding fallisce, salvo le coordinate
        currentLat = lat; currentLon = lon;
        toast('Rete lenta: salvate solo coordinate ('+e.message+')','err');
      }
      finally{ btn.textContent = '📍'; btn.disabled = false; }
    },
    err => {
      btn.textContent = '📍'; btn.disabled = false;
      const msg = {
        1:'Permesso negato — abilita la posizione nelle impostazioni',
        2:'Posizione non disponibile (GPS spento?)',
        3:'Timeout scaduto — riprova'
      }[err.code] || 'Errore sconosciuto';
      toast(msg,'err');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function apriMappa(){
  // Priorità: lat/lon precise, altrimenti indirizzo testuale
  if(currentLat!=null && currentLon!=null){
    window.open(`https://www.google.com/maps/search/?api=1&query=${currentLat},${currentLon}`,'_blank');
    return;
  }
  const ind = gv('fi');
  if(!ind){ toast('Nessun indirizzo o posizione da aprire','err'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ind)}`,'_blank');
}

// ── EXPORT AUTOMATICO (smistamento foto) ──
// Ad ogni salvataggio di un sopralluogo riscrive cantieri_export.json nella
// cartella configurata dalla home (card "Esporta dati"). Silenzioso: se la
// cartella non e configurata o il permesso non e attivo, non fa nulla.
const EXPORT_FILENAME='cantieri_export.json';
let exportTimer=null;
function exportAutoDebounced(){
  clearTimeout(exportTimer);
  exportTimer=setTimeout(()=>{tentaExportAuto();},2000);
}
function idbExportHandle(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('cp_export',1);
    req.onupgradeneeded=()=>req.result.createObjectStore('h');
    req.onerror=()=>reject(req.error);
    req.onsuccess=()=>{
      const tx=req.result.transaction('h','readonly');
      const r=tx.objectStore('h').get('dir');
      r.onsuccess=()=>resolve(r.result);
      r.onerror=()=>reject(r.error);
    };
  });
}
async function tentaExportAuto(){
  let u=null; try{u=JSON.parse(localStorage.getItem('cp_user'))||null;}catch{}
  const ruolo=(u?.ruolo||'').toLowerCase();
  if(ruolo!=='admin')return;
  if(!window.showDirectoryPicker)return;
  try{
    const dir=await idbExportHandle();
    if(!dir)return;
    if(await dir.queryPermission({mode:'readwrite'})!=='granted')return;
    const payload=JSON.stringify({
      aggiornato_il:new Date().toISOString(),
      cantieri:getCantieri().filter(c=>!c.archiviato),
      sopralluoghi:getLista()
    },null,1);
    const fh=await dir.getFileHandle(EXPORT_FILENAME,{create:true});
    const w=await fh.createWritable();
    await w.write(payload);
    await w.close();
  }catch(e){}
}
