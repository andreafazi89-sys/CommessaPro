<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Epilogue',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}
.view{display:none;}.view.active{display:block;}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
.btn-back{color:var(--muted);background:none;border:none;cursor:pointer;font-size:22px;padding:0;}
.btn-top{background:var(--sand-dim);color:var(--sand);border:none;border-radius:8px;padding:7px 12px;font-family:Epilogue,sans-serif;font-size:12px;font-weight:500;cursor:pointer;}
.content{padding:16px 16px 120px;}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.sec-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sand);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-icon{width:28px;height:28px;background:var(--brick-dim);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.info-row:last-child{border-bottom:none;}
.info-lbl{color:var(--muted);}.info-val{font-weight:500;text-align:right;}
.fg{margin-bottom:12px;}.fg:last-child{margin-bottom:0;}
label{display:block;font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
input,textarea,select{width:100%;padding:13px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--white);font-family:'Epilogue',sans-serif;font-size:16px;outline:none;-webkit-appearance:none;}
input:focus,textarea:focus{border-color:var(--brick);}
input::placeholder,textarea::placeholder{color:var(--muted);}
textarea{resize:none;min-height:80px;line-height:1.6;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.giornata-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;margin-bottom:10px;}
.g-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.g-data{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.g-ore{font-size:12px;color:var(--muted);margin-top:2px;}
.g-operai{font-size:12px;color:var(--sand);margin-bottom:4px;}
.g-note{font-size:13px;line-height:1.5;}
/* Contributi individuali nel diario (vista aggregata) */
.g-contributi{margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}
.g-contributo{padding:8px 0;border-bottom:1px dashed var(--border);position:relative;padding-right:70px;}
.g-contributo:last-child{border-bottom:none;}
.g-c-nome{font-size:13px;font-weight:600;color:var(--white);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.g-c-ore{font-size:12px;font-weight:700;color:var(--brick);background:var(--brick-dim);padding:2px 8px;border-radius:12px;}
.g-c-desc{font-size:12px;color:var(--muted);line-height:1.4;margin-top:3px;}
.g-c-mig{font-size:10px;color:#C8441A;font-weight:700;margin-top:2px;letter-spacing:0.5px;}
.g-c-actions{position:absolute;top:6px;right:0;display:flex;gap:2px;align-items:center;}
.g-c-pdf{background:var(--green-dim);color:var(--green);border:1px solid var(--green);border-radius:6px;padding:3px 7px;font-size:12px;text-decoration:none;cursor:pointer;line-height:1;}
.g-c-pdf:active{transform:scale(0.95);}
.det-link{display:flex;gap:8px;margin-top:12px;}
.det-link a{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--white);font-size:14px;font-weight:600;text-decoration:none;}
.g-c-col{font-size:12px;color:var(--sand);margin-top:2px;}
.vuoto{font-size:13px;color:var(--muted);padding:4px 0;}
/* Riepilogo ore del cantiere */
.ore-tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.ore-tot div{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 6px;text-align:center;}
.ore-tot b{display:block;font-family:'Syne',sans-serif;font-size:22px;color:var(--brick);}
.ore-tot span{font-size:12px;color:var(--muted);}
.ore-op{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.ore-op-riga{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px;}
.ore-op-nome{font-weight:600;}
.ore-op-h{font-weight:700;text-align:right;}
.ore-op-h small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px;}
.ore-bar{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.ore-bar i{display:block;height:100%;background:var(--brick);border-radius:3px;}
.ore-mese{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:8px 12px;border-top:1px solid var(--border);font-size:13px;}
.ore-mese span:first-child{text-transform:capitalize;}
.ore-mese span:not(:first-child){color:var(--muted);text-align:right;}
/* Gruppi apribili: mesi e giornate */
.grp{border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);margin-bottom:8px;}
.grp:last-child{margin-bottom:0;}
.grp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;font-size:14px;font-weight:600;}
.grp summary::-webkit-details-marker{display:none;}
.grp summary::after{content:"›";font-size:20px;color:var(--muted);transition:transform .15s;}
.grp[open]>summary::after,.grp-g[open]>summary::after{transform:rotate(90deg);}
.grp-r{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted);text-align:right;}
.grp-mese{text-transform:capitalize;}
.grp-g{border-top:1px solid var(--border);}
.grp-g summary{font-weight:500;font-size:13px;}
.grp-g .grp-r{font-size:12px;}
.grp-det{padding:0 12px 10px;}
.grp-det .g-contributi{margin-top:0;border-top:none;padding-top:0;}
.g-sub-line{font-size:12px;color:var(--sand);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:100;}
.btn-main{width:100%;padding:16px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none;}
.btn-main:active{transform:scale(.98);}
.toast.ok{background:var(--green);color:#fff;}
.toast.err{background:#C8441A;color:#fff;}
.toast.inf{background:var(--surface2);color:var(--white);border:1px solid var(--border);}
.cant-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;}
.cant-card:active{border-color:var(--brick);}
.cant-icon{width:44px;height:44px;background:var(--green-dim);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.cant-info{flex:1;min-width:0;}
.cant-nome{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cant-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-txt{font-size:15px;font-weight:500;color:var(--sand);margin-bottom:6px;}
/* Documenti del cantiere: DDT, bolle, fatture */
.doc-az-top{display:flex;gap:8px;margin-bottom:12px;}
.btn-doc{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--white);font-family:'Epilogue',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
.btn-doc.pri{background:var(--brick);border-color:var(--brick);color:#fff;}
.btn-doc:disabled{opacity:.6;}
.doc-filtri{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.doc-filtri button{min-height:40px;padding:0 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:20px;color:var(--muted);font-family:'Epilogue',sans-serif;font-size:13px;cursor:pointer;}
.doc-filtri button.on{border-color:var(--brick);color:var(--white);background:var(--brick-dim);}
.doc-form{display:none;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;margin-bottom:12px;}
.doc-form.show{display:block;}
.doc-prev{display:block;max-width:100%;max-height:220px;margin:0 auto 12px;border-radius:6px;}
.doc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.doc-row:last-child{border-bottom:none;}
.doc-info{flex:1;min-width:0;}
.doc-tit{font-size:14px;font-weight:600;}
.doc-tipo{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:12px;background:var(--brick-dim);color:var(--brick);margin-right:4px;}
.doc-meta{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;}
.doc-btns{display:flex;gap:4px;flex-shrink:0;}
.doc-btns button{width:40px;height:40px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:16px;cursor:pointer;}
</style>

</head>
<body>

</div>

    <button class="btn-main" id="btn-archivia" style="display:none;background:var(--surface2);color:var(--sand);border:1.5px solid var(--border)" onclick="archiviaCantiere()">🗄 Archivia commessa</button>

<div class="toast" id="toast"></div>

<script>
// ── GUARD AUTH: gira prima di qualsiasi lettura dati o render ──
(function(){
  let u=null; try{u=JSON.parse(localStorage.getItem('cp_user'))||null;}catch{}
  if(!u||!u.email){ window.location.replace('login.html'); return; }
  // Gli operai non usano la scheda Cantiere: meno distrazioni, solo i rapportini
  if(!['admin','direzione','ufficio'].includes((u.ruolo||'').toLowerCase())) window.location.replace('index.html');
})();

// ── SUPABASE ──
const SUPA_URL='https://iradzlocobsipjazracw.supabase.co';
const SUPA_KEY='sb_publishable_zFgRrNrmYSORug8N06heow_6vjl0fhH';
const CANT_KEY='cantieri_v1';
// ── SEGRETARIA: configura qui email (e in futuro WhatsApp) ──
const SEGRETARIA = {
  email: 'info@pierantonicm.com',
  whatsapp: '39XXXXXXXXXX'  // ← SOSTITUIRE con numero reale, formato '393331234567'
};
let db=null, currentCant=null;

function initDB(){if(window.supabase)db=window.supabase.createClient(SUPA_URL,SUPA_KEY);}
function avvisoSync(msg){ toast('\u26a0\ufe0f '+msg,'err'); }
async function dbSalva(k,v){
  if(!db){ avvisoSync('Non sincronizzato: server non raggiungibile'); return false; }
  const {data:s}=await db.auth.getSession();
  if(!s||!s.session){ avvisoSync('Sessione scaduta: salvato solo su questo dispositivo, esci e rientra'); return false; }
  const {error}=await db.from('dati').upsert({chiave:k,valore:v,ts:new Date().toISOString()},{onConflict:'chiave'});
  if(error){ console.error('dbSalva',k,error); avvisoSync('Non sincronizzato: '+error.message); return false; }
  return true;
}
async function forcSync(){
  toast('🔄 Sincronizzazione...','inf');
  if(!db){toast('Nessuna connessione','err');return;}
  try{
    await allinea(CANT_KEY);
    await allinea(RPT_KEY);
    renderLista();
    if(currentCant) renderDiario();
    toast('✓ Sincronizzato','ok');
  }catch(e){toast('Errore sync','err');}
}

function __toastErr(msg){ toast('\u26a0\ufe0f ' + msg, 'err'); }

// ── SINCRONIZZAZIONE: scrittura chirurgica + coda offline ──
// Regola: la versione del server e' la base. Ogni dispositivo applica SOLO i
// record che ha appena toccato, quindi una copia locale vecchia non puo' piu'
// riportare indietro modifiche fatte altrove. Le cancellazioni sono marcature
// (eliminato:true) e non rimozioni, cosi' si propagano invece di tornare indietro.
function chiavePending(k){ return 'cp_pending_' + k; }
function getPending(k){ try{ return JSON.parse(localStorage.getItem(chiavePending(k))) || []; }catch{ return []; } }
function aggiungiPending(k, records){
  const m = new Map(getPending(k).map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(chiavePending(k), JSON.stringify([...m.values()]));
}
function svuotaPending(k){ localStorage.removeItem(chiavePending(k)); }
function scriviLocale(k, records){
  let attuali = [];
  try{ attuali = JSON.parse(localStorage.getItem(k)) || []; }catch(e){}
  const m = new Map(attuali.map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(k, JSON.stringify([...m.values()]));
}
function marcaEliminato(rec){ return {...rec, eliminato:true, timestamp:new Date().toISOString()}; }
async function salvaRecord(k, records){
  if(!Array.isArray(records) || !records.length) return true;
  scriviLocale(k, records);
  if(!db){ aggiungiPending(k, records); __toastErr('Salvato sul dispositivo, non ancora sincronizzato'); return false; }
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){
    console.error('salvaRecord lettura', k, error);
    aggiungiPending(k, records);
    __toastErr('Salvato sul dispositivo, non ancora sincronizzato');
    return false;
  }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const m = new Map(base.map(x => [x.id, x]));
  getPending(k).forEach(r => m.set(r.id, r));
  records.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  const ok = await dbSalva(k, finale);
  if(!ok){ aggiungiPending(k, records); return false; }
  svuotaPending(k);
  localStorage.setItem(k, JSON.stringify(finale));
  return true;
}
// Allinea la copia locale a quella del server, mantenendo le modifiche in coda
async function allinea(k){
  if(!db) return false;
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){ console.error('allinea', k, error); __toastErr('Lettura dal server non riuscita: ' + error.message); return false; }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const pend = getPending(k);
  const m = new Map(base.map(x => [x.id, x]));
  pend.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  localStorage.setItem(k, JSON.stringify(finale));
  if(pend.length){
    const ok = await dbSalva(k, finale);
    if(ok) svuotaPending(k);
  }
  return true;
}

const g=id=>document.getElementById(id);
const gv=id=>g(id)?.value?.trim()||'';
function toast(msg,tipo){const t=g('toast');t.textContent=msg;t.className='toast '+tipo+' show';clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000);}
function getCantieri(){try{return (JSON.parse(localStorage.getItem(CANT_KEY))||[]).filter(c=>!c.eliminato);}catch{return[];}}
function salvaCantieri(l){ return salvaRecord(CANT_KEY, l); }

// ── RAPPORTI (nuova tabella v1) ──
const RPT_KEY = 'rapporti_v1';
const MIGR_FLAG = 'migrazione_rapporti_v1_done';
function getRapporti(){try{return (JSON.parse(localStorage.getItem(RPT_KEY))||[]).filter(r=>!r.eliminato);}catch{return[];}}
function salvaRapporti(l){ return salvaRecord(RPT_KEY, l); }
function getRapportiCantiere(cantiereId){
  return getRapporti().filter(r => r.cantiereId === cantiereId);
}
// Raggruppa i rapporti di un cantiere per data (YYYY-MM-DD)
function getGiornateCantiere(cantiereId){
  const rpt = getRapportiCantiere(cantiereId);
  const perData = {};
  rpt.forEach(r => {
    if(!perData[r.data]) perData[r.data] = [];
    perData[r.data].push(r);
  });
  return Object.keys(perData).sort().reverse().map(data => ({
    data,
    record: perData[data],
    totOre: perData[data].reduce((s,r) => s + (parseFloat(r.ore)||0), 0),
    numOperai: new Set(perData[data].map(r => r.operaio)).size
  }));
}

// ── MIGRAZIONE: vecchie giornate[] → record rapporti_v1 ──
// Eseguita una sola volta al primo caricamento dopo l'aggiornamento.
function migraVecchieGiornate(){
  if(localStorage.getItem(MIGR_FLAG) === '1') return; // già fatto
  const cantieri = getCantieri();
  // Verifica se c'è qualcosa da migrare
  const daMigrare = cantieri.filter(c => Array.isArray(c.giornate) && c.giornate.length > 0);
  if(!daMigrare.length){
    localStorage.setItem(MIGR_FLAG, '1'); // niente da fare, marca come done
    return;
  }
  // Backup di sicurezza
  const backupKey = 'cantieri_v1_backup_premig_' + new Date().toISOString().replace(/[:.]/g,'-');
  try{ localStorage.setItem(backupKey, JSON.stringify(cantieri)); }catch(e){ console.warn('Backup migrazione fallito:',e); }

  const esistenti = new Set(getRapporti().map(r => r.id));
  const rapporti = []; // solo i record nuovi: salvaRecord li aggiunge a quelli del server
  const cpUser = (()=>{try{return JSON.parse(localStorage.getItem('cp_user')||'{}');}catch{return{};}})();
  const autoreMig = '[MIGRATO]' + (cpUser.email ? ' ' + cpUser.email : '');
  let contatore = 0;

  daMigrare.forEach(cant => {
    (cant.giornate||[]).forEach((g2, idxGiorno) => {
      const operai = Array.isArray(g2.operai) ? g2.operai : [];
      const ore = parseFloat(g2.ore) || 0;
      const note = g2.note || '';
      const sub = g2.sub || '';
      const data = g2.data || '';
      if(!data || !operai.length || ore <= 0) return; // giornata malformata, skippo

      operai.forEach((op, i) => {
        // Moltiplico: ogni operaio ha le ore intere della giornata (scelta utente)
        const id = `rpt_MIG_${cant.id}_${data}_${idxGiorno}_${i}`;
        if(esistenti.has(id)) return;
        rapporti.push({
          id,
          cantiereId: cant.id,
          data,
          operaio: op,
          operaioEmail: null,
          ore,
          // La nota originale va SOLO sul primo operaio (è testo condiviso della giornata)
          descrizione: (i === 0) ? note : '',
          subappaltatori: sub,
          tipo: 'operaio',
          autore: autoreMig,
          timestamp: new Date().toISOString(),
          _migrato: true
        });
        contatore++;
      });
    });
  });

  if(contatore > 0){
    salvaRapporti(rapporti);
    console.log(`[MIGRAZIONE] ${contatore} record creati da ${daMigrare.length} cantieri. Backup: ${backupKey}`);
  }
  localStorage.setItem(MIGR_FLAG, '1');
}

function showView(n){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));g('view-'+n).classList.add('active');window.scrollTo(0,0);}

function eliminaCantiere(id){
  if(!isAdmin()){toast('Operazione riservata','err');return;}
  if(!confirm('Eliminare questo cantiere?')) return;
  // Rimuovi il cantiereId dal sopralluogo collegato
  const cant = getCantieri().find(c=>c.id===id);
  if(cant&&cant.sopralluogoId){
    const sops = JSON.parse(localStorage.getItem('sopralluoghi_v3')||'[]');
    const sopIdx = sops.findIndex(s=>s.id===cant.sopralluogoId);
    if(sopIdx>=0) salvaRecord('sopralluoghi_v3',[{...sops[sopIdx], cantiereId:null, timestamp:new Date().toISOString()}]);
  }
  if(cant) salvaRecord(CANT_KEY,[marcaEliminato(cant)]);
  renderLista(); toast('Eliminato','inf');
}

function ordinaPerCommessa(a,b){
  const ca=(a.commessa||'').trim(), cb=(b.commessa||'').trim();
  if(!ca && !cb) return 0;
  if(!ca) return -1;
  if(!cb) return 1;
  return cb.localeCompare(ca,'it',{numeric:true,sensitivity:'base'});
}
// Data ISO (aaaa-mm-gg) in formato gg/mm/aaaa; altri formati restano come sono
function dataIt(d){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?`${m[3]}/${m[2]}/${m[1]}`:(d||'');}
// Le attivita' fisse (fisso:true) servono solo ai rapportini: qui non compaiono
function renderLista(){
  const lista=getCantieri().filter(c=>!c.archiviato&&!c.fisso).sort(ordinaPerCommessa);const el=g('lista-container');
  if(!lista.length){el.innerHTML=`<div class="empty-state"><div class="empty-icon">🏗️</div><div class="empty-txt">Nessun cantiere</div><div style="font-size:13px;color:var(--muted)">Avvia un cantiere dalla scheda Sopralluogo</div></div>`;return;}
  el.innerHTML=lista.map(c=>`
    <div class="cant-card" onclick="apriCantiere('${c.id}')">
      <div class="cant-icon">🏗️</div>
      <div class="cant-info"><div class="cant-nome">${c.commessa?c.commessa+' · ':''}${c.titolo||c.cliente||'—'}</div><div class="cant-meta">${c.cliente||'—'} · ${c.stato||'In corso'} · Dal ${dataIt(c.dataInizio)||'—'}</div></div>

    </div>`).join('');
}

}

// Vecchio nome di Mihai Poveste, ancora presente nei rapportini salvati prima della correzione
const ALIAS_OPERAI = {'Michele Poveste':'Mihai Poveste','Vasile Banta':'Vasile Boanta'};
function nomeOperaio(n){ const t = (n || '').trim(); return ALIAS_OPERAI[t] || t; }
function esc(t){ return String(t ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
const fmtOre = n => String(Math.round(n * 10) / 10).replace('.', ',');
const nomeMese = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('it-IT', {month:'long', year:'numeric'}); };
// Persone di un rapportino: chi l'ha compilato piu' i colleghi citati, ognuno con le ore intere
function personeRapporto(r){
  const op = nomeOperaio(r.operaio);
  const col = (Array.isArray(r.colleghi) ? r.colleghi : []).map(nomeOperaio).filter(n => n && n !== op);
  return [...new Set([op, ...col].filter(Boolean))];
}

// Riepilogo ore del cantiere, sempre ricalcolato dai rapportini
function renderOre(){
  const el = g('ore-riep');
  const rpt = getRapportiCantiere(currentCant.id);
  if(!rpt.length){ el.innerHTML = '<div class="vuoto">Nessun rapportino su questo cantiere</div>'; return; }
  const perOp = {}, perMese = {};
  let tot = 0;
  rpt.forEach(r => {
    const ore = parseFloat(r.ore) || 0;
    const ym = (r.data || '').slice(0, 7);
    personeRapporto(r).forEach(p => {
      const x = perOp[p] = perOp[p] || {ore:0, giorni:new Set()};
      x.ore += ore; x.giorni.add(r.data);
      const m = perMese[ym] = perMese[ym] || {ore:0, giorni:new Set()};
      m.ore += ore; m.giorni.add(r.data);
      tot += ore;
    });
  });
  const giorni = new Set(rpt.map(r => r.data)).size;
  const ops = Object.entries(perOp).sort((a, b) => b[1].ore - a[1].ore || a[0].localeCompare(b[0], 'it'));
  const max = ops[0][1].ore || 1;
  const mesi = Object.keys(perMese).sort().reverse();
  el.innerHTML = `
    <div class="ore-tot">
      <div><b>${fmtOre(tot)}</b><span>ore totali</span></div>
      <div><b>${giorni}</b><span>${giorni === 1 ? 'giornata' : 'giornate'}</span></div>
      <div><b>${ops.length}</b><span>${ops.length === 1 ? 'operaio' : 'operai'}</span></div>
    </div>
    <div class="ore-op">${ops.map(([n, x]) => `
      <div class="ore-op-riga">
        <span class="ore-op-nome">${esc(n)}</span>
        <span class="ore-op-h">${fmtOre(x.ore)} h<small>${x.giorni.size} gg</small></span>
        <div class="ore-bar"><i style="width:${Math.round(x.ore / max * 100)}%"></i></div>
      </div>`).join('')}
    </div>
    <details class="grp">
      <summary>Ore per mese<span class="grp-r">${mesi.length} ${mesi.length === 1 ? 'mese' : 'mesi'}</span></summary>
      ${mesi.map(m => `<div class="ore-mese"><span>${nomeMese(m)}</span><span>${perMese[m].giorni.size} gg</span><span>${fmtOre(perMese[m].ore)} h</span></div>`).join('')}
    </details>`;
}

// Diario raggruppato per mese, tutto chiuso: si apre il mese, poi la giornata
function renderDiario(){
  renderOre();
  const el = g('diario-list');
  const giornate = getGiornateCantiere(currentCant.id);
  const tot = giornate.length;
  g('tot-giorni').textContent = tot + (tot === 1 ? ' giornata' : ' giornate');
  if(!giornate.length){
    el.innerHTML = '<div class="vuoto">Nessuna giornata registrata</div>';
    return;
  }
  const perMese = {};
  giornate.forEach(gr => (perMese[gr.data.slice(0, 7)] = perMese[gr.data.slice(0, 7)] || []).push(gr));
  el.innerHTML = Object.keys(perMese).sort().reverse().map(ym => {
    const gg = perMese[ym];
    const oreMese = gg.reduce((s, gr) => s + gr.record.reduce((t, r) => t + (parseFloat(r.ore) || 0) * personeRapporto(r).length, 0), 0);
    const giorniHtml = gg.map(gr => {
      const persone = new Set(gr.record.flatMap(personeRapporto));
      const oreGiorno = gr.record.reduce((t, r) => t + (parseFloat(r.ore) || 0) * personeRapporto(r).length, 0);
      // Riga per ogni contributo individuale (con bottone 📥 rapportino personale)
      const righe = gr.record.map(r => {
        const col = personeRapporto(r).slice(1);
        return `
        <div class="g-contributo">
          <div class="g-c-nome">${esc(nomeOperaio(r.operaio) || '—')} <span class="g-c-ore">${fmtOre(parseFloat(r.ore) || 0)}h</span></div>
          ${col.length ? `<div class="g-c-col">con ${esc(col.join(', '))}</div>` : ''}
          ${r.descrizione ? `<div class="g-c-desc">${esc(r.descrizione)}</div>` : ''}
          ${r._migrato ? '<div class="g-c-mig">[migrato]</div>' : ''}
          <div class="g-c-actions">
            <a class="g-c-pdf" href="rapporto.html?pdf=${encodeURIComponent(r.id)}" target="_blank" title="Scarica rapportino di ${esc(r.operaio)}">📥</a>
          </div>
        </div>`;
      }).join('');
      const subs = [...new Set(gr.record.map(r => r.subappaltatori).filter(Boolean))].join(' · ');
      return `
        <details class="grp-g">
          <summary>${dataIt(gr.data)}<span class="grp-r">${fmtOre(oreGiorno)} h · ${persone.size} ${persone.size === 1 ? 'operaio' : 'operai'}</span></summary>
          <div class="grp-det">
            <div class="g-contributi">${righe}</div>
            ${subs ? `<div class="g-sub-line">🛠 Sub: ${esc(subs)}</div>` : ''}
          </div>
        </details>`;
    }).join('');
    return `
      <details class="grp">
        <summary><span class="grp-mese">${nomeMese(ym)}</span><span class="grp-r">${gg.length} ${gg.length === 1 ? 'giornata' : 'giornate'} · ${fmtOre(oreMese)} h</span></summary>
        <div class="grp-giorni">${giorniHtml}</div>
      </details>`;
  }).join('');
}

function chiudiCantiere(){
  if(!privilegiato()){toast('Operazione riservata','err');return;}
  if(!confirm('Chiudere il cantiere e avvisare la segretaria per la fattura?'))return;
  currentCant.stato='Completato';currentCant.dataFine=new Date().toISOString().split('T')[0];
  salvaCantiere();mostraStato('Completato');
  aggiornaBottoni();
  // Notifica segretaria via mail per emissione fattura
  notificaFineCantiere();
  toast('Cantiere chiuso','ok');
}

// Per un Fine Cantiere premuto per sbaglio: torna In corso e toglie la data di fine,
// cosi' il cantiere torna tra quelli aperti anche nei rapportini
function riapriCantiere(){
  if(!privilegiato()){toast('Operazione riservata','err');return;}
  if(!confirm('Riaprire il cantiere? Torna In corso e la data di fine viene tolta.'))return;
  currentCant.stato='In corso';currentCant.dataFine='';
  salvaCantiere();mostraStato('In corso');
  aggiornaBottoni();
  toast('Cantiere riaperto','ok');
}

function archiviaCantiere(){
  if(!isAdmin()){toast('Operazione riservata','err');return;}
  // L'archiviazione vive nella pagina dedicata: crea il pacchetto ZIP completo
  // (scheda sopralluogo, foto, giornate, dati.json) e archivia insieme
  // sopralluogo e cantiere. Qui si rimanda solo a quella pagina.
  window.location.href='archivio.html?id='+encodeURIComponent(currentCant.id);
}

function notificaFineCantiere(){
  if(!SEGRETARIA.email){ return; }
  const c = currentCant;
  const rif = c.commessa || c.titolo || c.cliente || 'cantiere';
  const subject = `Fine cantiere ${rif} - emettere fattura`;
  const lines = [
    'Ciao Antonella,',
    '',
    'il cantiere e stato chiuso. Procedere con emissione fattura.',
    '',
    `Commessa: ${c.commessa || '—'}`,
    `Lavoro: ${c.titolo || '—'}`,
    `Cliente: ${c.cliente || '—'}`,
    `Indirizzo: ${c.indirizzo || '—'}`,

function importaCantieri(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);if(!d.cantieri&&!d.sopralluoghi)throw new Error('File non valido');
      if(d.cantieri&&d.cantieri.length>0){const ce=getCantieri();const ci=new Set(ce.map(c=>c.id));const nc=d.cantieri.filter(c=>!ci.has(c.id));const ac=ce.map(c=>{const b=d.cantieri.find(x=>x.id===c.id);return b||c;});salvaCantieri([...nc,...ac]);}
      renderLista();toast(`✅ Ripristinati ${(d.cantieri||[]).length} cantieri`,'ok');
    }catch(e){toast('Errore: '+e.message,'err');}
  };
  reader.readAsText(file);input.value='';
}

// ── DOCUMENTI DEL CANTIERE (DDT, bolle, fatture) ──
// Le fatture sono dati economici: tabella documenti_cantiere e bucket privato Documenti,
// leggibili solo da admin, direzione e ufficio (RLS). Mai il bucket Foto, che e' pubblico.
// Il PDF con l'intestazione del cantiere si crea al momento dello scarico: la foto resta originale.
const DOC_BUCKET = 'Documenti';
const TIPI_DOC = {DDT:'DDT', BOLLA:'Bolla', FATTURA:'Fattura'};
let documenti = [], docFile = null, docFiltro = '';

function utenteCp(){ try{ return JSON.parse(localStorage.getItem('cp_user')) || {}; }catch{ return {}; } }
// Con il permesso Cantiere in sola lettura si vedono e si scaricano, ma non si caricano
function puoCaricareDoc(){ return (utenteCp().permessi || {}).cantiere !== 'readonly'; }
function oggiIso(){ const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }

async function caricaDocumenti(){
  const el = g('doc-list'), id = currentCant.id;
  g('doc-nuovo').style.display = puoCaricareDoc() ? '' : 'none';
  documenti = []; docFiltro = ''; chiudiFormDoc(); renderDocumenti();
  if(!db){ el.innerHTML = '<div class="vuoto">Server non raggiungibile: documenti non disponibili</div>'; return; }
  el.innerHTML = '<div class="vuoto">Caricamento...</div>';
  const {data, error} = await db.from('documenti_cantiere').select('*')
    .eq('cantiere_id', id).eq('eliminato', false)
    .order('data', {ascending:false, nullsFirst:false}).order('creato_il', {ascending:false});
  if(!currentCant || currentCant.id !== id) return;
  if(error){ console.error('documenti', error); el.innerHTML = `<div class="vuoto">Documenti non letti: ${esc(error.message)}</div>`; return; }
  documenti = data || [];
  renderDocumenti();
}
function documentiFiltrati(){ return docFiltro ? documenti.filter(d => d.tipo === docFiltro) : documenti; }
function filtraDoc(t){ docFiltro = t; renderDocumenti(); }
function renderDocumenti(){
  const tot = documenti.length;
  g('doc-tot').textContent = tot ? tot + (tot === 1 ? ' documento' : ' documenti') : 'DDT, bolle, fatture';
  const presenti = Object.keys(TIPI_DOC).filter(t => documenti.some(d => d.tipo === t));
  g('doc-filtri').innerHTML = presenti.length > 1
    ? [['', 'Tutti'], ...presenti.map(t => [t, TIPI_DOC[t]])].map(([t, n]) =>
        `<button class="${docFiltro === t ? 'on' : ''}" onclick="filtraDoc('${t}')">${n}</button>`).join('')
    : '';
  const lista = documentiFiltrati();
  g('doc-tutti').style.display = lista.length ? '' : 'none';
  g('doc-tutti').textContent = docFiltro ? '📥 Scarica ' + TIPI_DOC[docFiltro].toLowerCase() : '📥 Scarica tutti';
  const io = utenteCp(), admin = isAdmin();
  g('doc-list').innerHTML = lista.length ? lista.map(d => {
    const i = documenti.indexOf(d);
    const mio = admin || (io.nome && d.caricato_da_nome === io.nome);
    return `
    <div class="doc-row">
      <div class="doc-info">
        <div class="doc-tit"><span class="doc-tipo">${TIPI_DOC[d.tipo] || esc(d.tipo)}</span>${d.numero ? 'n. ' + esc(d.numero) + ' ' : ''}${d.data ? 'del ' + dataIt(d.data) : ''}</div>
        <div class="doc-meta">${d.fornitore ? esc(d.fornitore) + ' · ' : ''}caricato da ${esc(d.caricato_da_nome || '—')} il ${dataIt((d.creato_il || '').slice(0, 10))}${d.note ? '<br>' + esc(d.note) : ''}</div>
      </div>
      <div class="doc-btns">
        <button onclick="vediDoc(${i})" title="Vedi foto">👁</button>
        <button onclick="scaricaDoc(${i}, this)" title="Scarica PDF con intestazione">📥</button>
        ${mio ? `<button onclick="eliminaDoc(${i})" title="Elimina">🗑</button>` : ''}
      </div>
    </div>`;
  }).join('') : '<div class="vuoto">Nessun documento caricato</div>';
}

function scegliFotoDoc(input){
  const f = input.files[0]; input.value = '';
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('Serve una foto del documento','err'); return; }
  docFile = f;
  const prev = g('doc-prev');
  if(prev.src) URL.revokeObjectURL(prev.src);
  prev.src = URL.createObjectURL(f);
  g('doc-tipo').value = 'DDT'; g('doc-data').value = oggiIso();
  ['doc-fornitore', 'doc-numero', 'doc-note'].forEach(id => g(id).value = '');
  g('doc-form').classList.add('show');
}
function chiudiFormDoc(){
  docFile = null;
  const prev = g('doc-prev');
  if(prev.src){ URL.revokeObjectURL(prev.src); prev.removeAttribute('src'); }
  g('doc-form').classList.remove('show');
}

// Riduce la foto (lato max 2400 px, JPEG): resta leggibile ma non pesa troppo
function comprimiImmagine(file, maxSide = 2400, quality = 0.85){
  return new Promise((resolve, reject) => {
    const src = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('Immagine non valida')); };
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Compressione fallita')), 'image/jpeg', quality);
    };
    img.src = src;
  });
}

async function salvaDocumento(){
  const btn = g('doc-salva');
  if(btn.disabled) return;
  if(!docFile){ toast('Scegli prima la foto','err'); return; }
  if(!db){ toast('⚠️ Server non raggiungibile: documento non salvato','err'); return; }
  btn.disabled = true; btn.textContent = '⏳ Carico...';
  try{
    const {data:s} = await db.auth.getSession();
    if(!s || !s.session) throw new Error('sessione scaduta, esci e rientra');
    const blob = await comprimiImmagine(docFile);
    const cartella = String(currentCant.id).replace(/[^\w-]/g, '_');
    const path = `cantieri/${cartella}/${Date.now()}.jpg`;
    const up = await db.storage.from(DOC_BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:false});
    if(up.error) throw new Error(up.error.message);
    // Se l'inserimento fallisce il file resta nel bucket senza riga: nessuno lo vede, non fa danni
    const {error} = await db.from('documenti_cantiere').insert({
      cantiere_id: currentCant.id, tipo: g('doc-tipo').value, data: gv('doc-data') || null,
      fornitore: gv('doc-fornitore') || null, numero: gv('doc-numero') || null, note: gv('doc-note') || null,
      path, caricato_da: s.session.user.id, caricato_da_nome: utenteCp().nome || utenteCp().email || null
    });
    if(error) throw new Error(error.message);
    toast('✓ Documento salvato','ok');
    await caricaDocumenti();
  }catch(e){
    console.error('salvaDocumento', e);
    toast('⚠️ Documento non salvato: ' + e.message,'err');
  }finally{
    btn.disabled = false; btn.textContent = 'Salva documento';
  }
}

async function eliminaDoc(i){
  const d = documenti[i]; if(!d) return;
  if(!confirm(`Eliminare ${TIPI_DOC[d.tipo] || d.tipo}${d.numero ? ' n. ' + d.numero : ''}?`)) return;
  const {error} = await db.from('documenti_cantiere').update({eliminato:true, timestamp:new Date().toISOString()}).eq('id', d.id);
  if(error){ toast('⚠️ Non eliminato: ' + error.message,'err'); return; }
  toast('Documento eliminato','inf');
  caricaDocumenti();
}

// Il bucket e' privato: la foto si apre con un link firmato che scade dopo 10 minuti
async function vediDoc(i){
  const d = documenti[i]; if(!d) return;
  const w = window.open('', '_blank');
  const {data, error} = await db.storage.from(DOC_BUCKET).createSignedUrl(d.path, 600);
  if(error || !data){ if(w) w.close(); toast('⚠️ Foto non disponibile: ' + (error ? error.message : ''),'err'); return; }
  if(w) w.location.href = data.signedUrl; else window.location.href = data.signedUrl;
}

// jsPDF si carica solo quando serve (non pesa sull'apertura della pagina).
let jspdfPromise = null;
function caricaJsPDF(){
  if(window.jspdf) return Promise.resolve();
  if(!jspdfPromise) jspdfPromise = new Promise((ok,ko)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js';
    s.integrity = 'sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3';
    s.crossOrigin = 'anonymous';
    s.onload = ()=>ok();
    s.onerror = ()=>{ jspdfPromise = null; ko(new Error('jsPDF non caricato')); };
    document.head.appendChild(s);
  });
  return jspdfPromise;
}
// I font standard del PDF non hanno emoji e alcuni simboli: li sostituisco.
function testoPdf(t){
  return String(t??'')
    .replace(/[‘’‛]/g,"'").replace(/[“”]/g,'"')
    .replace(/[–—]/g,'-').replace(/…/g,'...').replace(/ /g,' ')
    .replace(/[^\n\x20-\x7E¡-ÿ€]/g,'');
}
async function immagineDoc(path){
  const {data, error} = await db.storage.from(DOC_BUCKET).download(path);
  if(error || !data) throw new Error('foto non scaricata' + (error ? ': ' + error.message : ''));
  const src = URL.createObjectURL(data);
  try{
    const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ko(new Error('foto non valida')); i.src=src; });
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0);
    return {data:c.toDataURL('image/jpeg', 0.85), w:c.width, h:c.height};
  } finally { URL.revokeObjectURL(src); }
}
// Una pagina A4: intestazione del cantiere e del documento in alto, sotto la foto
function paginaDoc(pdf, d, img){
  const W = 210, H = 297, M = 12, c = currentCant;
  const testa = (t, size, stile, colore, y) => {
    pdf.setFont('helvetica', stile); pdf.setFontSize(size); pdf.setTextColor(...colore);
    const righe = pdf.splitTextToSize(testoPdf(t), W - 2 * M).slice(0, 2);
    pdf.text(righe, M, y);
    return y + righe.length * size * 0.42 + 1.5;
  };
  let y = M + 5;
  y = testa(`${c.commessa ? 'Commessa ' + c.commessa + ' - ' : ''}${c.titolo || c.cliente || 'Cantiere'}`, 14, 'bold', [20, 20, 20], y);
  if(c.cliente) y = testa('Cliente: ' + c.cliente, 10, 'normal', [60, 60, 60], y);
  if(c.indirizzo) y = testa('Cantiere: ' + c.indirizzo, 10, 'normal', [60, 60, 60], y);
  y += 1.5;
  y = testa(`${TIPI_DOC[d.tipo] || d.tipo}${d.numero ? ' n. ' + d.numero : ''}${d.data ? ' del ' + dataIt(d.data) : ''}${d.fornitore ? ' - ' + d.fornitore : ''}`, 12, 'bold', [20, 20, 20], y);
  y = testa(`Caricato da ${d.caricato_da_nome || '-'} il ${dataIt((d.creato_il || '').slice(0, 10))}${d.note ? ' - ' + d.note : ''}`, 9, 'normal', [110, 110, 110], y);
  pdf.setDrawColor(180, 180, 180); pdf.setLineWidth(0.3); pdf.line(M, y, W - M, y);
  const boxY = y + 4, boxW = W - 2 * M, boxH = H - M - boxY;
  const k = Math.min(boxW / img.w, boxH / img.h);
  const w = img.w * k, h = img.h * k;
  pdf.addImage(img.data, 'JPEG', M + (boxW - w) / 2, boxY, w, h);
}
function nomeFile(parti){ return parti.filter(Boolean).join('_').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/-+/g, '-').slice(0, 120) + '.pdf'; }
function rifCantiere(){ return currentCant.commessa || currentCant.titolo || currentCant.cliente || 'cantiere'; }
async function creaPdfDoc(lista, nome, btn){
  if(btn && btn.disabled) return;
  const etichetta = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '⏳'; }
  try{
    await caricaJsPDF();
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
    for(let n = 0; n < lista.length; n++){
      if(n) pdf.addPage();
      paginaDoc(pdf, lista[n], await immagineDoc(lista[n].path));
    }
    pdf.save(nome);
  }catch(e){
    console.error('pdf documenti', e);
    toast('⚠️ PDF non creato: ' + e.message,'err');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = etichetta; }
  }
}
// Nome file: commessa, tipo, numero, data e fornitore, cosi' nei Download non si mischia
function scaricaDoc(i, btn){
  const d = documenti[i]; if(!d) return;
  const nome = nomeFile([rifCantiere(), TIPI_DOC[d.tipo] || d.tipo, d.numero ? 'n' + d.numero : '', d.data ? dataIt(d.data).replace(/\//g, '-') : '', d.fornitore]);
  creaPdfDoc([d], nome, btn);
}
// Un solo PDF con una pagina per documento (quelli del filtro scelto)
function scaricaTuttiDoc(){
  const lista = documentiFiltrati(); if(!lista.length) return;
  const nome = nomeFile([rifCantiere(), docFiltro ? TIPI_DOC[docFiltro] : 'Documenti', oggiIso().split('-').reverse().join('-')]);
  creaPdfDoc(lista, nome, g('doc-tutti'));
}

// Migrazione Step 2: vecchie giornate[] → record rapporti_v1 (solo prima volta)
// Sync di rapporti remoti PRIMA della migrazione, per evitare duplicati
(async function(){
  // Carica rapporti remoti se esistono, così la migrazione può saltare quelli già esistenti
  if(db){
    try{
      const {data} = await db.from('dati').select('valore').eq('chiave','rapporti_v1').maybeSingle();
      if(data && Array.isArray(data.valore)){
        const locali = getRapporti();
        const ids = new Set(locali.map(r=>r.id));
        const extra = data.valore.filter(r => !ids.has(r.id));
        if(extra.length){
          localStorage.setItem('rapporti_v1', JSON.stringify([...locali, ...extra]));
        }
      }
    }catch(e){ console.warn('Sync rapporti pre-migrazione fallito',e); }
  }
  // Ora esegui migrazione
  migraVecchieGiornate();
})();
