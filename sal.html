<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CommessaPro">
<meta name="theme-color" content="#0F0D0A">
<link rel="icon" href="logo-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SAL</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Epilogue:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{--bg:#FFFFFF;--surface:#F5F5F5;--surface2:#EBEBEB;--brick:#D4511E;--brick-dim:rgba(212,81,30,0.12);--sand:#8A6A50;--sand-dim:rgba(138,106,80,0.12);--white:#1A1612;--muted:#888280;--border:rgba(0,0,0,0.1);--green:#3A7A4C;--green-dim:rgba(58,122,76,0.12);--r:14px;--r-sm:10px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Epilogue',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}
.view{display:none;}.view.active{display:block;}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
.btn-back{color:var(--muted);background:none;border:none;cursor:pointer;font-size:22px;padding:0;}
.btn-top{background:var(--sand-dim);color:var(--sand);border:none;border-radius:8px;padding:7px 12px;font-family:Epilogue,sans-serif;font-size:12px;font-weight:500;cursor:pointer;}
.content{padding:16px 16px 120px;}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.sec-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sand);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-icon{width:28px;height:28px;background:var(--brick-dim);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.fg{margin-bottom:12px;}.fg:last-child{margin-bottom:0;}
label{display:block;font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
input,textarea,select{width:100%;padding:13px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--white);font-family:'Epilogue',sans-serif;font-size:16px;outline:none;-webkit-appearance:none;}
input:focus,textarea:focus{border-color:var(--brick);}
input::placeholder,textarea::placeholder{color:var(--muted);}
input[type="file"]{display:none;}
.foto-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.foto-btn{padding:12px;background:var(--surface2);border:1.5px dashed var(--border);border-radius:var(--r-sm);text-align:center;cursor:pointer;}
.foto-btn:active{border-color:var(--brick);}
.foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.foto-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;}
.foto-item img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-del{position:absolute;top:3px;right:3px;width:22px;height:22px;background:rgba(0,0,0,.75);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.foto-num{position:absolute;bottom:3px;left:5px;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);}
.cant-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;}
.cant-card:active{border-color:var(--brick);}
.cant-icon{width:44px;height:44px;background:var(--brick-dim);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.cant-info{flex:1;min-width:0;}
.cant-nome{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cant-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.sal-entry{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:12px;overflow:hidden;}
.sal-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.sal-data{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.sal-perc{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--green-dim);color:var(--green);}
.sal-desc{padding:0 16px 14px;font-size:13px;line-height:1.6;color:var(--white);}
.sal-foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 16px 14px;}
.sal-foto-item{border-radius:6px;overflow:hidden;aspect-ratio:1;}
.sal-foto-item img{width:100%;height:100%;object-fit:cover;display:block;}
.sal-del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;}
.report-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:#fff;display:none;flex-direction:column;}
.report-overlay.show{display:flex;}
.report-topbar{background:#1A1612;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rep-title{font-family:'Syne',sans-serif;font-size:15px;color:#fff;font-weight:700;}
.rep-actions{display:flex;gap:8px;}
.rep-btn{padding:8px 14px;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.rep-btn.close{background:rgba(255,255,255,.1);color:#fff;}
.rep-btn.print{background:var(--brick);color:#fff;}
.report-frame{flex:1;border:none;width:100%;}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-txt{font-size:15px;font-weight:500;color:var(--sand);margin-bottom:6px;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.toast{position:fixed;top:70px;left:16px;right:16px;padding:14px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;text-align:center;z-index:999;opacity:0;transform:translateY(-8px);transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{background:var(--green);color:#fff;}
.toast.err{background:#C8441A;color:#fff;}
.toast.inf{background:var(--surface2);color:var(--white);border:1px solid var(--border);}
</style>
</head>
<body>

<div id="view-lista" class="view active">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="index.html" style="color:var(--muted);text-decoration:none;font-size:22px">←</a>
      <div class="topbar-title">📸 S.A.L.</div>
    </div>
    <button class="btn-top" onclick="forcSync()" title="Sincronizza">🔄</button>
  </div>

<div class="content" style="padding-bottom:40px">
    <div style="font-size:12px;color:var(--muted);padding:4px 4px 14px">Storico fotografico avanzamento lavori per cantiere.</div>
    <div id="lista-cantieri"></div>
  </div>
</div>

<div id="view-sal" class="view">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-back" onclick="tornaLista()">←</button>
      <div class="topbar-title" id="sal-title">SAL</div>
    </div>
    <div style="display:flex;gap:6px"><button class="btn-top" onclick="esportaWord()">📄 Word</button><button class="btn-top" onclick="esportaSAL()">📤 Esporta</button><button class="btn-top" onclick="mostraForm()">+ Nuovo</button></div>
  </div>
  <div class="content">
    <div id="sal-form" style="display:none">
      <div class="section">
        <div class="sec-title"><div class="sec-icon">📝</div>Nuovo aggiornamento</div>
        <div class="fg"><label>Data</label><input type="date" id="sal-data"></div>
        <div class="fg"><label>Avanzamento %</label><input type="number" id="sal-perc" placeholder="Es. 30" min="0" max="100"></div>
        <div class="fg"><label>Descrizione lavori svolti</label>
          <textarea id="sal-desc" placeholder="Descrivi cosa è stato fatto..."></textarea>
        </div>
        <div class="divider"></div>
        <div class="foto-btns">
          <div class="foto-btn" onclick="document.getElementById('sal-cam').click()">
            <div style="font-size:20px;margin-bottom:4px">📷</div>
            <div style="font-size:12px;font-weight:500;color:var(--sand)">Scatta foto</div>
          </div>
          <div class="foto-btn" onclick="document.getElementById('sal-lib').click()">
            <div style="font-size:20px;margin-bottom:4px">🖼️</div>
            <div style="font-size:12px;font-weight:500;color:var(--sand)">Dalla libreria</div>
          </div>
        </div>
        <input type="file" id="sal-cam" accept="image/*" capture="environment" multiple onchange="caricaFotoForm(this)">
        <input type="file" id="sal-lib" accept="image/*" multiple onchange="caricaFotoForm(this)">
        <div class="foto-grid" id="sal-foto-preview" style="margin-bottom:14px"></div>
        <div style="display:flex;gap:8px">
          <button onclick="nascondiForm()" style="flex:1;padding:14px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:var(--r-sm);font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer">Annulla</button>
          <button onclick="salvaEntrata()" style="flex:2;padding:14px;background:var(--brick);color:#fff;border:none;border-radius:var(--r-sm);font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer">✓ Salva SAL</button>
        </div>
      </div>
    </div>
    <div id="sal-storico"></div>
  </div>
</div>

<div class="report-overlay" id="report-overlay">
  <div class="report-topbar">
    <div class="rep-title">📄 Report S.A.L.</div>
    <div class="rep-actions">
      <button class="rep-btn close" onclick="chiudiReport()">✕ Chiudi</button>
      <button class="rep-btn print" onclick="document.getElementById('report-frame').contentWindow.print()">🖨️ PDF</button>
    </div>
  </div>
  <iframe id="report-frame" class="report-frame"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
// ── GUARD AUTH: gira prima di qualsiasi lettura dati o render ──
(function(){
  let u=null; try{u=JSON.parse(localStorage.getItem('cp_user'))||null;}catch{}
  if(!u||!u.email) window.location.replace('login.html');
})();

// ── SUPABASE ──
const SUPA_URL='https://iradzlocobsipjazracw.supabase.co';
const SUPA_KEY='sb_publishable_zFgRrNrmYSORug8N06heow_6vjl0fhH';
const CANT_KEY='cantieri_v1';
let db=null;
function initDB(){if(window.supabase)db=window.supabase.createClient(SUPA_URL,SUPA_KEY);}
function avvisoSync(msg){ toast('\u26a0\ufe0f '+msg,'err'); }
async function dbSalva(k,v){
  if(!db){ avvisoSync('Non sincronizzato: server non raggiungibile'); return false; }
  const {data:s}=await db.auth.getSession();
  if(!s||!s.session){ avvisoSync('Sessione scaduta: salvato solo su questo dispositivo, esci e rientra'); return false; }
  const {error}=await db.from('dati').upsert({chiave:k,valore:v,ts:new Date().toISOString()},{onConflict:'chiave'});
  if(error){ console.error('dbSalva',k,error); avvisoSync('Non sincronizzato: '+error.message); return false; }
  return true;
}
async function forcSync(){
  toast('🔄 Sincronizzazione...','inf');
  if(!db)return;
  try{
    await allinea(CANT_KEY);
    renderLista();
    toast('✓ Sincronizzato','ok');
  }catch(e){toast('Sync ok','inf');}
}

function __toastErr(msg){ toast('\u26a0\ufe0f ' + msg, 'err'); }

// ── SINCRONIZZAZIONE: scrittura chirurgica + coda offline ──
// Regola: la versione del server e' la base. Ogni dispositivo applica SOLO i
// record che ha appena toccato, quindi una copia locale vecchia non puo' piu'
// riportare indietro modifiche fatte altrove. Le cancellazioni sono marcature
// (eliminato:true) e non rimozioni, cosi' si propagano invece di tornare indietro.
function chiavePending(k){ return 'cp_pending_' + k; }
function getPending(k){ try{ return JSON.parse(localStorage.getItem(chiavePending(k))) || []; }catch{ return []; } }
function aggiungiPending(k, records){
  const m = new Map(getPending(k).map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(chiavePending(k), JSON.stringify([...m.values()]));
}
function svuotaPending(k){ localStorage.removeItem(chiavePending(k)); }
function scriviLocale(k, records){
  let attuali = [];
  try{ attuali = JSON.parse(localStorage.getItem(k)) || []; }catch(e){}
  const m = new Map(attuali.map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(k, JSON.stringify([...m.values()]));
}
function marcaEliminato(rec){ return {...rec, eliminato:true, timestamp:new Date().toISOString()}; }
async function salvaRecord(k, records){
  if(!Array.isArray(records) || !records.length) return true;
  scriviLocale(k, records);
  if(!db){ aggiungiPending(k, records); __toastErr('Salvato sul dispositivo, non ancora sincronizzato'); return false; }
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){
    console.error('salvaRecord lettura', k, error);
    aggiungiPending(k, records);
    __toastErr('Salvato sul dispositivo, non ancora sincronizzato');
    return false;
  }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const m = new Map(base.map(x => [x.id, x]));
  getPending(k).forEach(r => m.set(r.id, r));
  records.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  const ok = await dbSalva(k, finale);
  if(!ok){ aggiungiPending(k, records); return false; }
  svuotaPending(k);
  localStorage.setItem(k, JSON.stringify(finale));
  return true;
}
// Allinea la copia locale a quella del server, mantenendo le modifiche in coda
async function allinea(k){
  if(!db) return false;
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){ console.error('allinea', k, error); __toastErr('Lettura dal server non riuscita: ' + error.message); return false; }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const pend = getPending(k);
  const m = new Map(base.map(x => [x.id, x]));
  pend.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  localStorage.setItem(k, JSON.stringify(finale));
  if(pend.length){
    const ok = await dbSalva(k, finale);
    if(ok) svuotaPending(k);
  }
  return true;
}

let currentCantId=null, fotoForm=[];
const g=id=>document.getElementById(id);
const gv=id=>g(id)?.value?.trim()||'';
function toast(msg,tipo){const t=g('toast');t.textContent=msg;t.className='toast '+tipo+' show';clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000);}
function getCantieri(){try{return (JSON.parse(localStorage.getItem(CANT_KEY))||[]).filter(c=>!c.eliminato);}catch{return[];}}
function salvaCantieri(l){ return salvaRecord(CANT_KEY, l); }
function showView(n){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));g('view-'+n).classList.add('active');window.scrollTo(0,0);}

function renderLista(){
  const lista=getCantieri().filter(c=>!c.archiviato);const el=g('lista-cantieri');
  if(!lista.length){el.innerHTML=`<div class="empty-state"><div class="empty-icon">📸</div><div class="empty-txt">Nessun cantiere</div><div style="font-size:13px;color:var(--muted)">Avvia un cantiere dalla scheda Sopralluogo</div></div>`;return;}
  el.innerHTML=lista.map(c=>{
    const n=(c.sal||[]).length;
    return `<div class="cant-card" onclick="apriSAL('${c.id}')">
      <div class="cant-icon">📸</div>
      <div class="cant-info"><div class="cant-nome">${c.commessa?c.commessa+' — ':''} ${c.titolo||c.cliente||'—'}</div><div class="cant-meta">${c.cliente||'—'} · ${c.indirizzo||'—'} · ${n} aggiornament${n===1?'o':'i'}</div></div>
      <span style="font-size:20px;color:var(--muted)">→</span>
    </div>`;}).join('');
}

function apriSAL(id){
  currentCantId=id;const c=getCantieri().find(x=>x.id===id);if(!c)return;
  g('sal-title').textContent=c.titolo||c.cliente||'SAL';g('sal-form').style.display='none';
  fotoForm=[];renderStorico(c);showView('sal');
}
function tornaLista(){showView('lista');renderLista();}

function mostraForm(){
  g('sal-form').style.display='block';
  g('sal-data').value=new Date().toISOString().split('T')[0];
  g('sal-perc').value='';g('sal-desc').value='';
  fotoForm=[];renderFotoForm();
  g('sal-form').scrollIntoView({behavior:'smooth'});
}
function nascondiForm(){g('sal-form').style.display='none';fotoForm=[];}

function caricaFotoForm(input){
  [...input.files].forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const MAX=600;let w=img.width,h=img.height;
        if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
        canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
        fotoForm.push(canvas.toDataURL('image/jpeg',0.65));renderFotoForm();
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });input.value='';
}
function renderFotoForm(){
  const el=g('sal-foto-preview');if(!fotoForm.length){el.innerHTML='';return;}
  el.innerHTML=fotoForm.map((url,i)=>`<div class="foto-item"><img src="${url}"><button class="foto-del" onclick="delFotoForm(${i})">✕</button><span class="foto-num">${i+1}</span></div>`).join('');
}
function delFotoForm(i){fotoForm.splice(i,1);renderFotoForm();}

function salvaEntrata(){
  const desc=gv('sal-desc');if(!desc){toast('Inserisci una descrizione','err');return;}
  const lista=getCantieri();const idx=lista.findIndex(c=>c.id===currentCantId);if(idx<0)return;
  if(!lista[idx].sal)lista[idx].sal=[];
  lista[idx].sal.unshift({id:'sal_'+Date.now(),data:gv('sal-data')||new Date().toISOString().split('T')[0],perc:gv('sal-perc'),desc,foto:[...fotoForm]});
  salvaRecord(CANT_KEY,[lista[idx]]);g('sal-form').style.display='none';fotoForm=[];
  renderStorico(lista[idx]);toast('✅ SAL salvato','ok');
}

function renderStorico(c){
  const el=g('sal-storico');const sal=c.sal||[];
  if(!sal.length){el.innerHTML=`<div class="empty-state"><div class="empty-icon">📷</div><div class="empty-txt">Nessun aggiornamento</div><div style="font-size:13px;color:var(--muted)">Premi "+ Nuovo" per aggiungere il primo SAL</div></div>`;return;}
  el.innerHTML=sal.map((s,i)=>{
    const d=new Date(s.data).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
    const fotoHtml=s.foto&&s.foto.length?`<div class="sal-foto-grid">${s.foto.map(url=>`<div class="sal-foto-item"><img src="${url}"></div>`).join('')}</div>`:'';
    return `<div class="sal-entry">
      <div class="sal-header">
        <div><div class="sal-data">${d}</div>${s.foto&&s.foto.length?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${s.foto.length} foto</div>`:''}</div>
        <div style="display:flex;align-items:center;gap:8px">
          ${s.perc?`<span class="sal-perc">${s.perc}%</span>`:''}
          <button class="sal-del" onclick="delSAL('${c.id}',${i})">🗑</button>
        </div>
      </div>
      <div class="sal-desc">${s.desc}</div>
      ${fotoHtml}
    </div>`;
  }).join('');
}

function delSAL(cantId,i){
  if(!confirm('Eliminare questo aggiornamento?'))return;
  const lista=getCantieri();const idx=lista.findIndex(c=>c.id===cantId);if(idx<0)return;
  lista[idx].sal.splice(i,1);salvaRecord(CANT_KEY,[lista[idx]]);renderStorico(lista[idx]);toast('Eliminato','ok');
}


// ── ESPORTA SAL ──
function esportaSAL(){
  const lista = getCantieri();
  const c = lista.find(x=>x.id===currentCantId);
  if(!c) return;
  const sal = c.sal||[];
  if(!sal.length){ toast('Nessun aggiornamento da esportare','err'); return; }

  const COLS=2;
  const entriesHtml = sal.map(s=>{
    const d = new Date(s.data).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
    const fotoArr = s.foto||[];
    let fotoRows='';
    if(fotoArr.length){
      fotoRows='<table style="width:100%;border-collapse:separate;border-spacing:4mm 3mm">';
      for(let i=0;i<fotoArr.length;i+=COLS){
        fotoRows+='<tr style="break-inside:avoid;page-break-inside:avoid">';
        for(let j=0;j<COLS;j++){
          const url=fotoArr[i+j];
          fotoRows+=url?`<td style="vertical-align:top;padding:0;text-align:center;width:50%;break-inside:avoid;page-break-inside:avoid"><div style="font-size:7px;color:#9C9088;margin-bottom:2px;font-weight:700;letter-spacing:1px;text-align:center">FOTO ${i+j+1}</div><img src="${url}" style="width:100%;max-height:62mm;object-fit:cover;border-radius:4px;border:1px solid #E8E2D9;display:block"></td>`:'<td style="width:50%"></td>';
        }
        fotoRows+='</tr>';
      }
      fotoRows+='</table>';
    }
    return `<div class="sec"><div class="stitle">📅 ${d}${s.perc?` — Avanzamento ${s.perc}%`:''}</div><div class="btext">${s.desc||''}</div>${fotoRows}</div>`;
  }).join('');

  const oggi = new Date().toLocaleDateString('it-IT');
  const html=`<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAL — ${c.titolo||c.cliente||'—'}</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;background:#fff;color:#1A1612;padding:12px 16px;max-width:720px;margin:0 auto;font-size:13px;}.hdr{border-bottom:3px solid #D4511E;padding-bottom:10px;margin-bottom:14px;}.ttl{font-size:19px;font-weight:700;}.sub{font-size:11px;color:#9C9088;margin-top:2px;}.sec{margin-bottom:10px;}.stitle{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#D4511E;border-bottom:1px solid #E8E2D9;padding-bottom:3px;margin-bottom:6px;break-after:avoid;page-break-after:avoid;}.btext{font-size:12px;line-height:1.7;white-space:pre-wrap;}@page{margin:12mm;}@media print{body{padding:0;max-width:none;}}</style></head><body>
<div class="hdr"><div class="ttl">S.A.L. — ${c.titolo||c.cliente||'—'}</div><div class="sub">${c.cliente||''} · ${c.indirizzo||''}</div><div class="sub">Esportato il ${oggi}</div></div>
${entriesHtml}
</body></html>`;

  const frame=g('report-frame'); const overlay=g('report-overlay'); overlay.classList.add('show');
  const doc=frame.contentDocument||frame.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
}

// ── ESPORTA WORD: solo foto, griglia 2×2 da template ──
function fotoCoverJpeg(url){
  // Ritaglio centrale a 4:3 (equivalente di object-fit:cover nel riquadro 8×6cm)
  return new Promise((resolve,reject)=>{
    const img=new Image();
    if(/^https?:/i.test(url)) img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const W=800,H=600;
        const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
        const ctx=canvas.getContext('2d');
        const scala=Math.max(W/img.width,H/img.height);
        const w=img.width*scala,h=img.height*scala;
        ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
        canvas.toBlob(b=>b?b.arrayBuffer().then(resolve,reject):reject(new Error('toBlob fallito')),'image/jpeg',0.85);
      }catch(e){reject(e);}
    };
    img.onerror=()=>reject(new Error('immagine non caricata'));
    img.src=url;
  });
}

async function esportaWord(){
  const c=getCantieri().find(x=>x.id===currentCantId); if(!c)return;
  const sal=c.sal||[];
  // Lo storico è salvato dal più recente (unshift): inverto e ordino per data
  const entries=[...sal].reverse().sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const urls=entries.flatMap(s=>s.foto||[]);
  if(!urls.length){toast('Nessuna foto da esportare','err');return;}
  if(!window.docx){toast('Libreria Word non caricata, controlla la connessione','err');return;}
  toast('📄 Generazione Word in corso...','inf');

  const buffers=[]; let saltate=0;
  for(const u of urls){
    try{ buffers.push(await fotoCoverJpeg(u)); }
    catch(e){ console.error('esportaWord: foto saltata',e); saltate++; }
  }
  if(!buffers.length){toast('Nessuna foto esportabile','err');return;}

  const {Document,Packer,Paragraph,TextRun,ImageRun,Table,TableRow,TableCell,WidthType,BorderStyle,AlignmentType}=window.docx;
  const CM=567;                       // 1 cm in twip
  const FOTO_W=302,FOTO_H=227;        // 8×6 cm in px a 96 DPI
  const NB={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const cellaFoto=(buf,num)=>new TableCell({
    width:{size:50,type:WidthType.PERCENTAGE},
    borders:{top:NB,bottom:NB,left:NB,right:NB},
    children:[
      new Paragraph({alignment:AlignmentType.CENTER,children:[new ImageRun({type:'jpg',data:buf,transformation:{width:FOTO_W,height:FOTO_H}})]}),
      new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:'foto '+num,bold:true,font:'Arial',size:16,color:'00B0F0'})]})
    ]
  });
  const cellaVuota=()=>new TableCell({
    width:{size:50,type:WidthType.PERCENTAGE},
    borders:{top:NB,bottom:NB,left:NB,right:NB},
    children:[new Paragraph({children:[]})]
  });

  const children=[
    new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:200},
      children:[new TextRun({text:c.titolo||c.cliente||'—',bold:true,font:'Arial',size:28})]})
  ];
  for(let p=0;p<buffers.length;p+=4){
    if(p>0) children.push(new Paragraph({pageBreakBefore:true,children:[]}));
    const rows=[];
    for(let r=p;r<Math.min(p+4,buffers.length);r+=2){
      const celle=[cellaFoto(buffers[r],r+1)];
      celle.push(buffers[r+1]&&r+1<p+4?cellaFoto(buffers[r+1],r+2):cellaVuota());
      rows.push(new TableRow({children:celle}));
    }
    children.push(new Table({
      width:{size:100,type:WidthType.PERCENTAGE},
      borders:{top:NB,bottom:NB,left:NB,right:NB,insideHorizontal:NB,insideVertical:NB},
      rows
    }));
  }

  const doc=new Document({sections:[{
    properties:{page:{margin:{top:CM,right:2*CM,bottom:2*CM,left:2*CM}}},
    children
  }]});

  const blob=await Packer.toBlob(doc);
  const nome=(c.titolo||c.cliente||'cantiere').replace(/[\\/:*?"<>|]+/g,'').trim().replace(/\s+/g,'-');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`SAL_${nome}_${new Date().toISOString().split('T')[0]}.docx`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast(saltate?`✅ Word generato (${saltate} foto saltate)`:'✅ Word generato','ok');
}
