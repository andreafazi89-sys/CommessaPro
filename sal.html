<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Epilogue',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}
.view{display:none;}.view.active{display:block;}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
.btn-back{color:var(--muted);background:none;border:none;cursor:pointer;font-size:22px;padding:0;}
.btn-top{background:var(--sand-dim);color:var(--sand);border:none;border-radius:8px;padding:7px 12px;font-family:Epilogue,sans-serif;font-size:12px;font-weight:500;cursor:pointer;}
.content{padding:16px 16px 120px;}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.sec-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sand);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-icon{width:28px;height:28px;background:var(--brick-dim);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.fg{margin-bottom:12px;}.fg:last-child{margin-bottom:0;}
label{display:block;font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
input,textarea,select{width:100%;padding:13px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--white);font-family:'Epilogue',sans-serif;font-size:16px;outline:none;-webkit-appearance:none;}
input:focus,textarea:focus{border-color:var(--brick);}
input::placeholder,textarea::placeholder{color:var(--muted);}
input[type="file"]{display:none;}
.foto-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.foto-btn{padding:12px;background:var(--surface2);border:1.5px dashed var(--border);border-radius:var(--r-sm);text-align:center;cursor:pointer;}
.foto-btn:active{border-color:var(--brick);}
.foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.foto-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;}
.foto-item img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-del{position:absolute;top:3px;right:3px;width:22px;height:22px;background:rgba(0,0,0,.75);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.foto-num{position:absolute;bottom:3px;left:5px;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);}
.cant-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;}
.cant-card:active{border-color:var(--brick);}
.cant-icon{width:44px;height:44px;background:var(--brick-dim);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.cant-info{flex:1;min-width:0;}
.cant-nome{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cant-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.sal-entry{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:12px;overflow:hidden;}
.sal-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.sal-data{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.sal-perc{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--green-dim);color:var(--green);}
.sal-desc{padding:0 16px 14px;font-size:13px;line-height:1.6;color:var(--white);}
.sal-foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 16px 14px;}
.sal-foto-item{border-radius:6px;overflow:hidden;aspect-ratio:1;}
.sal-foto-item img{width:100%;height:100%;object-fit:cover;display:block;}
.sal-del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;}
.report-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:#fff;display:none;flex-direction:column;}
.report-overlay.show{display:flex;}
.report-topbar{background:#1A1612;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rep-title{font-family:'Syne',sans-serif;font-size:15px;color:#fff;font-weight:700;}
.rep-actions{display:flex;gap:8px;}
.rep-btn{padding:8px 14px;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.rep-btn.close{background:rgba(255,255,255,.1);color:#fff;}
.rep-btn.print{background:var(--brick);color:#fff;}
.report-frame{flex:1;border:none;width:100%;}
.rep-opzioni{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;padding:8px 16px;background:#2A241E;color:#fff;font-size:13px;flex-shrink:0;}
.rep-opzioni label{display:flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-size:13px;text-transform:none;letter-spacing:0;color:#fff;margin:0;}
.rep-opzioni input{width:20px;height:20px;accent-color:var(--brick);}
.rep-btn:disabled{opacity:.6;}
.rep-scegli{min-height:40px;padding:8px 14px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;font-family:'Epilogue',sans-serif;font-size:13px;font-weight:500;cursor:pointer;}
.rep-corpo{flex:1;position:relative;display:flex;min-height:0;}
.rep-scelta{position:absolute;inset:0;overflow:auto;background:var(--bg);color:var(--white);padding:14px 16px 40px;display:none;}
.rep-scelta.show{display:block;}
.sc-sal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:12px;}
.sc-sal.spento .sc-grid{opacity:.35;pointer-events:none;}
.sc-head{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--white);margin:0;}
.sc-head input{width:22px;height:22px;flex-shrink:0;accent-color:var(--brick);}
.sc-desc{font-size:12px;color:var(--muted);margin:2px 0 8px 32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-azioni{display:flex;gap:8px;margin:0 0 8px 32px;}
.sc-azioni button{min-height:40px;padding:6px 12px;background:var(--surface2);color:var(--sand);border:1px solid var(--border);border-radius:8px;font-family:'Epilogue',sans-serif;font-size:12px;cursor:pointer;}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;}
.sc-foto{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:pointer;border:3px solid transparent;}
.sc-foto img{width:100%;height:100%;object-fit:cover;display:block;}
.sc-foto.off img{opacity:.3;}
.sc-foto.on{border-color:var(--brick);}
.sc-check{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.sc-foto.on .sc-check{background:var(--brick);}
.sc-vuoto{font-size:12px;color:var(--muted);margin-left:32px;}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-txt{font-size:15px;font-weight:500;color:var(--sand);margin-bottom:6px;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.toast.ok{background:var(--green);color:#fff;}
.toast.err{background:#C8441A;color:#fff;}
.toast.inf{background:var(--surface2);color:var(--white);border:1px solid var(--border);}
.foto-btns-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.foto-btn-sm{padding:10px 6px;background:var(--surface2);border:1.5px dashed var(--border);border-radius:var(--r-sm);text-align:center;cursor:pointer;}
.foto-btn-sm:active{border-color:var(--brick);}
.foto-item.loading::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45);border-radius:8px;}
.foto-item.loading::before{content:'';position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;z-index:2;}
.foto-item.failed{outline:2px solid var(--brick);}
.foto-item.failed::after{content:'!';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-weight:800;background:var(--brick);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;}
@keyframes spin{to{transform:rotate(360deg);}}
.cam-overlay{position:fixed;inset:0;background:#000;z-index:1000;display:none;flex-direction:column;}
.cam-overlay.show{display:flex;}
.cam-video{flex:1;width:100%;height:100%;object-fit:cover;background:#000;}
.cam-controls{position:absolute;left:0;right:0;bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);}
.cam-btn{flex-shrink:0;padding:12px 16px;border:none;border-radius:999px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.cam-btn.scatta{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);padding:0;}
.cam-btn.scatta:active{transform:scale(.94);}
.cam-btn.fine{background:var(--brick);}
.cam-top{position:absolute;top:0;left:0;right:0;padding:14px 16px calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);color:#fff;}
.cam-counter{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:999px;}
.cam-err{position:absolute;left:16px;right:16px;bottom:120px;background:rgba(0,0,0,.75);color:#fff;padding:12px;border-radius:10px;font-size:13px;text-align:center;display:none;}
.cam-err.show{display:block;}
.sal-actions{display:flex;align-items:center;gap:6px;}
.sal-btn{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px;}
.sal-btn:active{background:var(--surface2);}
.sal-btn.mod{color:var(--sand);}
</style>

<body>

<script>
// ── GUARD AUTH: gira prima di qualsiasi lettura dati o render ──
(function(){
  let u=null; try{u=JSON.parse(localStorage.getItem('cp_user'))||null;}catch{}
  if(!u||!u.email) window.location.replace('login.html');
})();

// ── SUPABASE ──
const SUPA_URL='https://iradzlocobsipjazracw.supabase.co';
const SUPA_KEY='sb_publishable_zFgRrNrmYSORug8N06heow_6vjl0fhH';
const CANT_KEY='cantieri_v1';
let db=null;
function initDB(){if(window.supabase)db=window.supabase.createClient(SUPA_URL,SUPA_KEY);}
function avvisoSync(msg){ toast('\u26a0\ufe0f '+msg,'err'); }
async function dbSalva(k,v){
  if(!db){ avvisoSync('Non sincronizzato: server non raggiungibile'); return false; }
  const {data:s}=await db.auth.getSession();
  if(!s||!s.session){ avvisoSync('Sessione scaduta: salvato solo su questo dispositivo, esci e rientra'); return false; }
  const {error}=await db.from('dati').upsert({chiave:k,valore:v,ts:new Date().toISOString()},{onConflict:'chiave'});
  if(error){ console.error('dbSalva',k,error); avvisoSync('Non sincronizzato: '+error.message); return false; }
  return true;
}
async function forcSync(){
  toast('🔄 Sincronizzazione...','inf');
  if(!db)return;
  try{
    await allinea(CANT_KEY);
    renderLista();
    toast('✓ Sincronizzato','ok');
  }catch(e){toast('Sync ok','inf');}
}

function __toastErr(msg){ toast('\u26a0\ufe0f ' + msg, 'err'); }

// ── SINCRONIZZAZIONE: scrittura chirurgica + coda offline ──
// Regola: la versione del server e' la base. Ogni dispositivo applica SOLO i
// record che ha appena toccato, quindi una copia locale vecchia non puo' piu'
// riportare indietro modifiche fatte altrove. Le cancellazioni sono marcature
// (eliminato:true) e non rimozioni, cosi' si propagano invece di tornare indietro.
function chiavePending(k){ return 'cp_pending_' + k; }
function getPending(k){ try{ return JSON.parse(localStorage.getItem(chiavePending(k))) || []; }catch{ return []; } }
function aggiungiPending(k, records){
  const m = new Map(getPending(k).map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(chiavePending(k), JSON.stringify([...m.values()]));
}
function svuotaPending(k){ localStorage.removeItem(chiavePending(k)); }
function scriviLocale(k, records){
  let attuali = [];
  try{ attuali = JSON.parse(localStorage.getItem(k)) || []; }catch(e){}
  const m = new Map(attuali.map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(k, JSON.stringify([...m.values()]));
}
function marcaEliminato(rec){ return {...rec, eliminato:true, timestamp:new Date().toISOString()}; }
async function salvaRecord(k, records){
  if(!Array.isArray(records) || !records.length) return true;
  scriviLocale(k, records);
  if(!db){ aggiungiPending(k, records); __toastErr('Salvato sul dispositivo, non ancora sincronizzato'); return false; }
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){
    console.error('salvaRecord lettura', k, error);
    aggiungiPending(k, records);
    __toastErr('Salvato sul dispositivo, non ancora sincronizzato');
    return false;
  }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const m = new Map(base.map(x => [x.id, x]));
  getPending(k).forEach(r => m.set(r.id, r));
  records.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  const ok = await dbSalva(k, finale);
  if(!ok){ aggiungiPending(k, records); return false; }
  svuotaPending(k);
  localStorage.setItem(k, JSON.stringify(finale));
  return true;
}
// Allinea la copia locale a quella del server, mantenendo le modifiche in coda
async function allinea(k){
  if(!db) return false;
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){ console.error('allinea', k, error); __toastErr('Lettura dal server non riuscita: ' + error.message); return false; }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const pend = getPending(k);
  const m = new Map(base.map(x => [x.id, x]));
  pend.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  localStorage.setItem(k, JSON.stringify(finale));
  if(pend.length){
    const ok = await dbSalva(k, finale);
    if(ok) svuotaPending(k);
  }
  return true;
}

// ── STORAGE + sal_foto ──
function fotoPublicUrl(path){ if(!db||!path) return ''; return db.storage.from('Foto').getPublicUrl(path).data.publicUrl; }
async function fetchFotoSAL(cantId){
  if(!db) return [];
  const {data,error}=await db.from('sal_foto')
    .select('id,sal_id,path,uploaded_by,uploaded_by_nome,data_caricamento')
    .eq('cantiere_id',cantId).eq('eliminato',false)
    .order('data_caricamento',{ascending:true});
  if(error){ console.error('fetchFotoSAL',error); toast('Errore lettura foto SAL: '+error.message,'err'); return []; }
  return (data||[]).map(r=>({...r,url:fotoPublicUrl(r.path)}));
}
async function uploadFotoBlob(blob,cantId,salId,progressivo){
  if(!db) throw new Error('server non raggiungibile');
  const ts=Date.now();
  const ext=(blob.type && blob.type.split('/')[1])==='png'?'png':'jpg';
  const path='sal/'+cantId+'/'+salId+'/'+ts+'_'+progressivo+'.'+ext;
  const up=await db.storage.from('Foto').upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:false});
  if(up.error) throw up.error;
  const ins=await db.from('sal_foto').insert({
    cantiere_id:cantId, sal_id:salId, path:path, uploaded_by_nome:nomeUtente()
  });
  if(ins.error){
    try{ await db.storage.from('Foto').remove([path]); }catch(_){}
    throw ins.error;
  }
  return path;
}

function ordinaPerCommessa(a,b){
  const ca=(a.commessa||'').trim(), cb=(b.commessa||'').trim();
  if(!ca && !cb) return 0;
  if(!ca) return -1;
  if(!cb) return 1;
  return cb.localeCompare(ca,'it',{numeric:true,sensitivity:'base'});
}

// ── CATTURA / CARICAMENTO FOTO ──
function riduciImmagine(file,MAX,q){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){ if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; } } else { if(h>MAX){ w=Math.round(w*MAX/h); h=MAX; } }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(b=>resolve(b),'image/jpeg',q);
      };
      img.onerror=()=>resolve(null);
      img.src=e.target.result;
    };
    r.onerror=()=>resolve(null);
    r.readAsDataURL(file);
  });
}
async function caricaFotoInput(input){
  const files=[...input.files]; input.value='';
  if(!files.length) return;
  const blobs=(await Promise.all(files.map(f=>riduciImmagine(f,1600,0.82)))).filter(Boolean);
  await caricaFotoBlobs(blobs);
}
async function caricaFotoBlobs(blobs){
  if(!formSalId){ toast('Form non pronto, riapri "+ Nuovo"','err'); return; }
  if(!db){ toast('Server non raggiungibile','err'); return; }
  if(!blobs.length) return;
  const base=fotoForm.length;
  blobs.forEach((b,i)=>{
    fotoForm.push({ localId:'f_'+Date.now()+'_'+(base+i), previewUrl:URL.createObjectURL(b), path:null, state:'uploading' });
  });
  renderFotoForm();
  await Promise.all(blobs.map((b,i)=>caricaUnoBlob(b,base+i)));
}
async function caricaUnoBlob(blob,idx){
  try{
    const path=await uploadFotoBlob(blob, currentCantId, formSalId, idx);
    fotoForm[idx].path=path; fotoForm[idx].state='ok';
  }catch(e){
    console.error('upload foto',e);
    fotoForm[idx].state='err';
    toast('Upload foto fallito: '+(e.message||e),'err');
  }
  renderFotoForm();
}
function renderFotoForm(){
  const el=g('sal-foto-preview');
  if(!fotoForm.length){ el.innerHTML=''; return; }
  const admin=isAdmin();
  el.innerHTML=fotoForm.map((f,i)=>{
    const cls=f.state==='uploading'?'loading':(f.state==='err'?'failed':'');
    const canDel = puoEliminareFoto() && f.state!=='uploading';
    const btn = canDel ? `<button class="foto-del" onclick="delFotoForm(${i})" title="Elimina">×</button>` : '';
    return `<div class="foto-item ${cls}"><img src="${f.previewUrl}">${btn}<span class="foto-num">${i+1}</span></div>`;
  }).join('');
}
async function delFotoForm(i){
  if(!puoEliminareFoto()){ toast('Eliminazione riservata all\'amministratore','err'); return; }
  const f=fotoForm[i]; if(!f) return;
  if(f.state==='uploading'){ toast('Attendi fine upload','inf'); return; }
  if(f.state==='ok' && f.path){
    const {error}=await db.from('sal_foto').update({eliminato:true}).eq('path',f.path);
    if(error){ toast('Impossibile eliminare: '+error.message,'err'); return; }
    try{ await db.storage.from('Foto').remove([f.path]); }catch(_){}
  }
  try{ URL.revokeObjectURL(f.previewUrl); }catch(_){}
  fotoForm.splice(i,1); renderFotoForm();
}

// ── FOTOCAMERA CUSTOM (overlay) ──
let camStream=null, camFacing='environment', camBuffer=[];
async function apriFotocamera(){
  if(!formSalId){ toast('Form non pronto, riapri "+ Nuovo"','err'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Fotocamera non supportata, usa gli altri pulsanti','err'); return;
  }
  camBuffer=[]; aggiornaContatoreCam();
  g('cam-err').classList.remove('show');
  g('cam-overlay').classList.add('show');
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing},audio:false});
    const v=g('cam-video'); v.srcObject=camStream; await v.play();
  }catch(e){
    const err=g('cam-err');
    err.textContent='Fotocamera non disponibile: '+(e.message||e)+'. Usa i pulsanti alternativi.';
    err.classList.add('show');
  }
}
function stopStreamCam(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  const v=g('cam-video'); if(v) v.srcObject=null;
}
async function cambiaFotocamera(){
  camFacing = (camFacing==='environment')?'user':'environment';
  stopStreamCam();
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing},audio:false});
    const v=g('cam-video'); v.srcObject=camStream; await v.play();
  }catch(e){ toast('Altra fotocamera non disponibile','err'); }
}
function scattaFoto(){
  const v=g('cam-video'); if(!v||!v.videoWidth) return;
  const MAX=1600; let w=v.videoWidth,h=v.videoHeight;
  if(w>h){ if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; } } else { if(h>MAX){ w=Math.round(w*MAX/h); h=MAX; } }
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(v,0,0,w,h);
  c.toBlob(b=>{ if(b){ camBuffer.push(b); aggiornaContatoreCam(); } },'image/jpeg',0.85);
}
function aggiornaContatoreCam(){
  g('cam-counter').textContent=String(camBuffer.length);
  g('cam-fine').textContent='Fine ('+camBuffer.length+')';
}
async function chiudiFotocamera(annulla){
  const buf=camBuffer.slice(); camBuffer=[];
  stopStreamCam();
  g('cam-overlay').classList.remove('show');
  if(annulla || !buf.length) return;
  await caricaFotoBlobs(buf);
}

// ── SALVA ──
async function salvaEntrata(){
  const lista=getCantieri(); const idx=lista.findIndex(c=>c.id===currentCantId); if(idx<0) return;
  if(!lista[idx].sal) lista[idx].sal=[];
  if(fotoForm.some(f=>f.state==='uploading')){ toast('Attendi fine upload foto','err'); return; }

  if(editingSalId){
    const i=lista[idx].sal.findIndex(x=>x.id===editingSalId);
    if(i<0){ toast('SAL non trovato','err'); return; }
    if(isAdmin()){
      const desc=gv('sal-desc'); if(!desc){ toast('Inserisci una descrizione','err'); return; }
      lista[idx].sal[i].data=gv('sal-data')||lista[idx].sal[i].data;
      lista[idx].sal[i].perc=gv('sal-perc');
      lista[idx].sal[i].desc=desc;
      await salvaRecord(CANT_KEY,[lista[idx]]);
    }
    toast('✅ Aggiornato','ok');
  } else {
    const desc=gv('sal-desc'); if(!desc){ toast('Inserisci una descrizione','err'); return; }
    lista[idx].sal.unshift({
      id: formSalId,
      data: gv('sal-data')||new Date().toISOString().split('T')[0],
      perc: gv('sal-perc'),
      desc,
      foto: []
    });
    await salvaRecord(CANT_KEY,[lista[idx]]);
    toast('✅ SAL salvato','ok');
  }
  g('sal-form').style.display='none';
  fotoForm.forEach(f=>{ try{URL.revokeObjectURL(f.previewUrl);}catch(_){} });
  fotoForm=[]; editingSalId=null; formSalId=null;
  fotoRemoteByCant[currentCantId]=await fetchFotoSAL(currentCantId);
  renderStorico(lista[idx]);
}

function renderStorico(c){
  const el=g('sal-storico'); const sal=c.sal||[];
  g('btn-nuovo-sal').style.display=solaLettura()?'none':'';
  if(!sal.length){ el.innerHTML=`<div class="empty-state"><div class="empty-icon">📷</div><div class="empty-txt">Nessun aggiornamento</div><div style="font-size:13px;color:var(--muted)">Premi "+ Nuovo" per aggiungere il primo SAL</div></div>`; return; }
  const remote=fotoRemoteByCant[c.id]||[];
  const admin=isAdmin();
  el.innerHTML=sal.map(s=>{
    const d=new Date(s.data).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
    const fRemote=remote.filter(x=>x.sal_id===s.id).map(x=>x.url);
    const fLegacy=(s.foto||[]).filter(x=>typeof x==='string' && x.startsWith('data:'));
    const tutte=[...fRemote,...fLegacy];
    const fotoHtml = tutte.length ? `<div class="sal-foto-grid">${tutte.map(url=>`<div class="sal-foto-item"><img src="${url}" loading="lazy"></div>`).join('')}</div>` : '';
    const btnMod = solaLettura() ? '' : `<button class="sal-btn mod" onclick="modificaSAL('${c.id}','${s.id}')" title="${admin?'Modifica':'Aggiungi foto'}">${admin?'✏️':'📷+'}</button>`;
    const btnDel = puoEliminareFoto() ? `<button class="sal-btn" onclick="delSAL('${c.id}','${s.id}')" title="Elimina">🗑</button>` : '';
    return `<div class="sal-entry">
      <div class="sal-header">
        <div><div class="sal-data">${d}</div>${tutte.length?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${tutte.length} foto</div>`:''}</div>
        <div class="sal-actions">
          ${s.perc?`<span class="sal-perc">${s.perc}%</span>`:''}
          ${btnMod}${btnDel}
        </div>
      </div>
      <div class="sal-desc">${s.desc||''}</div>
      ${fotoHtml}
    </div>`;
  }).join('');
}

async function delSAL(cantId, salId){
  if(!puoEliminareFoto()){ toast('Eliminazione riservata all\'amministratore','err'); return; }
  if(!confirm('Eliminare questo aggiornamento e tutte le sue foto?')) return;
  const lista=getCantieri(); const idx=lista.findIndex(c=>c.id===cantId); if(idx<0) return;
  const i=lista[idx].sal.findIndex(s=>s.id===salId); if(i<0) return;
  // Soft-delete foto su sal_foto + remove oggetti da Storage
  if(db){
    const {data:righe,error:errLst}=await db.from('sal_foto').select('path').eq('cantiere_id',cantId).eq('sal_id',salId).eq('eliminato',false);
    if(errLst){ toast('Errore lettura foto: '+errLst.message,'err'); return; }
    const paths=(righe||[]).map(r=>r.path);
    const {error:errUpd}=await db.from('sal_foto').update({eliminato:true}).eq('cantiere_id',cantId).eq('sal_id',salId).eq('eliminato',false);
    if(errUpd){ toast('Errore eliminazione foto: '+errUpd.message,'err'); return; }
    if(paths.length){ try{ await db.storage.from('Foto').remove(paths); }catch(_){} }
  }
  lista[idx].sal.splice(i,1);
  await salvaRecord(CANT_KEY,[lista[idx]]);
  fotoRemoteByCant[cantId]=await fetchFotoSAL(cantId);
  renderStorico(lista[idx]);
  toast('Eliminato','ok');
}


// ── ESPORTA SAL ──
function fotoMerged(c, s){
  const remote=(fotoRemoteByCant[c.id]||[]).filter(x=>x.sal_id===s.id).map(x=>x.url);
  const legacy=(s.foto||[]).filter(x=>typeof x==='string' && x.startsWith('data:'));
  return [...remote,...legacy];
}
// Report PDF dei SAL, come quello del sopralluogo: nell'anteprima una spunta per
// sezione (cliente, cantiere, descrizione, avanzamento, foto) e la scelta dei
// singoli SAL e delle singole foto. Senza "Cliente" spariscono anche le firme e
// la commessa (nel documento e nel nome del file).
// Il PDF si crea nel browser con jsPDF, non con la stampa: cosi' non compaiono
// l'indirizzo della pagina e la data del browser.
const SEZIONI_REPORT = ['cliente','cantiere','desc','perc','foto'];
// Logo dell'azienda in alto a destra (stesso file del report sopralluogo).
const LOGO_REPORT = 'logo-report.png';
const LOGO_MAX_W = 70, LOGO_MAX_H = 18; // mm
// Colori del report: stessi valori del report sopralluogo, separati da quelli dell'app.
const COLORI_REPORT = {accento:'#1E87C1', titoli:'#372476', riga:'#DDDDE6', fondino:'#F2F2F6', label:'#5A5A6E', grigio:'#8A8A99', testo:'#1A1612'};
const rgbReport = k => COLORI_REPORT[k].match(/\w\w/g).map(h=>parseInt(h,16));

function esc(t){ return String(t??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function dataIt(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:''; }

// Voci del report: i SAL dal piu' vecchio al piu' recente, ognuno con le sue foto.
// repEsclusi tiene i SAL e le foto tolti con la spunta (di base c'e' tutto).
let repVoci = [], repEsclusi = new Set();
function esportaSAL(){
  const c = getCantieri().find(x=>x.id===currentCantId);
  if(!c) return;
  const sal = c.sal||[];
  if(!sal.length){ toast('Nessun aggiornamento da esportare','err'); return; }
  repVoci = [...sal].reverse().sort((a,b)=>(a.data||'').localeCompare(b.data||''))
    .map((s,vi)=>({s, chiave:'s'+vi, foto:fotoMerged(c,s).map((url,fi)=>({url, chiave:'s'+vi+'_'+fi}))}));
  repEsclusi = new Set();
  SEZIONI_REPORT.forEach(k=>{ g('rep-'+k).checked = true; });
  g('rep-scelta').classList.remove('show');
  g('report-overlay').classList.add('show');
  aggiornaAnteprima();
}
function sezioneScelta(k){ return g('rep-'+k).checked; }
function scelto(chiave){ return !repEsclusi.has(chiave); }

// Scelta dei SAL e delle foto, sopra l'anteprima
function mostraScelta(){
  const el = g('rep-scelta');
  if(el.classList.contains('show')){ el.classList.remove('show'); aggiornaAnteprima(); return; }
  renderScelta(); el.classList.add('show'); el.scrollTop = 0;
  aggiornaBottoneScelta();
}
function renderScelta(){
  g('rep-scelta').innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Tocca una foto per toglierla o rimetterla. Togli la spunta a un SAL per lasciarlo fuori dal report.</div>` +
    repVoci.map((v,vi)=>{
      const on = scelto(v.chiave);
      const fotoHtml = v.foto.length
        ? `<div class="sc-azioni"><button onclick="tutteFoto(${vi},true)">Tutte</button><button onclick="tutteFoto(${vi},false)">Nessuna</button></div><div class="sc-grid">${v.foto.map(f=>{ const fon = scelto(f.chiave); return `<div class="sc-foto ${fon?'on':'off'}" onclick="cambiaFoto('${f.chiave}')"><img src="${esc(f.url)}" loading="lazy" alt=""><span class="sc-check">${fon?'✓':''}</span></div>`; }).join('')}</div>`
        : `<div class="sc-vuoto">Nessuna foto</div>`;
      return `<div class="sc-sal ${on?'':'spento'}">
        <label class="sc-head"><input type="checkbox" ${on?'checked':''} onchange="cambiaSal(${vi},this.checked)"> SAL del ${esc(dataIt(v.s.data)||'-')}${v.s.perc?` · ${esc(v.s.perc)}%`:''}${v.foto.length?` · ${v.foto.filter(f=>scelto(f.chiave)).length} di ${v.foto.length} foto`:''}</label>
        ${v.s.desc?`<div class="sc-desc">${esc(v.s.desc)}</div>`:''}
        ${fotoHtml}
      </div>`;
    }).join('') +
    `<button class="rep-btn print" style="width:100%;min-height:44px;margin-top:4px" onclick="mostraScelta()">✓ Fatto, vedi anteprima</button>`;
}
function cambiaSal(vi, on){ const k = repVoci[vi].chiave; if(on) repEsclusi.delete(k); else repEsclusi.add(k); renderScelta(); aggiornaBottoneScelta(); }
function cambiaFoto(chiave){ if(repEsclusi.has(chiave)) repEsclusi.delete(chiave); else repEsclusi.add(chiave); renderScelta(); aggiornaBottoneScelta(); }
function tutteFoto(vi, on){ repVoci[vi].foto.forEach(f=>{ if(on) repEsclusi.delete(f.chiave); else repEsclusi.add(f.chiave); }); renderScelta(); aggiornaBottoneScelta(); }
function aggiornaBottoneScelta(){
  const voci = repVoci.filter(v=>scelto(v.chiave));
  const tot = repVoci.reduce((a,v)=>a+v.foto.length,0);

    : `Scegli SAL e foto (${voci.length}/${repVoci.length} SAL` + (tot&&sezioneScelta('foto')?`, ${sel}/${tot} foto)`:')');
}

// Contenuto del report, uguale per anteprima e PDF.
function datiReport(){
  const c = getCantieri().find(x=>x.id===currentCantId) || {};
  const oggi = new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});
  const conCliente = sezioneScelta('cliente');
  const sezioni = [];
  if(conCliente)
    sezioni.push({titolo:'Cliente', righe:[['Cliente',c.cliente||'-'],['Commessa',c.commessa||'']].filter(r=>r[1])});
  if(sezioneScelta('cantiere')){
    const fine = c.dataFine ? ['Fine lavori',dataIt(c.dataFine)] : ['Fine lavori prevista',dataIt(c.dataFinePrevista)];
    sezioni.push({titolo:'Cantiere', righe:[['Indirizzo',c.indirizzo||'-'],['Responsabile',c.resp||''],['Inizio lavori',dataIt(c.dataInizio)],fine].filter(r=>r[1])});
  }
  const conDesc = sezioneScelta('desc'), conPerc = sezioneScelta('perc'), conFoto = sezioneScelta('foto');
  let num = 0;
  repVoci.filter(v=>scelto(v.chiave)).forEach(v=>{
    const foto = conFoto ? v.foto.filter(f=>scelto(f.chiave)).map(f=>({url:f.url, num:++num})) : [];
    const testo = conDesc ? (v.s.desc||'') : '';
    const perc = conPerc && v.s.perc ? ` - Avanzamento ${v.s.perc}%` : '';
    if(!testo && !foto.length && !perc) return;
    sezioni.push({titolo:`SAL del ${dataIt(v.s.data)||'-'}${perc}`, testo: testo||null, foto});
  });
  const nomeCommessa = (c.commessa||'senza_commessa').replace(/[^\w\-]+/g,'_');
  return {
    intestazione: 'STATO AVANZAMENTO LAVORI',
    sottotitolo: c.titolo||'',

    sezioni,
    firme: conCliente ? [[c.resp,'Responsabile cantiere'],[c.cliente,'Cliente - presa visione']] : null,
    nomeFile: conCliente ? `SAL_${nomeCommessa}_${oggi.replace(/\//g,'-')}.pdf` : `SAL_${oggi.replace(/\//g,'-')}.pdf`,
    titoloDoc: 'Stato avanzamento lavori'
  };
}

// jsPDF si carica solo quando serve (non pesa sull'apertura della pagina).
let jspdfPromise = null;
function caricaJsPDF(){
  if(window.jspdf) return Promise.resolve();
  if(!jspdfPromise) jspdfPromise = new Promise((ok,ko)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js';
    s.integrity = 'sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3';
    s.crossOrigin = 'anonymous';
    s.onload = ()=>ok();
    s.onerror = ()=>{ jspdfPromise = null; ko(new Error('jsPDF non caricato')); };
    document.head.appendChild(s);
  });
  return jspdfPromise;
}

// Scarica la foto e la riduce (max 1600 px, JPEG): il PDF resta leggero da inviare.
async function fotoPerPdf(url){
  const blob = await (await fetch(url)).blob();
  const src = URL.createObjectURL(blob);
  try{
    const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=src; });
    const k = Math.min(1, 1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    return {data:c.toDataURL('image/jpeg',0.82), w:c.width, h:c.height};
  } finally { URL.revokeObjectURL(src); }
}

// Logo per il PDF in PNG (tiene la trasparenza). null se il file non c'e'.
async function logoPerPdf(){
  const r = await fetch(LOGO_REPORT, {cache:'no-cache'});
  if(!r.ok) return null;
  const src = URL.createObjectURL(await r.blob());
  try{
    const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=src; });
    const k = Math.min(1, 800/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return {data:c.toDataURL('image/png'), w:c.width, h:c.height};
  } finally { URL.revokeObjectURL(src); }
}

// I font standard del PDF non hanno emoji e alcuni simboli: li sostituisco.
function testoPdf(t){
  return String(t??'')
    .replace(/[‘’‛]/g,"'").replace(/[“”]/g,'"')
    .replace(/[–—]/g,'-').replace(/…/g,'...').replace(/ /g,' ')
    .replace(/[^\n\x20-\x7E¡-ÿ€]/g,'');
}

async function esportaPdf(){
  const btn = g('rep-pdf');
  if(btn.disabled) return;
  btn.disabled = true; const etichetta = btn.textContent; btn.textContent = '⏳ Creo PDF...';
  try{
    const d = datiReport();
    if(!d.sezioni.length){ toast('Scegli almeno una sezione o un SAL da esportare','err'); return; }
    await caricaJsPDF();
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    pdf.setProperties({title:d.titoloDoc, creator:'CommessaPro'});
    const M = 12, W = 210-2*M, H = 297, FONDO = H-M-6;
    const ACCENTO=rgbReport('accento'), TITOLI=rgbReport('titoli'), GRIGIO=rgbReport('grigio'), RIGA=rgbReport('riga'), FONDINO=rgbReport('fondino'), LABEL=rgbReport('label'), TESTO=rgbReport('testo');
    let y = M;
    const pagina = h => { if(y+h>FONDO){ pdf.addPage(); y=M; return true; } return false; };
    const font = (stile,pt,col) => { pdf.setFont('helvetica',stile); pdf.setFontSize(pt); pdf.setTextColor(...col); };
    const LH = pt => pt*0.3528*1.45;

    // Intestazione: titolo e dati a sinistra, logo a destra (il testo non ci passa sotto).
    const logo = await logoPerPdf().catch(()=>null);
    let wTesto = W, fineLogo = y;
    if(logo){
      const k = Math.min(LOGO_MAX_W/logo.w, LOGO_MAX_H/logo.h), lw = logo.w*k, lh = logo.h*k;
      pdf.addImage(logo.data,'PNG',M+W-lw,y,lw,lh,undefined,'FAST');
      wTesto = W-lw-6; fineLogo = y+lh;
    }
    font('bold',14,TITOLI); pdf.text(d.intestazione, M, y+5); y += 7.5;
    font('normal',9.5,GRIGIO);
    [d.sottotitolo, d.info].filter(Boolean).forEach(r=>{
      pdf.splitTextToSize(testoPdf(r), wTesto).forEach(l=>{ pdf.text(l, M, y+3.5); y += LH(9.5); });
    });
    y = Math.max(y, fineLogo) + 2; pdf.setDrawColor(...ACCENTO); pdf.setLineWidth(0.8); pdf.line(M,y,M+W,y); y += 6;

    // Il titolo non resta mai da solo in fondo alla pagina: serve spazio anche per il contenuto.
    const titoloSez = (t, spazio) => {
      pagina(10+spazio);
      font('bold',7.5,TITOLI); pdf.text(testoPdf(t).toUpperCase(), M, y+2.5, {charSpace:0.5});
      y += 4; pdf.setDrawColor(...RIGA); pdf.setLineWidth(0.25); pdf.line(M,y,M+W,y); y += 2.5;
    };
    const tabella = (righe, colL) => {
      righe.forEach(r=>{
        font('normal',9.5,TESTO);
        const lv = pdf.splitTextToSize(testoPdf(r[1]), W-colL-4);
        const ll = pdf.splitTextToSize(testoPdf(r[0]), colL-4);
        const h = Math.max(lv.length, ll.length)*LH(9.5) + 3.4;
        pagina(h);
        pdf.setDrawColor(...RIGA); pdf.setLineWidth(0.25);
        pdf.setFillColor(...FONDINO); pdf.rect(M,y,colL,h,'FD'); pdf.rect(M+colL,y,W-colL,h);
        font('bold',9.5,LABEL); pdf.text(ll, M+2, y+4.2, {lineHeightFactor:1.45});
        font('normal',9.5,TESTO); pdf.text(lv, M+colL+2, y+4.2, {lineHeightFactor:1.45});
        y += h;
      });
      y += 4;
    };
    const testo = t => {
      font('normal',9.5,TESTO);
      pdf.splitTextToSize(testoPdf(t), W).forEach(l=>{ pagina(LH(9.5)); pdf.text(l, M, y+3.4); y += LH(9.5); });
      y += 4;
    };
    const griglia = async lista => {
      const GAP = 4, CW = (W-GAP)/2, MAXH = 62;
      let mancanti = 0;
      const immagini = await Promise.all(lista.map(f=>fotoPerPdf(f.url).catch(()=>{ mancanti++; return null; })));
      for(let i=0;i<immagini.length;i+=2){
        const coppia = [immagini[i], immagini[i+1]];
        const dim = coppia.map(im=>{ if(!im) return {w:CW,h:12}; const k=Math.min(CW/im.w, MAXH/im.h); return {w:im.w*k, h:im.h*k}; });
        const h = 4 + Math.max(...dim.map(x=>x.h));
        pagina(h+3);
        coppia.forEach((im,j)=>{
          if(i+j>=immagini.length) return;
          const x = M + j*(CW+GAP);
          font('bold',6,GRIGIO); pdf.text(`FOTO ${lista[i+j].num}`, x+CW/2, y+2.5, {align:'center', charSpace:0.3});
          if(im){
            const ix = x + (CW-dim[j].w)/2;
            pdf.addImage(im.data,'JPEG',ix,y+4,dim[j].w,dim[j].h,undefined,'FAST');
            pdf.setDrawColor(...RIGA); pdf.setLineWidth(0.25); pdf.rect(ix,y+4,dim[j].w,dim[j].h);
          } else {
            pdf.setDrawColor(...RIGA); pdf.rect(x,y+4,CW,12);
            font('normal',8,GRIGIO); pdf.text('Foto non disponibile', x+CW/2, y+11, {align:'center'});
          }
        });
        y += h + 3;
      }
      y += 2;
      return mancanti;
    };

    let mancanti = 0;
    for(const s of d.sezioni){
      // Titolo, descrizione e prima riga di foto restano sulla stessa pagina
      // (se la descrizione e' molto lunga si spezza comunque).
      let spazio = 12;
      if(!s.righe){
        font('normal',9.5,TESTO);
        const hTesto = s.testo ? pdf.splitTextToSize(testoPdf(s.testo), W).length*LH(9.5)+4 : 0;
        spazio = Math.min(200, Math.max(12, hTesto + (s.foto&&s.foto.length?70:0)));
      }
      titoloSez(s.titolo, spazio);
      if(s.righe) tabella(s.righe, W*0.28);
      else {
        if(s.testo) testo(s.testo);
        if(s.foto && s.foto.length) mancanti += await griglia(s.foto);
      }
    }

    if(d.firme){
      pagina(30); y += 4;
      pdf.setDrawColor(...RIGA); pdf.setLineWidth(0.25); pdf.line(M,y,M+W,y); y += 5;
      const CW = (W-6)/2;
      d.firme.forEach((f,j)=>{
        const x = M + j*(CW+6);
        font('bold',9.5,TESTO); pdf.text(testoPdf(f[0]), x, y+3.5);
        font('normal',8,GRIGIO); pdf.text(testoPdf(f[1]), x, y+9);
        pdf.setDrawColor(204,204,204); pdf.line(x, y+17, x+CW, y+17);
        pdf.text('Firma', x, y+21);
      });
      y += 24;
    }

    // Numero di pagina in fondo, nient'altro.
    const n = pdf.getNumberOfPages();
    for(let p=1;p<=n;p++){
      pdf.setPage(p); font('normal',7.5,GRIGIO);
      pdf.text(`Pagina ${p} di ${n}`, M+W, H-M+2, {align:'right'});
    }
    pdf.save(d.nomeFile);
    toast(mancanti ? `PDF creato, ${mancanti} foto non scaricate` : '✓ PDF creato', mancanti?'err':'ok');
  } catch(e){
    console.error(e);
    toast('PDF non creato: controlla la connessione e riprova','err');
  } finally {
    btn.disabled = false; btn.textContent = etichetta;
  }
}

// ── ESPORTA WORD: solo foto, griglia 2×2 da template ──
function fotoCoverJpeg(url){
  // Ritaglio centrale a 4:3 (equivalente di object-fit:cover nel riquadro 8×6cm)
  return new Promise((resolve,reject)=>{
    const img=new Image();
    if(/^https?:/i.test(url)) img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const W=800,H=600;
        const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
        const ctx=canvas.getContext('2d');
        const scala=Math.max(W/img.width,H/img.height);
        const w=img.width*scala,h=img.height*scala;
        ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
        canvas.toBlob(b=>b?b.arrayBuffer().then(resolve,reject):reject(new Error('toBlob fallito')),'image/jpeg',0.85);
      }catch(e){reject(e);}
    };
    img.onerror=()=>reject(new Error('immagine non caricata'));
    img.src=url;
  });
}

async function esportaWord(){
  const c=getCantieri().find(x=>x.id===currentCantId); if(!c)return;
  const sal=c.sal||[];
  // Lo storico è salvato dal più recente (unshift): inverto e ordino per data
  const entries=[...sal].reverse().sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const urls=entries.flatMap(s=>fotoMerged(c,s));
  if(!urls.length){toast('Nessuna foto da esportare','err');return;}
  if(!window.docx){toast('Libreria Word non caricata, controlla la connessione','err');return;}
  toast('📄 Generazione Word in corso...','inf');

  const buffers=[]; let saltate=0;
  for(const u of urls){
    try{ buffers.push(await fotoCoverJpeg(u)); }
    catch(e){ console.error('esportaWord: foto saltata',e); saltate++; }
  }
  if(!buffers.length){toast('Nessuna foto esportabile','err');return;}

  const {Document,Packer,Paragraph,TextRun,ImageRun,Table,TableRow,TableCell,WidthType,BorderStyle,AlignmentType}=window.docx;
  const CM=567;                       // 1 cm in twip
  const FOTO_W=302,FOTO_H=227;        // 8×6 cm in px a 96 DPI
  const NB={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const cellaFoto=(buf,num)=>new TableCell({
    width:{size:50,type:WidthType.PERCENTAGE},
    borders:{top:NB,bottom:NB,left:NB,right:NB},
    children:[
      new Paragraph({alignment:AlignmentType.CENTER,children:[new ImageRun({type:'jpg',data:buf,transformation:{width:FOTO_W,height:FOTO_H}})]}),
      new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:'foto '+num,bold:true,font:'Arial',size:16,color:'00B0F0'})]})
    ]
  });
  const cellaVuota=()=>new TableCell({
    width:{size:50,type:WidthType.PERCENTAGE},
    borders:{top:NB,bottom:NB,left:NB,right:NB},
    children:[new Paragraph({children:[]})]
  });

  const children=[
    new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:200},
      children:[new TextRun({text:c.titolo||c.cliente||'—',bold:true,font:'Arial',size:28})]})
  ];
  for(let p=0;p<buffers.length;p+=4){
    if(p>0) children.push(new Paragraph({pageBreakBefore:true,children:[]}));
    const rows=[];
    for(let r=p;r<Math.min(p+4,buffers.length);r+=2){
      const celle=[cellaFoto(buffers[r],r+1)];
      celle.push(buffers[r+1]&&r+1<p+4?cellaFoto(buffers[r+1],r+2):cellaVuota());
      rows.push(new TableRow({children:celle}));
    }
    children.push(new Table({
      width:{size:100,type:WidthType.PERCENTAGE},
      borders:{top:NB,bottom:NB,left:NB,right:NB,insideHorizontal:NB,insideVertical:NB},
      rows
    }));
  }

  const doc=new Document({sections:[{
    properties:{page:{margin:{top:CM,right:2*CM,bottom:2*CM,left:2*CM}}},
    children
  }]});

  const blob=await Packer.toBlob(doc);
  const nome=(c.titolo||c.cliente||'cantiere').replace(/[\\/:*?"<>|]+/g,'').trim().replace(/\s+/g,'-');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`SAL_${nome}_${new Date().toISOString().split('T')[0]}.docx`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast(saltate?`✅ Word generato (${saltate} foto saltate)`:'✅ Word generato','ok');
}



// ── ONBOARDING BANNER ──
function mostraOnboarding(){
  const cpUser = JSON.parse(localStorage.getItem('cp_user')||'{}');
  const key = 'ob_sal';
  if(localStorage.getItem(key)==='1') return;
  if(cpUser.email && localStorage.getItem(key+'_'+cpUser.email)==='1') return;
  const div = document.createElement('div');
  div.id = 'ob-banner';
  div.style.cssText = 'position:fixed;bottom:80px;left:12px;right:12px;background:#FFF3ED;border:1.5px solid #D4511E;border-radius:12px;padding:14px;font-size:13px;color:#1A1612;line-height:1.6;font-family:Epilogue,sans-serif;z-index:999;box-shadow:0 4px 20px rgba(212,81,30,0.2)';
  div.innerHTML = '<strong>📸 S.A.L.</strong> — Documenta l\'avanzamento dei lavori con foto e percentuale di completamento. Ogni aggiornamento crea uno storico fotografico del cantiere.<br><br><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:#D4511E"><input type="checkbox" onchange="if(this.checked){document.getElementById(\'ob-banner\').remove();localStorage.setItem(\'ob_sal\',\'1\');if(cpUser.email)localStorage.setItem(\'ob_sal_\'+cpUser.email,\'1\');}"> ✓ Ho capito, non mostrare più</label>';
  document.body.appendChild(div);
}

initDB();renderLista();
mostraOnboarding();
