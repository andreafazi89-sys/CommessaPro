<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CommessaPro">
<meta name="theme-color" content="#0F0D0A">
<link rel="icon" href="logo-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>I miei rapporti</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Epilogue:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="stile.css?v=2">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'Epilogue',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;}
.view{display:none;}.view.active{display:block;}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
.btn-back{color:var(--muted);background:none;border:none;cursor:pointer;font-size:22px;padding:0;}
.btn-top{background:var(--sand-dim);color:var(--sand);border:none;border-radius:10px;padding:7px 12px;min-height:40px;min-width:40px;font-family:Epilogue,sans-serif;font-size:13px;font-weight:500;cursor:pointer;}
.content{padding:16px 16px 120px;}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.sec-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sand);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-icon{width:28px;height:28px;background:var(--brick-dim);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.fg{margin-bottom:12px;}.fg:last-child{margin-bottom:0;}
label{display:block;font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
input,textarea,select{width:100%;padding:13px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--white);font-family:'Epilogue',sans-serif;font-size:16px;outline:none;-webkit-appearance:none;}
input:focus,textarea:focus,select:focus{border-color:var(--brick);}
input::placeholder,textarea::placeholder{color:var(--muted);}
textarea{resize:none;min-height:70px;line-height:1.5;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row-split{display:grid;grid-template-columns:2fr 1fr;gap:10px;}
.btn-main{width:100%;padding:16px;background:var(--brick);color:#fff;border:none;border-radius:var(--r);font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none;}
.btn-main:active{transform:scale(.98);}
.btn-main.green{background:var(--green);}
.btn-main.sec{background:var(--surface2);color:var(--white);border:1px solid var(--border);}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:100;display:flex;gap:10px;}
.bottom-bar .btn-main{flex:1;}
.toast.ok{background:var(--green);color:#fff;}
.toast.err{background:#C8441A;color:#fff;}
.toast.inf{background:var(--surface2);color:var(--white);border:1px solid var(--border);}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
/* Scelta del cantiere: titolo intero, cliente e indirizzo sotto */
.cant-pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:11px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-sm);text-align:left;cursor:pointer;font-family:'Epilogue',sans-serif;color:var(--white);}
.cant-pick:focus{border-color:var(--brick);outline:none;}
.cp-tit{font-size:16px;font-weight:600;line-height:1.3;}
.cp-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35;}
.cant-pick.vuoto .cp-tit{color:var(--muted);font-weight:400;}
.cp-freccia{color:var(--muted);font-size:14px;flex-shrink:0;}
.cant-sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:600;display:none;align-items:flex-end;}
.cant-sheet.show{display:flex;}
.cant-sheet-box{background:var(--bg);width:100%;max-height:85vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
.cant-sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);font-family:'Syne',sans-serif;font-size:16px;font-weight:700;}
.cant-sheet-head button{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;width:44px;height:44px;}
.cant-sheet-list{overflow-y:auto;padding:8px 12px 16px;}
.cant-opt{display:block;width:100%;text-align:left;padding:13px 14px;min-height:56px;margin-bottom:6px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-sm);cursor:pointer;font-family:'Epilogue',sans-serif;color:var(--white);}
.cant-gruppo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 4px 6px;}
.cant-opt.sel{border-color:var(--brick);background:var(--brick-dim);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-txt{font-size:15px;font-weight:500;color:var(--sand);margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--muted);}
/* Card rapporto (lista) */
.rpt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
.rpt-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px;}
.rpt-data{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.rpt-cant{font-size:13px;color:var(--sand);margin-top:2px;font-weight:500;}
.rpt-ore{font-size:13px;font-weight:700;color:var(--brick);background:var(--brick-dim);padding:4px 10px;border-radius:20px;white-space:nowrap;}
.rpt-desc{font-size:14px;line-height:1.5;color:var(--white);margin-top:4px;}
.rpt-sub{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic;}
.rpt-actions{display:flex;gap:8px;margin-top:10px;}
.rpt-btn{flex:1;padding:12px 8px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:Epilogue,sans-serif;}
.rpt-btn.edit{background:var(--sand-dim);color:var(--sand);}
.rpt-btn.del{background:var(--red-dim);color:var(--red);}
.rpt-btn.pdf{background:var(--green-dim);color:var(--green);border:1px solid var(--green);}
/* Bottoncino PDF sulla card aggregata (singolo contributo) */
.agg-riga-row{display:flex;align-items:center;gap:8px;}
.agg-riga-pdf{background:var(--green-dim);color:var(--green);border:1px solid var(--green);border-radius:8px;padding:7px 10px;min-height:34px;font-size:12px;font-weight:700;cursor:pointer;font-family:Epilogue,sans-serif;white-space:nowrap;}
/* Overlay anteprima PDF */
.report-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:#fff;display:none;flex-direction:column;}
.report-overlay.show{display:flex;}
.report-topbar{background:#1A1612;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rep-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.rep-actions{display:flex;gap:8px;}
.rep-btn{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:Epilogue,sans-serif;}
.rep-btn.close{background:rgba(255,255,255,.15);color:#fff;}
.rep-btn.print{background:#D4511E;color:#fff;}
.report-frame{flex:1;border:none;width:100%;background:#fff;}
/* Riga cantiere nel form (multi-riga) */
.riga-cant{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:10px;position:relative;}
.riga-cant .rc-num{position:absolute;top:10px;right:48px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;}
.riga-cant .rc-del{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 8px;}
.btn-add-riga{width:100%;padding:12px;background:transparent;color:var(--brick);border:2px dashed var(--brick);border-radius:var(--r-sm);font-family:Epilogue,sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;}
/* Chip colleghi (per riga) — stesso pattern di cantiere.html */
.op-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
.op-chip{padding:10px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;-webkit-user-select:none;}
.op-chip.on{background:var(--brick-dim);border-color:var(--brick);color:var(--brick);}
.op-empty-hint{font-size:12px;color:var(--muted);font-style:italic;padding:4px 0;}
.rpt-colleghi{font-size:13px;color:var(--sand);margin-top:6px;}
/* Badge totale ore nel form */
.tot-bar{background:var(--brick-dim);border:1px solid var(--brick);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--brick);}
.tot-bar .tot-val{font-family:'Syne',sans-serif;font-size:16px;}
/* Campo nome operaio bloccato (ruolo operaio) */
.op-locked{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:13px 14px;display:flex;align-items:center;gap:10px;}
.op-locked-icon{width:32px;height:32px;background:var(--brick-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--brick);font-weight:700;}
.op-locked-name{font-size:16px;font-weight:600;flex:1;}
.op-locked-hint{font-size:12px;color:var(--muted);margin-top:4px;}
/* Toggle I miei / Tutti (solo admin/capo) */
.filtro-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;}
.filtro-toggle button{flex:1;padding:10px;background:none;border:none;border-radius:7px;font-family:Epilogue,sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;}
.filtro-toggle button.on{background:var(--brick);color:#fff;}
.mese-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 10px;}
.mese-nav button{background:var(--surface2);border:1px solid var(--border);border-radius:8px;width:36px;height:32px;font-size:16px;cursor:pointer;color:var(--white);}
.mese-nav-txt{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;text-transform:capitalize;}
.mese-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);}
.mese-tab{border-collapse:collapse;font-size:11px;min-width:100%;}
.mese-tab th,.mese-tab td{border:1px solid var(--border);padding:4px 3px;text-align:center;min-width:26px;white-space:nowrap;}
.mese-tab th{background:var(--surface2);color:var(--muted);font-weight:600;}
.mese-tab .mt-nome{text-align:left;padding:4px 8px;position:sticky;left:0;background:var(--surface);font-weight:600;z-index:1;}
.mese-tab .mt-ok{background:var(--green-dim);color:var(--green);font-weight:700;}
.mese-tab .mt-col{background:var(--sand-dim);color:var(--sand);font-weight:700;}
.mese-tab .mt-manca{background:rgba(212,81,30,0.35);}
.mese-tab .mt-off{background:var(--surface2);color:var(--muted);}
.mese-tab .mt-tot{font-weight:700;}
.mese-leg{display:flex;flex-wrap:wrap;gap:10px;margin:10px 4px;font-size:11px;color:var(--muted);}
.mese-leg span{display:inline-flex;align-items:center;gap:4px;}
.mese-leg i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--border);}
.mese-pdf{display:block;width:100%;min-height:44px;margin:0 0 10px;background:var(--green-dim);color:var(--green);border:1px solid var(--green);border-radius:var(--r-sm);font-family:Epilogue,sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
/* Dove hanno lavorato: giorni in riga, operai in colonna */
.dv-tab{font-size:12px;}
.dv-tab th,.dv-tab td{padding:5px 8px;}
.dv-tab .dv-gg{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600;color:var(--muted);z-index:1;}
.dv-tab tr.dv-off td{background:var(--surface2);color:var(--muted);padding:2px 8px;}
.dv-voce{line-height:1.5;}
.dv-voce small{font-weight:400;margin-left:4px;opacity:.8;}
.dv-tit{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin:14px 4px 6px;}
.dv-elenco{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 16px;margin:0 4px;font-size:13px;}
.dv-elenco b{color:var(--brick);}
.dv-elenco span{color:var(--muted);}
/* Card aggregata (vista Tutti) */
.agg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
.agg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.agg-titolo{flex:1;min-width:0;}
.agg-data{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.agg-cant{font-size:13px;color:var(--sand);margin-top:2px;font-weight:500;}
.agg-tot{font-size:13px;font-weight:700;color:var(--brick);background:var(--brick-dim);padding:4px 10px;border-radius:20px;white-space:nowrap;}
.agg-operai{border-top:1px solid var(--border);padding-top:10px;}
.agg-riga{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 0;font-size:13px;}
.agg-riga:not(:last-child){border-bottom:1px dashed var(--border);}
.agg-op-nome{font-weight:600;min-width:110px;}
.agg-op-desc{flex:1;color:var(--muted);font-size:13px;line-height:1.4;}
.agg-op-ore{font-weight:700;color:var(--brick);white-space:nowrap;}
/* Intestazione data (con bottone/i rapportino giornaliero) */
.data-head{margin:18px 4px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.data-head-txt{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-right:6px;}
.data-head-pdf{background:var(--green-dim);color:var(--green);border:1px solid var(--green);border-radius:20px;padding:8px 14px;min-height:36px;font-family:Epilogue,sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.data-head-pdf:active{transform:scale(0.97);}
/* Rapportino salvato solo sul telefono, in attesa di arrivare al server */
.pill-attesa{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--amber-dim);color:var(--amber);}
</style>
</head>
<body>

<!-- VISTA LISTA -->
<div id="view-lista" class="view active">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="index.html" style="color:var(--muted);text-decoration:none;font-size:22px">←</a>
      <div class="topbar-title" id="lista-title">📝 I miei rapporti</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-top" onclick="forcSync()" title="Sincronizza">🔄</button>
    </div>
  </div>
  <div class="content">
    <div id="filtro-bar" style="display:none;margin-bottom:12px"></div>
    <div id="lista-container"></div>
  </div>
  <div class="bottom-bar">
    <button class="btn-main" id="btn-nuovo" onclick="nuovoRapporto()">➕ Nuova giornata</button>
  </div>
</div>

<!-- VISTA FORM -->
<div id="view-form" class="view">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-back" onclick="tornaLista()">←</button>
      <div class="topbar-title" id="form-title">Nuova giornata</div>
    </div>
  </div>
  <div class="content">
    <div class="section">
      <div class="sec-title"><div class="sec-icon">📅</div>Data giornata</div>
      <div class="fg"><input type="date" id="f-data"></div>
    </div>

    <div class="section">
      <div class="sec-title"><div class="sec-icon">👷</div>Operaio</div>
      <div class="fg" id="operaio-wrap">
        <!-- Renderizzato dinamicamente in base al ruolo -->
      </div>
    </div>

    <div class="section">
      <div class="sec-title"><div class="sec-icon">🏗️</div>Cantieri lavorati</div>
      <div class="tot-bar">
        <span>Totale ore giornata</span>
        <span class="tot-val" id="tot-ore">0h</span>
      </div>
      <div id="righe-container"></div>
      <button type="button" class="btn-add-riga" onclick="aggiungiRiga()">+ Aggiungi cantiere</button>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="btn-main sec" onclick="tornaLista()">Annulla</button>
    <button class="btn-main green" onclick="salvaRapporto()">✓ Salva</button>
  </div>
</div>

<div class="cant-sheet" id="cant-sheet" onclick="if(event.target===this)chiudiSceltaCantiere()">
  <div class="cant-sheet-box" role="dialog" aria-label="Scegli il cantiere">
    <div class="cant-sheet-head"><span>Scegli il cantiere</span><button type="button" onclick="chiudiSceltaCantiere()" aria-label="Chiudi">✕</button></div>
    <div class="cant-sheet-list" id="cant-sheet-list"></div>
  </div>
</div>

<div class="report-overlay" id="report-overlay">
  <div class="report-topbar">
    <div class="rep-title" id="rep-title">📄 Rapporto di Cantiere</div>
    <div class="rep-actions">
      <button class="rep-btn close" onclick="chiudiRapporto()">✕ Chiudi</button>
      <button class="rep-btn print" onclick="stampaRapporto()">🖨️ PDF</button>
    </div>
  </div>
  <iframe id="report-frame" class="report-frame"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
// ── GUARD AUTH: gira prima di qualsiasi lettura dati o render ──
(function(){
  let u=null; try{u=JSON.parse(localStorage.getItem('cp_user'))||null;}catch{}
  if(!u||!u.email) window.location.replace('login.html');
})();

// ── SUPABASE ──
const SUPA_URL = 'https://iradzlocobsipjazracw.supabase.co';
const SUPA_KEY = 'sb_publishable_zFgRrNrmYSORug8N06heow_6vjl0fhH';
const RPT_KEY = 'rapporti_v1';
const CANT_KEY = 'cantieri_v1';
let db = null;
let currentEditId = null;  // null = nuovo, altrimenti id del record in modifica
let rigaCounter = 0;       // contatore incrementale per le righe del form
// Elenco operai disponibili come "colleghi" (allineato con la select #f-operaio)
const OPERAI = ['Adrian Lup','Fabio Cardini','Daniele Schedel','Mihai Poveste','Vasile Banta'];
// Mappa rigaN -> array di nomi colleghi selezionati per quella riga
let colleghiPerRiga = {};

function initDB(){ if(window.supabase) db = window.supabase.createClient(SUPA_URL, SUPA_KEY); }

// Mostra un avviso fisso in cima alla pagina quando il server non e' raggiungibile
function mostraBanner(testo){
  let b = document.getElementById('banner-sync');
  if(!b){
    b = document.createElement('div');
    b.id = 'banner-sync';
    b.style.cssText = 'position:sticky;top:0;z-index:99;background:#C0392B;color:#fff;padding:10px 12px;font-size:13px;line-height:1.4;text-align:center';
    document.body.prepend(b);
  }
  b.textContent = testo;
}
function nascondiBanner(){
  const b = document.getElementById('banner-sync');
  if(b) b.remove();
}
// true se esiste una sessione Supabase valida: senza, ogni chiamata parte come anonima
async function verificaSessione(){
  if(!db) return false;
  const { data } = await db.auth.getSession();
  if(!data || !data.session){
    mostraBanner('Non sei collegato al server: i rapportini restano solo su questo dispositivo. Esci e rientra per sincronizzarli.');
    return false;
  }
  nascondiBanner();
  return true;
}
async function dbSalva(k, v){
  if(!db){ toast('\u26a0 Non sincronizzato: server non raggiungibile','err'); return false; }
  if(!(await verificaSessione())){
    toast('\u26a0 Sessione scaduta: salvato solo su questo dispositivo','err');
    return false;
  }
  const { error } = await db.from('dati').upsert({chiave:k, valore:v, ts:new Date().toISOString()}, {onConflict:'chiave'});
  if(error){
    console.error('dbSalva', k, error);
    toast('\u26a0 Non sincronizzato: ' + error.message, 'err');
    return false;
  }
  return true;
}
async function dbCarica(k){
  if(!db) return null;
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){
    console.error('dbCarica', k, error);
    toast('\u26a0 Lettura dal server non riuscita: ' + error.message, 'err');
    return null;
  }
  return data ? data.valore : null;
}
async function forcSync(){
  toast('🔄 Sincronizzazione...','inf');
  // Senza sessione valida non leggo e non scrivo nulla: meglio fermarsi che
  // svuotare gli elenchi locali con risposte vuote
  if(!(await verificaSessione())){

function __toastErr(msg){ toast('\u26a0\ufe0f ' + msg, 'err'); }

// ── SINCRONIZZAZIONE: scrittura chirurgica + coda offline ──
// Regola: la versione del server e' la base. Ogni dispositivo applica SOLO i
// record che ha appena toccato, quindi una copia locale vecchia non puo' piu'
// riportare indietro modifiche fatte altrove. Le cancellazioni sono marcature
// (eliminato:true) e non rimozioni, cosi' si propagano invece di tornare indietro.
function chiavePending(k){ return 'cp_pending_' + k; }
function getPending(k){ try{ return JSON.parse(localStorage.getItem(chiavePending(k))) || []; }catch{ return []; } }
function aggiungiPending(k, records){
  const m = new Map(getPending(k).map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(chiavePending(k), JSON.stringify([...m.values()]));
}
function svuotaPending(k){ localStorage.removeItem(chiavePending(k)); }
function scriviLocale(k, records){
  let attuali = [];
  try{ attuali = JSON.parse(localStorage.getItem(k)) || []; }catch(e){}
  const m = new Map(attuali.map(x => [x.id, x]));
  records.forEach(r => m.set(r.id, r));
  localStorage.setItem(k, JSON.stringify([...m.values()]));
}
function marcaEliminato(rec){ return {...rec, eliminato:true, timestamp:new Date().toISOString()}; }
async function salvaRecord(k, records){
  if(!Array.isArray(records) || !records.length) return true;
  scriviLocale(k, records);
  if(!db){ aggiungiPending(k, records); __toastErr('Salvato sul dispositivo, non ancora sincronizzato'); return false; }
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){
    console.error('salvaRecord lettura', k, error);
    aggiungiPending(k, records);
    __toastErr('Salvato sul dispositivo, non ancora sincronizzato');
    return false;
  }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const m = new Map(base.map(x => [x.id, x]));
  getPending(k).forEach(r => m.set(r.id, r));
  records.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  const ok = await dbSalva(k, finale);
  if(!ok){ aggiungiPending(k, records); return false; }
  svuotaPending(k);
  localStorage.setItem(k, JSON.stringify(finale));
  return true;
}
// Allinea la copia locale a quella del server, mantenendo le modifiche in coda
async function allinea(k){
  if(!db) return false;
  const { data, error } = await db.from('dati').select('valore').eq('chiave', k).maybeSingle();
  if(error){ console.error('allinea', k, error); __toastErr('Lettura dal server non riuscita: ' + error.message); return false; }
  const base = (data && Array.isArray(data.valore)) ? data.valore : [];
  const pend = getPending(k);
  const m = new Map(base.map(x => [x.id, x]));
  pend.forEach(r => m.set(r.id, r));
  const finale = [...m.values()];
  localStorage.setItem(k, JSON.stringify(finale));
  if(pend.length){
    const ok = await dbSalva(k, finale);
    if(ok) svuotaPending(k);
  }
  return true;
}

function getAttivitaFisse(){

function getCantieriAperti(){

// Dopo "Fine Cantiere" il cantiere resta selezionabile per GIORNI_DOPO_CHIUSURA
// giorni, per i rapportini arretrati. Senza dataFine non si sa quando e' stato chiuso.
const GIORNI_DOPO_CHIUSURA = 30;
function chiusoDaPoco(c){
  if(c.stato !== 'Completato' || !c.dataFine) return false;
  const fine = new Date(c.dataFine + 'T00:00:00');
  if(isNaN(fine)) return false;
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  return Math.round((oggi - fine) / 86400000) <= GIORNI_DOPO_CHIUSURA;
}
function getCantieriChiusiDaPoco(){
  return getCantieri().filter(c => !c.fisso && chiusoDaPoco(c));
}
// Stesso ordine dei sopralluoghi: commessa dalla piu' alta, l'ultimo cantiere in cima
function ordinaPerCommessa(a,b){
  const ca=(a.commessa||'').trim(), cb=(b.commessa||'').trim();
  if(!ca && !cb) return 0;
  if(!ca) return -1;
  if(!cb) return 1;
  return cb.localeCompare(ca,'it',{numeric:true,sensitivity:'base'});
}
// Cantieri aperti in ordine, poi quelli chiusi da poco; in modifica tiene anche
// il cantiere gia' scelto se nel frattempo e' stato completato, per non perderlo
function cantieriPerScelta(idPreset){
  const fisse = getAttivitaFisse().sort((a,b) => (a.titolo||'').localeCompare(b.titolo||'','it'));
  const lista = [...getCantieriAperti().sort(ordinaPerCommessa), ...getCantieriChiusiDaPoco().sort(ordinaPerCommessa), ...fisse];
  if(idPreset && !lista.some(c => c.id === idPreset)){
    const c = getCantieri().find(x => x.id === idPreset);
    if(c) lista.unshift(c);
  }
  return lista;
}
// Per gli operai: titolo del lavoro per intero, sotto cliente e indirizzo.
// Il numero di commessa non si mostra qui (resta nel rapportino e nel PDF).
function etichettaCantiere(c){
  const cliente = (c.cliente || '').split(' - ')[0].trim();
  const tit = c.titolo || c.cliente || 'Cantiere';
  if(c.fisso) return { tit, sub: 'Attività fissa' };
  const chiuso = c.stato === 'Completato' && c.dataFine ? 'Chiuso il ' + c.dataFine.split('-').reverse().join('/') : '';
  const sub = [chiuso, c.titolo ? cliente : '', c.indirizzo || ''].filter(Boolean).join(' · ');
  return { tit, sub };
}
function esc(t){ return String(t ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

// ── RIEPILOGO MESE (solo admin e ufficio) ──
// Griglia operai x giorni del mese, calcolata dai rapportini gia' in locale.
// Sola lettura: non salva nulla e non mostra avvisi agli operai.
// Verde = ore del rapportino proprio, nocciola = citato come collega (ore di chi l'ha citato),
// rosso = giorno lavorativo passato senza nulla, grigio = sabato, domenica, festivi.
let meseRiepilogo = null; // 'AAAA-MM'
// Vecchio nome di Mihai Poveste, ancora presente nei rapportini salvati prima della correzione
const ALIAS_OPERAI = {'Michele Poveste':'Mihai Poveste'};
function nomeOperaio(n){ const t = (n || '').trim(); return ALIAS_OPERAI[t] || t; }
function isoData(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
// Pasqua (algoritmo di Gauss/Meeus), serve per il Lunedi' dell'Angelo
function pasqua(y){
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), gg=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-gg+15)%30, i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  const mese=Math.floor((h+l-7*m+114)/31), giorno=((h+l-7*m+114)%31)+1;
  return new Date(y, mese-1, giorno);
}
// Festivita' nazionali piu' il 29/06 (Santi Pietro e Paolo, patrono di Roma)
function festivi(y){
  const f = ['01-01','01-06','04-25','05-01','06-02','06-29','08-15','11-01','12-08','12-25','12-26'].map(md => y + '-' + md);
  const lun = pasqua(y); lun.setDate(lun.getDate() + 1);
  f.push(isoData(lun));
  return new Set(f);
}
function cambiaMese(delta){
  const [y, m] = meseRiepilogo.split('-').map(Number);
  meseRiepilogo = isoData(new Date(y, m - 1 + delta, 1)).slice(0, 7);
  renderLista();
}
// Dati del mese scelto, comuni a "Riepilogo mese" e "Dove hanno lavorato"
function calcolaMese(){
  if(!meseRiepilogo) meseRiepilogo = isoData(new Date()).slice(0, 7);
  const [y, m] = meseRiepilogo.split('-').map(Number);
  const nGiorni = new Date(y, m, 0).getDate();
  const fest = festivi(y);
  const oggi = isoData(new Date());
  const tutti = getRapporti();
  // Primo giorno in cui ogni persona compare: prima di allora non risulta mancante
  const primaVolta = {};
  const segna = (nome, data) => { if(nome && data && (!primaVolta[nome] || data < primaVolta[nome])) primaVolta[nome] = data; };
  tutti.forEach(r => {
    segna(nomeOperaio(r.operaio), r.data);
    (Array.isArray(r.colleghi) ? r.colleghi : []).forEach(c => segna(nomeOperaio(c), r.data));
  });
  // Per ogni persona e giorno del mese: ore proprie, chi l'ha citata come collega
  // e le voci (cantiere e ore) per sapere dove ha lavorato
  const celle = {};
  const cella = (nome, data) => { celle[nome] = celle[nome] || {}; return celle[nome][data] = celle[nome][data] || {ore:0, oreCol:0, proprio:false, citatoDa:new Set(), voci:[]}; };
  tutti.filter(r => (r.data || '').slice(0, 7) === meseRiepilogo).forEach(r => {
    const op = nomeOperaio(r.operaio);
    const ore = parseFloat(r.ore) || 0;
    if(op){ const c = cella(op, r.data); c.proprio = true; c.ore += ore; c.voci.push({cantiereId:r.cantiereId, ore, col:false}); }
    (Array.isArray(r.colleghi) ? r.colleghi : []).forEach(n => {
      const nome = nomeOperaio(n);
      if(nome && nome !== op){ const c = cella(nome, r.data); c.citatoDa.add(op || '?'); c.oreCol += ore; c.voci.push({cantiereId:r.cantiereId, ore, col:true}); }
    });
  });
  const fineMese = meseRiepilogo + '-' + String(nGiorni).padStart(2, '0');
  const persone = [...new Set([...OPERAI.map(nomeOperaio), ...Object.keys(celle)])]
    .filter(n => primaVolta[n] && primaVolta[n] <= fineMese)
    .sort((a, b) => a.localeCompare(b, 'it'));
  const giorni = [];
  for(let d = 1; d <= nGiorni; d++){
    const dt = new Date(y, m - 1, d);
    const iso = isoData(dt);
    giorni.push({d, iso, lav: dt.getDay() !== 0 && dt.getDay() !== 6 && !fest.has(iso), sett:'DLMMGVS'[dt.getDay()], gs:['dom','lun','mar','mer','gio','ven','sab'][dt.getDay()]});
  }
  const titolo = new Date(y, m - 1, 1).toLocaleDateString('it-IT', {month:'long', year:'numeric'});
  const ultimo = tutti.map(r => r.data || '').filter(d => d.slice(0, 7) === meseRiepilogo).sort().pop() || '';
  return {celle, persone, giorni, primaVolta, oggi, titolo, ultimo};
}
const fmtOre = n => String(Math.round(n * 10) / 10).replace('.', ',');
const dataItIso = iso => iso.split('-').reverse().join('/');

// Tabella operai x giorni con le ore (usata a schermo e nel PDF)
function tabellaOre(M){
  const righe = M.persone.map(p => {
    let totOre = 0, mancanti = 0;
    const tds = M.giorni.map(gi => {
      const c = (M.celle[p] || {})[gi.iso];
      const dataIt = dataItIso(gi.iso);
      if(c && c.proprio){ totOre += c.ore; return `<td class="mt-ok" title="${esc(p)} - ${dataIt}: ${fmtOre(c.ore)} ore">${fmtOre(c.ore)}</td>`; }
      if(c && c.citatoDa.size){ totOre += c.oreCol; return `<td class="mt-col" title="${esc(p)} - ${dataIt}: citato come collega da ${esc([...c.citatoDa].join(', '))}, ${fmtOre(c.oreCol)} ore del suo rapportino">${fmtOre(c.oreCol)}</td>`; }
      if(!gi.lav) return '<td class="mt-off"></td>';
      if(gi.iso < M.oggi && gi.iso >= M.primaVolta[p]){ mancanti++; return `<td class="mt-manca" title="${esc(p)} - ${dataIt}: nessun rapportino"></td>`; }
      return '<td></td>';
    }).join('');
    return `<tr><td class="mt-nome">${esc(p)}</td>${tds}<td class="mt-tot">${fmtOre(totOre)}</td><td class="mt-tot">${mancanti || ''}</td></tr>`;
  }).join('');
  return `<table class="mese-tab">
      <thead><tr><th class="mt-nome">Operaio</th>${M.giorni.map(gi => `<th class="${gi.lav ? '' : 'mt-off'}">${gi.sett}<br>${gi.d}</th>`).join('')}<th>Ore</th><th>Mancanti</th></tr></thead>
      <tbody>${righe}</tbody>
    </table>`;
}
function legendaOre(){
  return `<div class="mese-leg">
      <span><i style="background:var(--green-dim)"></i>Ore dal suo rapportino</span>
      <span><i style="background:var(--sand-dim)"></i>Citato come collega (ore di chi l'ha citato)</span>
      <span><i style="background:rgba(212,81,30,0.35)"></i>Giorno lavorativo senza nulla</span>
      <span><i style="background:var(--surface2)"></i>Sabato, domenica, festivi</span>
    </div>`;
}

// Codice breve della commessa: solo il primo pezzo ("P0080/26 SCUOLA GERMANICA" -> "P0080/26").
// Attivita' fisse e cantieri senza commessa: il titolo.
function codiceCommessa(c){
  if(!c) return '?';
  const cod = (c.commessa || '').trim().split(/\s+/)[0];
  return (c.fisso || !cod) ? (c.titolo || c.cliente || '?') : cod;
}
// Tabella giorni x operai con la commessa di ogni giornata (usata a schermo e nel PDF)
function tabellaDove(M){
  const cantieri = getCantieri();
  const usati = new Map();
  const righe = M.giorni.map(gi => {
    const etich = `${gi.gs} ${dataItIso(gi.iso).slice(0, 5)}`;
    const qualcosa = M.persone.some(p => (M.celle[p] || {})[gi.iso]);
    if(!gi.lav && !qualcosa) return `<tr class="dv-off"><td class="dv-gg">${etich}</td>${M.persone.map(() => '<td></td>').join('')}</tr>`;
    const tds = M.persone.map(p => {
      const c = (M.celle[p] || {})[gi.iso];
      if(!c || !c.voci.length){
        return (gi.lav && gi.iso < M.oggi && gi.iso >= (M.primaVolta[p] || '9')) ? '<td class="mt-manca"></td>' : '<td></td>';
      }
      // Stessa commessa citata piu' volte nel giorno: una voce sola con le ore sommate
      const perCant = new Map();
      c.voci.forEach(v => {
        const x = perCant.get(v.cantiereId) || {ore:0, col:true};
        x.ore += v.ore; x.col = x.col && v.col;
        perCant.set(v.cantiereId, x);
      });
      const voci = [...perCant].map(([id, x]) => {
        const cant = cantieri.find(k => k.id === id);
        const cod = codiceCommessa(cant);
        if(cant) usati.set(cod, cant);
        return `<div class="dv-voce"><b>${esc(cod)}</b>${perCant.size > 1 ? `<small>${fmtOre(x.ore)} h</small>` : ''}</div>`;
      }).join('');
      return `<td class="${c.proprio ? 'mt-ok' : 'mt-col'}">${voci}</td>`;
    }).join('');
    return `<tr><td class="dv-gg">${etich}</td>${tds}</tr>`;
  }).join('');
  const elenco = [...usati].sort((a, b) => a[0].localeCompare(b[0], 'it', {numeric:true}))
    .map(([cod, c]) => `<div><b>${esc(cod)}</b> ${esc(c.fisso ? 'Attività fissa' : (c.titolo || ''))} <span>${esc((c.cliente || '').split(' - ')[0])}</span></div>`).join('');
  return {
    tab: `<table class="mese-tab dv-tab">
      <thead><tr><th class="dv-gg">Giorno</th>${M.persone.map(p => `<th>${esc(p)}</th>`).join('')}</tr></thead>
      <tbody>${righe}</tbody>
    </table>`,
    elenco: elenco ? `<div class="dv-tit">Commesse del mese</div><div class="dv-elenco">${elenco}</div>` : ''
  };
}
function legendaDove(){
  return `<div class="mese-leg">
      <span><i style="background:var(--green-dim)"></i>Dal suo rapportino</span>
      <span><i style="background:var(--sand-dim)"></i>Citato come collega</span>
      <span><i style="background:rgba(212,81,30,0.35)"></i>Giorno lavorativo senza nulla</span>
      <span>Ore indicate solo se nel giorno ci sono piu commesse</span>
    </div>`;
}

function navMese(M, tipo){
  return `<div class="mese-nav">
      <button type="button" onclick="cambiaMese(-1)" aria-label="Mese precedente">‹</button>
      <div class="mese-nav-txt">${M.titolo}</div>
      <button type="button" onclick="cambiaMese(1)" aria-label="Mese successivo">›</button>
    </div>
    ${M.persone.length ? `<button type="button" class="mese-pdf" onclick="esportaMesePDF('${tipo}')">📄 Esporta PDF</button>` : ''}`;
}
const VUOTO_MESE = '<div class="empty-state"><div class="empty-sub">Nessun rapportino in questo mese</div></div>';

function renderRiepilogoMese(el){
  const M = calcolaMese();
  el.innerHTML = navMese(M, 'ore') + (M.persone.length ? `<div class="mese-wrap">${tabellaOre(M)}</div>${legendaOre()}` : VUOTO_MESE);
}
function renderDoveMese(el){
  const M = calcolaMese();
  if(!M.persone.length){ el.innerHTML = navMese(M, 'dove') + VUOTO_MESE; return; }
  const D = tabellaDove(M);
  el.innerHTML = navMese(M, 'dove') + `<div class="mese-wrap">${D.tab}</div>${legendaDove()}${D.elenco}`;
}

// PDF del mese: stesso contenuto della scheda, su foglio bianco.
// Presenze in A4 orizzontale, commesse in A4 verticale.

  if(!vediRiepilogo()) return;
  const M = calcolaMese();
  const ore = tipo === 'ore';
  const titolo = (ore ? 'Presenze operai' : 'Dove hanno lavorato gli operai') + ' - ' + M.titolo;
  const D = ore ? null : tabellaDove(M);
  const corpo = ore ? tabellaOre(M) + legendaOre() : D.tab + legendaDove() + D.elenco;
  const oggiIt = new Date().toLocaleDateString('it-IT');
  const html = `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>${esc(titolo)}</title>
<style>
  @page { size: A4 ${ore ? 'landscape' : 'portrait'}; margin: 1cm; }
  :root { --green-dim:#dcefe1; --sand-dim:#efe5da; --surface2:#e6e6e6; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: Arial, sans-serif; color: #000; background: #fff; margin: 0; padding: 10px; }
  .fh { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px; }
  .fh b { font-size: 15pt; } .fh span { font-size: 9pt; color: #444; }
  table { width: 100%; border-collapse: collapse; font-size: ${ore ? '8pt' : '9pt'}; }
  th, td { border: 1px solid #777; padding: ${ore ? '2px 1px' : '2px 4px'}; text-align: center; white-space: nowrap; }
  th { background: #eee; font-weight: bold; }
  .mt-nome, .dv-gg { text-align: left; font-weight: bold; }
  .mt-ok { background: #dcefe1; font-weight: bold; } .mt-col { background: #efe5da; font-weight: bold; }
  .mt-manca { background: #f6c9b6; } .mt-off, .dv-off td { background: #e6e6e6; color: #555; }
  .mt-tot { font-weight: bold; }
  .dv-voce small { font-weight: normal; margin-left: 4px; }
  .mese-leg { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 8pt; color: #333; }
  .mese-leg i { display: inline-block; width: 10px; height: 10px; border: 1px solid #999; margin-right: 4px; vertical-align: -1px; }
  .dv-tit { font-weight: bold; font-size: 10pt; margin-top: 12px; }
  .dv-elenco { columns: 2; font-size: 8pt; margin-top: 4px; } .dv-elenco div { break-inside: avoid; margin-bottom: 2px; }
  .dv-elenco span { color: #555; }
  .pie { margin-top: 10px; font-size: 7pt; color: #666; text-align: right; }
</style></head><body>
<div class="fh"><b>${esc(titolo)}</b><span>${M.ultimo ? 'Rapportini fino al ' + dataItIso(M.ultimo) : ''}</span></div>
${corpo}
<div class="pie">Generato da CommessaPro il ${oggiIt}</div>
</body></html>`;
  const clean = s => (s || '').replace(/[^a-zA-Z0-9_-]/g, '_');
  mostraPDFOverlay(html, (ore ? 'Presenze_' : 'Commesse_operai_') + clean(meseRiepilogo), ore ? 'Presenze operai' : 'Dove hanno lavorato');
}
function tornaLista(){
  renderToggle();
  showView('lista');
  renderLista();
}

// ── FORM: nuovo / modifica ──
function nuovoRapporto(){
  if(!puoCompilare()){ toast('I rapportini li compilano gli operai','err'); return; }
  currentEditId = null;
  g('form-title').textContent = 'Nuova giornata';
  g('f-data').value = new Date().toISOString().split('T')[0];
  renderCampoOperaio();
  // Resetta righe
  g('righe-container').innerHTML = '';
  rigaCounter = 0;
  colleghiPerRiga = {};
  aggiungiRiga();
  showView('form');
}

function modificaRapporto(id){
  // Lo step 1 tratta ogni record come modifica singola (non riapriamo
  // tutte le righe del giorno: una riga = un rapporto da modificare)
  const r = getRapporti().find(x => x.id === id);
  if(!r){ toast('Rapporto non trovato','err'); return; }
  currentEditId = id;
  g('form-title').textContent = 'Modifica rapporto';
  g('f-data').value = r.data;
  renderCampoOperaio(nomeOperaio(r.operaio));
  g('righe-container').innerHTML = '';
  rigaCounter = 0;
  colleghiPerRiga = {};
  aggiungiRiga({cantiereId:r.cantiereId, ore:r.ore, descrizione:r.descrizione, subappaltatori:r.subappaltatori, colleghi:r.colleghi || []});
  showView('form');
}

function eliminaRapporto(id){
  if(!confirm('Confermi eliminazione del rapporto?')) return;
  const r = getRapporti().find(x => x.id === id);
  if(!r){ toast('Rapporto non trovato','err'); return; }
  salvaRecord(RPT_KEY, [marcaEliminato(r)]);
  renderLista();
  toast('Eliminato','inf');
}

// ── FORM: righe multi-cantiere ──
function aggiungiRiga(preset){
  rigaCounter++;
  const n = rigaCounter;
  const cantieri = cantieriPerScelta(preset && preset.cantiereId);
  const opts = cantieri.map(c => `<option value="${c.id}">${esc(etichettaCantiere(c).tit)}</option>`).join('');

  const inEdit = !!preset;
  const div = document.createElement('div');
  div.className = 'riga-cant';
  div.id = 'riga-' + n;
  div.innerHTML = `
    ${!inEdit ? `<button type="button" class="rc-del" onclick="rimuoviRiga(${n})" title="Rimuovi">✕</button>` : ''}
    <div class="rc-num">RIGA ${n}</div>
    <div class="fg" style="margin-top:16px">
      <label>Cantiere *</label>
      <button type="button" class="cant-pick vuoto" id="rc-pick-${n}" onclick="apriSceltaCantiere(${n})"></button>
      <select id="rc-cant-${n}" onchange="aggiornaTotale()" style="display:none" aria-hidden="true" tabindex="-1">
        <option value="">-- seleziona --</option>
        ${opts}
      </select>
    </div>
    <div class="fg">
      <label>Ore lavorate *</label>
      <input type="number" step="0.5" min="0" max="24" id="rc-ore-${n}" placeholder="Es. 8" oninput="aggiornaTotale()">
    </div>
    <div class="fg">
      <label>Descrizione lavori</label>
      <textarea id="rc-desc-${n}" placeholder="Cosa hai fatto oggi..."></textarea>
    </div>
    <div class="fg">
      <label>Subappaltatori (opzionale)</label>
      <input type="text" id="rc-sub-${n}" placeholder="Es. Ditta Rossi">
    </div>
    <div class="fg">
      <label>Colleghi presenti (opzionale)</label>
      <div class="op-grid" id="rc-coll-${n}"></div>
    </div>
  `;
  g('righe-container').appendChild(div);

  // Inizializza stato colleghi della riga (eventuale preset in modifica)
  colleghiPerRiga[n] = (preset && Array.isArray(preset.colleghi)) ? preset.colleghi.map(nomeOperaio) : [];
  renderColleghiChips(n);

  if(preset){
    g('rc-cant-'+n).value = preset.cantiereId || '';
    g('rc-ore-'+n).value = preset.ore || '';
    g('rc-desc-'+n).value = preset.descrizione || '';
    g('rc-sub-'+n).value = preset.subappaltatori || '';
  }
  aggiornaPickCantiere(n);
  aggiornaTotale();
}

function rimuoviRiga(n){
  const el = g('riga-'+n);
  if(!el) return;
  // Non permetto di eliminare se è l'unica riga
  const tot = document.querySelectorAll('.riga-cant').length;
  if(tot <= 1){ toast('Deve esserci almeno una riga','err'); return; }
  el.remove();
  delete colleghiPerRiga[n];
  aggiornaTotale();
}

// ── Colleghi per riga (chip selezionabili) ──
function renderColleghiChips(n){
  const cont = g('rc-coll-'+n);
  if(!cont) return;
  const principale = gv('f-operaio');
  const disponibili = OPERAI.filter(o => o !== principale);
  // Rimuovo dalla selezione eventuali nomi non più disponibili (es. è diventato l'operaio principale)
  const sel = (colleghiPerRiga[n] || []).filter(o => disponibili.includes(o));
  colleghiPerRiga[n] = sel;
  if(!disponibili.length){
    cont.innerHTML = '<div class="op-empty-hint">Nessun collega disponibile</div>';
    return;
  }
  cont.innerHTML = disponibili.map(op => {
    const on = sel.includes(op);
    return `<div class="op-chip ${on?'on':''}" onclick="toggleCollega(${n}, '${op.replace(/'/g,"\\'")}', this)">${op.split(' ')[0]}</div>`;
  }).join('');
}

function toggleCollega(n, nome, el){
  if(!colleghiPerRiga[n]) colleghiPerRiga[n] = [];
  const i = colleghiPerRiga[n].indexOf(nome);
  if(i >= 0) colleghiPerRiga[n].splice(i, 1);
  else colleghiPerRiga[n].push(nome);
  el.classList.toggle('on');
}

// Rigenera le chip in tutte le righe (utile quando cambia l'operaio principale)
function renderColleghiTutteRighe(){
  document.querySelectorAll('.riga-cant').forEach(div => {
    const n = parseInt(div.id.replace('riga-',''));
    if(!isNaN(n)) renderColleghiChips(n);
  });
}

function aggiornaTotale(){
  let tot = 0;
  document.querySelectorAll('[id^="rc-ore-"]').forEach(inp => {
    const v = parseFloat(inp.value);
    if(!isNaN(v)) tot += v;
  });
  g('tot-ore').textContent = tot + 'h';
}

function raccogliRighe(){
  // Legge tutte le righe visibili nel form e restituisce un array di oggetti
  const out = [];
  document.querySelectorAll('.riga-cant').forEach(div => {
    const n = div.id.replace('riga-', '');
    const cant = g('rc-cant-'+n)?.value || '';
    const ore = parseFloat(g('rc-ore-'+n)?.value || 0);
    const desc = g('rc-desc-'+n)?.value?.trim() || '';
    const sub = g('rc-sub-'+n)?.value?.trim() || '';
    const colleghi = Array.isArray(colleghiPerRiga[n]) ? [...colleghiPerRiga[n]] : [];
    if(cant || ore > 0 || desc) out.push({cantiereId:cant, ore, descrizione:desc, subappaltatori:sub, colleghi});
  });
  return out;
}

// ── SALVA ──
function salvaRapporto(){
  const data = gv('f-data');
  const operaio = gv('f-operaio');
  if(!data){ toast('Seleziona la data','err'); return; }
  if(!operaio){ toast('Seleziona l\'operaio','err'); return; }

  const righe = raccogliRighe();
  if(!righe.length){ toast('Aggiungi almeno una riga','err'); return; }

  // Validazione righe
  for(let i=0; i<righe.length; i++){
    const r = righe[i];
    if(!r.cantiereId){ toast(`Riga ${i+1}: seleziona un cantiere`,'err'); return; }
    if(!r.ore || r.ore <= 0){ toast(`Riga ${i+1}: inserisci le ore`,'err'); return; }
  }

  const cpUser = getCpUser();
  const autore = (cpUser.email || '').toLowerCase();
  const now = new Date().toISOString();

  const records = [];

  if(currentEditId){
    // Modifica: aggiorno il record esistente (prendo solo la prima riga in caso di modifica)
    const esistente = getRapporti().find(r => r.id === currentEditId);
    if(!esistente){ toast('Record non trovato','err'); return; }
    const r0 = righe[0];
    records.push({
      ...esistente,
      data, operaio,
      cantiereId: r0.cantiereId,
      ore: r0.ore,
      descrizione: r0.descrizione,
      subappaltatori: r0.subappaltatori,
      colleghi: Array.isArray(r0.colleghi) ? r0.colleghi : [],
      timestamp: now
    });
  } else {
    // Nuovo: creo N record, uno per riga
    righe.forEach((r, i) => {
      records.push({
        id: 'rpt_' + Date.now() + '_' + i,
        cantiereId: r.cantiereId,
        data, operaio,
        operaioEmail: autore,
        ore: r.ore,
        descrizione: r.descrizione,
        subappaltatori: r.subappaltatori,
        colleghi: Array.isArray(r.colleghi) ? r.colleghi : [],
        tipo: 'operaio',
        autore,
        timestamp: now
      });
    });
  }

  salvaRecord(RPT_KEY, records);
  toast(currentEditId ? '✓ Rapporto aggiornato' : `✓ Salvate ${righe.length} righe`, 'ok');
  setTimeout(() => tornaLista(), 600);
}

// Ritorna true se l'utente può scaricare il rapportino dell'operaio indicato
function puoScaricareRapporto(record){
  if(!record) return false;
  if(isPrivilegiato()) return true; // admin, direzione, ufficio: sempre ok
  const cpUser = getCpUser();
  const emailUtente = (cpUser.email || '').toLowerCase();
  const nomeUtente = cpUser.nome || '';
  // Operaio: può scaricare solo i record dove lui è l'operaio O dove è l'autore
  if((record.autore || '').toLowerCase() === emailUtente) return true;
  if((record.operaio || '') === nomeUtente) return true;
  return false;
}

// Costruisce l'HTML del PDF dato un set di lavorazioni (righe operai) + dati comuni.
// Parametri:
//   operai: array di {nome, ore, desc, commessa} (1..8)
//   subs: array di stringhe subappaltatori (0..5)
//   dataFmt: 'DD/MM/YYYY'
//   nomeCantiere: stringa in intestazione CANTIERE (vuota per rapportino giornaliero)
//   firma: nome da mostrare nel box FIRMA
//   totOre: totale ore da mostrare in riga "Totale ore"
//   commTot: commessa da mostrare nell'ultima cella (usare '' se multi-commessa)
function renderPDFHtml({operai, subs, dataFmt, nomeCantiere, firma, totOre, commTot}){
  // Righe operai: sempre 8 slot, compilo secondo operai[]
  let opRows = '';
  for(let i = 0; i < 8; i++){
    const op = operai[i];
    opRows += `<tr>
      <td class="cell cell-name">${op ? (op.nome || '&nbsp;') : '&nbsp;'}</td>
      <td class="cell cell-ore">${op ? op.ore : '&nbsp;'}</td>
      <td class="cell cell-desc">${op ? (op.desc || '&nbsp;') : '&nbsp;'}</td>
      <td class="cell cell-comm">${op ? (op.commessa || '&nbsp;') : '&nbsp;'}</td>
    </tr>`;
  }
  // Righe subappaltatori: sempre 5 slot
  let subRows = '';
  for(let i = 0; i < 5; i++){
    const s = (subs && subs[i]) || '';
    subRows += `<tr>
      <td class="cell cell-name">${s || '&nbsp;'}</td>
      <td class="cell cell-ore">&nbsp;</td>
      <td class="cell cell-desc">&nbsp;</td>
      <td class="cell cell-comm">&nbsp;</td>
    </tr>`;
  }
  return `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8">
<title>Rapporto di Cantiere — ${dataFmt}</title>
<style>
  @page { size: A4 landscape; margin: 1.2cm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Aptos Narrow', 'Arial Narrow', Arial, sans-serif; font-size: 12pt; color: #000; background: #fff; padding: 10px; }
  .report { width: 100%; max-width: 27cm; margin: 0 auto; }
  table.rpt { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.rpt td { border: 1px solid #000; padding: 4px 6px; vertical-align: middle; font-size: 12pt; font-family: 'Aptos Narrow','Arial Narrow',Arial,sans-serif; height: 22px; }
  .logo-cell { width: 31%; height: 50px; padding: 4px 8px !important; text-align: left; vertical-align: middle; }
  .logo-cell img { max-height: 38px; max-width: 100%; object-fit: contain; }
  .title-cell { width: 69%; font-weight: bold; text-align: center; font-size: 14pt; }
  .lbl { font-weight: bold; width: 8%; white-space: nowrap; }
  .val-cant { width: 46%; }
  .lbl-data { font-weight: bold; width: 7%; white-space: nowrap; }
  .val-data { width: 39%; }
  .hdr { font-weight: bold; background: #fafafa; }
  .cell-name { width: 31%; }
  .cell-ore { width: 8%; text-align: center; }
  .cell-desc { width: 46%; }
  .cell-comm { width: 15%; }
  .sub-hdr { font-weight: bold; background: #fafafa; }
  .tot-lbl { font-weight: bold; }
  .tot-val { font-weight: bold; text-align: center; }
  .firma-wrap { margin-top: 8px; display: flex; justify-content: flex-end; }
  .firma-box { width: 22%; border: 1px solid #000; }
  .firma-top { text-align: center; padding: 4px; border-bottom: 1px solid #000; height: 24px; font-weight: bold; }
  .firma-bot { height: 50px; padding: 4px; text-align: center; font-size: 11pt; }
  @media print {
    body { padding: 0; }
    .report { max-width: none; }
  }
</style>
</head><body>
<div class="report">
  <table class="rpt">
    <tr>
      <td class="logo-cell"><img src="${LOGO_PIERANTONI}" alt="Pierantoni"></td>
      <td class="title-cell" colspan="3">RAPPORTO DI CANTIERE</td>
    </tr>
    <tr>
      <td class="lbl">CANTIERE</td>
      <td class="val-cant">${nomeCantiere || '&nbsp;'}</td>
      <td class="lbl-data">Data:</td>
      <td class="val-data">${dataFmt}</td>
    </tr>
    <tr class="hdr">
      <td class="cell-name">Operai interni</td>
      <td class="cell-ore">Ore</td>
      <td class="cell-desc">Descrizione Lavori Eseguiti</td>
      <td class="cell-comm">Commessa</td>
    </tr>
    ${opRows}
    <tr class="sub-hdr">
      <td class="cell-name">Subappaltatori</td>
      <td class="cell-ore">&nbsp;</td>
      <td class="cell-desc">&nbsp;</td>
      <td class="cell-comm">&nbsp;</td>
    </tr>
    ${subRows}
    <tr>
      <td class="tot-lbl">Totale ore</td>
      <td class="tot-val">${totOre}</td>
      <td class="cell-desc">&nbsp;</td>
      <td class="cell-comm">${commTot || '&nbsp;'}</td>
    </tr>
  </table>
  <div class="firma-wrap">
    <div class="firma-box">
      <div class="firma-top">FIRMA</div>
      <div class="firma-bot">${firma || '&nbsp;'}</div>
    </div>
  </div>
</div>
</body></html>`;
}

// Mostra il PDF HTML nell'overlay e imposta il nome file suggerito
function mostraPDFOverlay(html, filename, titolo){
  g('rep-title').textContent = '📄 ' + (titolo || 'Rapporto di Cantiere');
  const frame = g('report-frame');
  const overlay = g('report-overlay');
  overlay.classList.add('show');
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  frame._filename = filename;
}

// ── Rapportino SINGOLO CONTRIBUTO (una lavorazione) ──
// Usato dalla vista "Tutti" e dal diario cantiere per il download singolo
function generaRapportoContributo(id){
  const record = getRapporti().find(r => r.id === id);
  if(!record){ toast('Record non trovato','err'); return; }
  if(!puoScaricareRapporto(record)){
    toast('⛔ Non puoi scaricare il rapportino di un altro operaio','err');
    return;
  }
  const cant = getCantieri().find(c => c.id === record.cantiereId);
  if(!cant){ toast('Cantiere non trovato','err'); return; }

  const dataFmt = new Date(record.data + 'T12:00:00').toLocaleDateString('it-IT');
  const commessa = cant.commessa || '';
  const nomeCantiere = commessa
    ? commessa + ' — ' + (cant.titolo || cant.cliente || '')
    : (cant.titolo || cant.cliente || '');
  const subs = record.subappaltatori
    ? record.subappaltatori.split(',').map(s => s.trim()).filter(Boolean)
    : [];

  // Compilatore in cima, poi i colleghi sotto (stesse ore + commessa, desc condivisa solo sul compilatore)
  const colleghi = Array.isArray(record.colleghi) ? record.colleghi.filter(c => c && c !== record.operaio) : [];
  const operai = [
    {nome: record.operaio, ore: record.ore, desc: record.descrizione || '', commessa},
    ...colleghi.map(c => ({nome: c, ore: record.ore, desc: '', commessa}))
  ];
  const html = renderPDFHtml({
    operai,
    subs,
    dataFmt,
    nomeCantiere,
    firma: (record.operaio || '').toUpperCase(),
    totOre: operai.reduce((s, o) => s + (parseFloat(o.ore) || 0), 0),
    commTot: commessa
  });

  const clean = s => (s || '').replace(/[^a-zA-Z0-9_-]/g, '_');
  const dataStr = dataFmt.replace(/\//g, '-');
  const filename = `Rapporto_${clean(record.operaio)}_${clean(commessa || 'cantiere')}_${dataStr}`;
  mostraPDFOverlay(html, filename);
}

// ── Rapportino GIORNALIERO dell'operaio ──
// Aggrega tutte le lavorazioni di un operaio in una data su più cantieri
function generaRapportoGiornaliero(operaio, data){
  const tutti = getRapporti().filter(r =>
    r.operaio === operaio && r.data === data
  );
  if(!tutti.length){ toast('Nessuna lavorazione per quella giornata','err'); return; }

  // Permesso: se sono operaio, posso farlo solo per me stesso
  if(!isPrivilegiato()){
    const cpUser = getCpUser();
    const mioNome = cpUser.nome || '';
    if(operaio !== mioNome){
      toast('⛔ Non puoi scaricare il rapportino di un altro operaio','err');
      return;
    }
  }

  const cantieri = getCantieri();
  const dataFmt = new Date(data + 'T12:00:00').toLocaleDateString('it-IT');

  // Per ogni lavorazione: prima il compilatore, poi i suoi colleghi (stesse ore + commessa, desc vuota)
  const operai = [];
  tutti.forEach(r => {
    const cant = cantieri.find(c => c.id === r.cantiereId);
    const commessa = cant ? (cant.commessa || '') : '';
    operai.push({ nome: r.operaio, ore: r.ore, desc: r.descrizione || '', commessa });
    const colleghi = Array.isArray(r.colleghi) ? r.colleghi.filter(c => c && c !== r.operaio) : [];
    colleghi.forEach(c => {
      operai.push({ nome: c, ore: r.ore, desc: '', commessa });
    });
  });
  // Subappaltatori unici da tutte le lavorazioni
  const subsSet = new Set();
  tutti.forEach(r => {
    if(r.subappaltatori){
      r.subappaltatori.split(',').map(s => s.trim()).filter(Boolean).forEach(s => subsSet.add(s));
    }
  });
  const subs = [...subsSet];

  // Totale ore: somma tutti gli operai (compilatori + colleghi)
  const totOre = operai.reduce((s, o) => s + (parseFloat(o.ore) || 0), 0);

  // CANTIERE in alto: vuoto (scelta utente: ogni lavorazione ha la sua commessa nella tabella)
  const html = renderPDFHtml({
    operai,
    subs,
    dataFmt,
    nomeCantiere: '',
    firma: (operaio || '').toUpperCase(),
    totOre,
    commTot: '' // multi-commessa, lascio vuoto
  });

  const clean = s => (s || '').replace(/[^a-zA-Z0-9_-]/g, '_');
  const dataStr = dataFmt.replace(/\//g, '-');
  const filename = `Rapporto_${clean(operaio)}_Giornaliero_${dataStr}`;
  mostraPDFOverlay(html, filename);
}

function chiudiRapporto(){
  g('report-overlay').classList.remove('show');
}

function stampaRapporto(){
  const frame = g('report-frame');
  if(!frame) return;
  try{
    const doc = frame.contentDocument || frame.contentWindow.document;
    if(frame._filename) doc.title = frame._filename;
  }catch(e){}
  frame.contentWindow.focus();
  frame.contentWindow.print();
}

// Permette di aprire rapportini da link esterno:
//   rapporto.html?pdf=ID_RECORD   → rapportino singolo contributo
//   rapporto.html?daily=NOME&date=YYYY-MM-DD  → rapportino giornaliero
(function apriDaQuery(){
  const qs = new URLSearchParams(window.location.search);

  const daily = qs.get('daily');

    setTimeout(() => generaRapportoContributo(pdfId), 300);
  } else if(daily && date){
    setTimeout(() => generaRapportoGiornaliero(daily, date), 300);
  }
})();
